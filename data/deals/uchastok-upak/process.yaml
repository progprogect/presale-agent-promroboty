# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
title: Путь пачки от выхода фасовочной линии до паллеты — каждая пачка уложена с подтверждённым кодом
columns:
- n: 1
  label: Вход с линии
- n: 2
  label: Поточное считывание
- n: 3
  label: Пост дочитывания
- n: 4
  label: Укладка и агрегация
- n: 5
  label: Заклейка и маркировка
- n: 6
  label: Палетирование
lanes:
- id: cl
  name: Оборудование заказчика
  sub: фасовочный автомат, чеквейер
  kind: client
- id: cell
  name: Участок укладки и палетирования
  sub: наша поставка — механика и роботы
  kind: ours
- id: sw
  name: ПО участка
  sub: наша поставка — ПЛК, трекинг, агрегация
  kind: ours
- id: op
  name: Оператор участка
  sub: что делает человек
  kind: human
steps:
- n: 1
  lane: cl
  id: s1
  title: Выход пачки с фасовочной линии
  desc: автомат формирует пачку-подушку с кодом Data Matrix на белом поле; пачки сходят плашмя, кодом
    вверх, стабильно (наблюдение на площадке)
  time: 50–90 пачек/мин
  note: при 90 пачках/мин такт линии 0,67 с на пачку; участок поток не трогает и не замедляет
- n: 1
  lane: sw
  id: s2
  title: Трекинг каждой пачки по энкодеру
  desc: координата пачки ведётся по импульсам энкодера конвейера от входа до укладки
  parallel: идёт непрерывно, в такт не добавляет
- n: 2
  lane: cell
  id: s3
  title: Поточное считывание с четырёх ракурсов
  desc: купол сверху, два боковых под 45° со скрещённой поляризацией, низкоугловой; чтение на ходу, потока
    не касается
  note: весь поток проходит этот шаг. Узлов стабилизации и разглаживания нет — пачки идут стабильно кодом
    вверх (принятое решение 28.10). Код, разрушенный физически (залом, стёртая краска), первая ступень
    не прочитает — такая пачка уходит на пост дочитывания
- n: 3
  lane: cell
  id: s4
  title: Отвод несчитанной пачки шлюзом
  desc: пневмотолкатель мягко сводит пачку на боковую дорожку поста (ёмкость 3 пачки); основной поток
    идёт дальше без пауз
  time: 0,2 с
  note: 'пик несчитанных сверх мощности поста уходит шлюзом сразу в тару разбора: темп линии не снижается
    никогда (шаг 9 сценария)'
- n: 3
  lane: cell
  id: s5
  title: Дочитывание манипулятором
  desc: SCARA берёт пачку сверху за края мягкими присосками (окно кода открыто), наклоняет на 15–30° и
    поворачивает перед двумя стационарными считывателями с купольной подсветкой, 3–4 позы
  time: 5,5 с/пачку
  note: мощность поста 11 пачек/мин — на потоке 90 закрывает долю несчитанных до ~10 % (с нормативным
    запасом — до ~8 %); фактическая доля — вопрос партнёру В1
- n: 3
  lane: cell
  id: s6
  title: Возврат в поток
  desc: дочитанная пачка ложится на дорожку возврата; сводящий модуль выпускает её в свободный промежуток
    перед зоной укладки — пачка в учёте подтверждена, двойного счёта нет
- n: 3
  lane: cell
  id: s7
  title: Вывод в тару разбора
  desc: пачка, не дочитанная во всех позах, уходит в тару; в журнал пишутся время, SKU и фото кода
- n: 3
  lane: op
  id: s8
  title: Разбор тары по сигналу
  desc: датчик заполнения зажигает колонну; оператор забирает тару и перемаркирует пачки штатной процедурой
  time: по мере заполнения
- n: 4
  lane: cell
  id: s9
  title: Формирование короба
  desc: эректор раскрывает плоскую заготовку, формует дно и подаёт открытый короб на позицию укладки
  time: до 8 коробов/мин
  parallel: идёт на своём конвейере, в такт укладки не добавляет
- n: 4
  lane: cell
  id: s10
  title: Укладка пачек дельта-роботом
  desc: двойной вакуумный захват берёт пачки с ленты по трекингу и ставит в короб вертикально, кодом вверх,
    по раскладке рецепта (4×4 = 16 пачек)
  time: 0,74 с/пачку
  note: 'двойной захват даёт 81 пачку/мин: закрывает 50 и 70 пачек/мин с запасом ≥15 %, поток 90 — нет
    (нужно 103+). На 90 — вторая дельта опцией; решение по фактической скорости линии (вопрос В5)'
- n: 4
  lane: sw
  id: s11
  title: Агрегация «пачка → короб»
  desc: состав короба ведётся по подтверждённым кодам и порядку укладки
  parallel: программная операция, в такт не добавляет
- n: 4
  lane: cell
  id: s12
  title: Верификация открытого короба
  desc: камера над коробом перечитывает все 16 кодов разом и сверяет состав с ожидаемым; неподтверждённая
    пачка извлекается роботом в тару разбора (сценарий А1)
  time: 1,2 с
- n: 5
  lane: cell
  id: s13
  title: Заклейка и этикетка агрегата
  desc: заклейщик закрывает короб (до 12 коробов/мин); принтер-аппликатор печатает и клеит этикетку короба,
    контрольный сканер проверяет её читаемость
- n: 5
  lane: sw
  id: s14
  title: Передача агрегата в учёт
  desc: код короба и связка «пачка → короб» уходят в систему маркировки заказчика (какое ПО — вопрос В6)
  parallel: программная операция, в такт не добавляет
- n: 6
  lane: cell
  id: s15
  title: Палетирование робота по схеме рецепта
  desc: робот-палетизатор ставит короб на поддон EUR; высокая укладка — 11 ярусов, верх ~2,13 м
  time: 8,3 с/короб
  note: занятость на потоке 90 пачек/мин — 78 % (запас 22 %, впритык к критерию); один участок — на одну
    линию
- n: 6
  lane: op
  id: s16
  title: Смена поддона и вывоз паллеты
  desc: по сигналу «поддон заполнен» оператор вывозит паллету и ставит пустой поддон; печатается паллетный
    лист
  time: ~2 мин каждые 8–14 мин
  note: на время смены короба копятся на буферном конвейере — укладка не останавливается (сценарий А3);
    АГВ — опция на будущее
flows:
- from: s1
  to: s3
- from: s1
  to: s2
  kind: par
- from: s3
  to: s10
  label: код прочитан
- from: s3
  to: s4
  label: не прочитан
- from: s4
  to: s5
- from: s5
  to: s6
  label: дочитан
- from: s5
  to: s7
  label: не дочитан
- from: s6
  to: s10
  label: в поток
- from: s7
  to: s8
- from: s9
  to: s10
  kind: par
  label: открытый короб
- from: s10
  to: s11
  kind: par
- from: s10
  to: s12
  label: короб полон
- from: s12
  to: s13
- from: s13
  to: s14
  kind: par
- from: s13
  to: s15
- from: s15
  to: s16
  label: поддон полон
cycle: шаги 1–3 и 10–16 проходит каждая пачка потока; шаги 4–8 — только пачки с несчитанным кодом. Поток
  50–90 пачек/мин (из задания; фактическую скорость уточняем — вопрос В5); при 16 пачках в коробе это
  3,1–5,6 короба/мин — короб каждые 11–19 с. Те же числа — в листе решения и в расчёте темпа.
key_figure: базовый состав (дельта-укладчик с двойным захватом, 81 пачка/мин) закрывает 50 и 70 пачек/мин
  с запасом ≥15 %; на 90 пачек/мин нужна вторая дельта (опция). Пост дочитывания — 11 пачек/мин; палетизатор
  на потоке 90 занят на 78 %.
bypass: при отказе или обслуживании участка поток идёт мимо на ручную укладку, как сегодня; линия не останавливается
  (сценарий А4)
