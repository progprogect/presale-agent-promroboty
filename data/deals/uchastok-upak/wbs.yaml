# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
roles:
- КД
- АСУ
- ПО
- ЭЛ
- МЕХ
- ГИП
role_names:
  КД: чертежи, расчёты, документация
  АСУ: ПЛК, HMI, программирование роботов, безопасность
  ПО: алгоритмы, зрение, агрегация, интеграция
  ЭЛ: шкаф, электропроект, электромонтаж
  МЕХ: изготовление, сборка, монтаж
  ГИП: план, закупка, согласования, сертификация, сдача
stages:
- name: Ф1-1. Обследование площадки и исходные данные
  phase: 1
  tasks:
  - id: '1.1'
    name: Обследование и снятие размеров на площадке
    phase: 1
    result: протокол обследования и обмерный план — планировка зоны, высоты и скорость конвейера линии,
      подводы 380 В и воздуха, пути вывоза паллет, санитарный режим зала
    basis:
      type: expert
      est: 16/24/32
    hours:
      КД: 16
      ГИП: 8
    note: выезд двух человек; командировка — в прочих прямых затратах
  - id: '1.2'
    name: Разбор матрицы SKU и проверка решения на всей номенклатуре
    phase: 1
    result: таблица по каждому SKU — размеры пачки, положение кода, раскладка в короб, схема паллеты,
      параметры захвата; форматы вне границ применимости выделены
    basis:
      type: analog
      ref: 'первая очередь: 1.7 «Разбор матрицы SKU» (КД 8 + ПО 16 = 24); у участка добавлены раскладка
        в короб и схема паллеты по каждому формату — 32'
    hours:
      КД: 16
      ПО: 16
  - id: '1.3'
    name: Частное техническое задание участка и фиксация вводных
    phase: 1
    result: подписанное частное ТЗ — скорость линии, матрица SKU, планировка, протокол ПО маркировки,
      критерии приёмки; вопросы к заводу закрыты через партнёра
    basis:
      type: analog
      ref: 'первая очередь: 10.4 «Частное техническое задание и его согласование» (КД 12 + ГИП 12) — принято
        один в один'
    hours:
      КД: 12
      ГИП: 12
- name: Ф1-2. Оптимизация компоновки и расчётная проверка
  phase: 1
  note: 'Пакет оптимизации компоновки выделен отдельно. Вход — конфликты компоновки v1 (реестр конфликтов
    габаритов состава): формирователь 2050×1950 и заклейщик 2640×920 в зоны v1 не вписываются, коробочная
    линия растёт с 3,1 до ~6 м.'
  tasks:
  - id: '2.1'
    name: Оптимизация компоновки под планировку заказчика
    phase: 1
    result: компоновка v2 на обмерном плане — серийные машины вписаны реальными габаритами, проходы и
      зоны обслуживания проверены, план размещения согласован с партнёром
    basis:
      type: expert
      est: 22/32/42
    hours:
      КД: 32
  - id: '2.2'
    name: Симуляция цикла в RoboDK на матрице SKU
    phase: 1
    result: протокол симуляции — досягаемость и коллизии трёх роботов, цикл дельты с двойным захватом
      на движущейся ленте, палетирование 11 ярусов; такт подтверждён на крайних форматах
    basis:
      type: analog
      ref: 'первая очередь: 1.8 «Проверка компоновки расчётом» (КД 16 + АСУ 8 = 24, один манипулятор);
        у участка три робота и подбор с движущейся ленты — 40'
    hours:
      КД: 16
      АСУ: 24
  - id: '2.3'
    name: Стендовая проверка группового чтения в коробе и захватов на образцах
    phase: 1
    result: протокол — камера 12 Мп читает 16 кодов в открытом коробе (или фиксируется потребность во
      второй камере, BOM OP-04), присоски держат пачку без смятия при повороте 90°
    basis:
      type: expert
      est: 16/24/32
    hours:
      ПО: 16
      МЕХ: 8
    note: выбор модели считывателя НЕ повторяется — сделан первой очередью (допущение Д1)
- name: Ф1-3. Конструкторская документация (22 узла собственной КД)
  phase: 1
  note: 'Зона 1 — по аналогам первой очереди БЕЗ прижимной ленты (2.4) и нижнего ракурса (2.6) — допущение
    Д2. Каждый пакет несёт поле bom: какие позиции состава (BOM) он закрывает.'
  tasks:
  - id: '3.1'
    name: Общий вид участка и монтажный план
    phase: 1
    result: чертёж общего вида участка 9×3 м, монтажный план с привязкой к линии и планировке, схема подводов
    basis:
      type: analog
      ref: 'первая очередь: 2.1 «Компоновка модуля и увязка с линией» (КД 32); у участка четыре зоны и
        две серийные машины — 40'
    hours:
      КД: 40
  - id: '3.2'
    name: КД рамы зон 1-1б из нержавеющей стали
    phase: 1
    result: сборочный чертёж рамы 2900×1850 со спецификацией, без карманов под санобработку
    basis:
      type: analog
      ref: 'первая очередь: 2.2 «Рама из нержавеющей стали на колёсах» (КД 36); здесь рама стационарная,
        без обшивки и колёс — 28'
    hours:
      КД: 28
    bom:
    - Z1-11
  - id: '3.3'
    name: КД входного участка ленты 2,7 м с энкодером и направляющими
    phase: 1
    result: сборочный чертёж транспортёра — привод с частотником, натяжение, установка энкодера, направляющие
      с регулировкой под SKU
    basis:
      type: analog
      ref: 'первая очередь: 2.3 «Транспортёрный участок с энкодером» (КД 36) — принят тот же объём, без
        разрыва под нижний ракурс (Д2), но с направляющими'
    hours:
      КД: 36
    bom:
    - Z1-07
    - Z1-08
    - Z1-09
  - id: '3.4'
    name: КД участка ленты 2,2 м под дельтой
    phase: 1
    result: сборочный чертёж второй секции ленты — окно подбора дельты, тот же энкодер
    basis:
      type: analog
      ref: 'первая очередь: 2.3 (КД 36); вторая секция той же конструкции — меняются длина и окно подбора,
        16'
    hours:
      КД: 16
    bom:
    - Z2-05
  - id: '3.5'
    name: КД кронштейнов юстировки, кожухов оптики и обдува
    phase: 1
    result: чертежи регулируемых кронштейнов и кожухов с обдувом на 9 оптических позиций (4 ракурса зоны
      1, 2 поста, камера верификации, камера дельты, контрольный сканер)
    basis:
      type: analog
      ref: 'первая очередь: 2.5 «Крепление и юстировка пяти считывателей» (КД 24); у участка девять позиций,
        но без узла нижнего ракурса (Д2) — 32'
    hours:
      КД: 32
    bom:
    - Z1-06
    - Z1-02
    - Z1-03
    - Z1-04
    - Z1B-06
    - Z1B-07
    - ZO-15
  - id: '3.6'
    name: КД дорожек поста дочитывания и обвязки шлюза
    phase: 1
    result: сборочные чертежи дорожки-накопителя на 3 пачки, дорожки возврата со сводящим модулем и кронштейна
      серийного пневмотолкателя
    basis:
      type: analog
      ref: 'первая очередь: 2.7 «Шлюз отвода и дорожка-накопитель» (КД 24) + 2.13 «Узел возврата пачки
        в поток» (КД 20) = 44; у участка шлюз покупной (серийный толкатель) — 36'
    hours:
      КД: 36
    bom:
    - Z1B-08
    - Z1B-09
    - Z1-10
  - id: '3.7'
    name: КД тумбы SCARA и тары ручного разбора
    phase: 1
    result: чертежи тумбы на отметку 900 мм с анкеровкой и тары 600×400×300 с датчиком заполнения
    basis:
      type: expert
      est: 8/12/16
    hours:
      КД: 12
    bom:
    - Z1B-04
    - Z1B-10
  - id: '3.8'
    name: КД вакуумного захвата SCARA
    phase: 1
    result: чертёж захвата с четырьмя мягкими присосками по углам и открытым окном кода, расчёт удерживающего
      усилия
    basis:
      type: analog
      ref: 'первая очередь: 2.9 «Вакуумный захват сильфонный пищевой» (КД 32); та же схема, адаптация
        под пачку кодом вверх — 24'
    hours:
      КД: 24
    bom:
    - Z1B-03
  - id: '3.9'
    name: КД портальной рамы дельты с расчётом жёсткости
    phase: 1
    result: сборочный чертёж портала 2300 мм под подвес дельты, расчёт жёсткости и резонансов по паспортным
      динамическим нагрузкам робота
    basis:
      type: expert
      est: 22/32/42
    hours:
      КД: 32
    bom:
    - Z2-03
  - id: '3.10'
    name: КД двойного вакуумного захвата дельты с поворотом 90°
    phase: 1
    result: чертёж двухголовочного захвата с пневмоповоротником (горизонталь → вертикаль), спецификация
      присосок и эжекторов, расчёт массы на фланце
    basis:
      type: analog
      ref: 'первая очередь: 2.9 (КД 32 — одиночная головка); здесь две головки и поворотник — 36'
    hours:
      КД: 36
    bom:
    - Z2-02
  - id: '3.11'
    name: КД коробочного конвейера и позиционера короба
    phase: 1
    result: сборочные чертежи приводного рольганга 3,1 м и позиционера (упор, пневмозажим, датчики) на
      позициях укладки и съёма
    basis:
      type: expert
      est: 26/36/46
    hours:
      КД: 36
    bom:
    - Z2-13
    - Z2-14
  - id: '3.12'
    name: КД тумбы палетизатора с расчётом на опрокидывание
    phase: 1
    result: чертёж сварной тумбы 400 мм с анкерами; расчёт на опрокидывание от динамики робота 680 кг
    basis:
      type: expert
      est: 10/16/22
    hours:
      КД: 16
    bom:
    - Z3-03
  - id: '3.13'
    name: КД вакуумной траверсы короба
    phase: 1
    result: чертёж траверсы 6-8 присосок по верхней плоскости короба, расчёт расхода эжекторов по пористому
      картону, контроль удержания
    basis:
      type: analog
      ref: 'первая очередь: 2.9 (КД 32); кинематика проще, добавлен расчёт по пористому картону — 24'
    hours:
      КД: 24
    bom:
    - Z3-04
  - id: '3.14'
    name: КД ограждения, дверей, ворот паллеты, кожухов и тары
    phase: 1
    result: чертежи контура 22,8 пог.м по ГОСТ ISO 13857 — три двери, ворота выдачи паллеты с блокировкой,
      туннельный кожух входа, ограничители поддона, тара изъятых пачек
    basis:
      type: analog
      ref: 'первая очередь: 2.10 «Тара, кожухи, ограждение» (КД 24) + 2.14 «Направляющие и туннельные
        кожухи» (КД 16) = 40; у участка периметр втрое длиннее, но без направляющих стабилизации — 40'
    hours:
      КД: 40
    bom:
    - ZO-01
    - ZO-02
    - ZO-03
    - Z3-05
    - Z3-07
    - Z2-15
  - id: '3.15'
    name: Пневматическая схема и спецификация пневматики
    phase: 1
    result: пневмосхема пяти вакуумных контуров (захваты SCARA, дельты ×2, траверса; толкатель, зажим
      короба, обдув), подбор эжекторов и клапанов, расчёт расхода воздуха
    basis:
      type: norm
      ref: ГОСТ 2.704 (правила выполнения пневмосхем); объём — против 16 ч первой очереди на один контур
        здесь пять контуров и обдув оптики
    hours:
      КД: 24
    bom:
    - ZO-14
  - id: '3.16'
    name: Сводная спецификация, ведомость покупных, нормоконтроль комплекта
    phase: 1
    result: комплект КД подписан — сводная спецификация на 63 позиции, ведомость покупных, замечания нормоконтроля
      закрыты; по комплекту можно производить
    basis:
      type: analog
      ref: 'первая очередь: 2.12 «Выпуск комплекта КД и нормоконтроль» (КД 24); у участка 63 позиции и
        22 узла собственной КД — 32'
    hours:
      КД: 32
  - id: '3.17'
    name: Задание заказчику на подготовку площадки
    phase: 1
    result: задание на подводы 380 В и сжатого воздуха 6 бар, кабельные трассы, нагрузку на пол, точку
      стыковки с конвейером линии и зону вывоза паллет
    basis:
      type: analog
      ref: 'первая очередь: 2.15 «Задание заказчику на подготовку площадки» (КД 8 + ЭЛ 4) — принято один
        в один'
    hours:
      КД: 8
      ЭЛ: 4
  - id: '3.18'
    name: Опросные листы и технические требования на закупку серийных машин и роботов
    phase: 1
    result: опросные листы с граничными условиями — формирователь и заклейщик (габарит, диапазон коробов,
      высота 180), принтер-аппликатор, три робота, считыватели; готовы к RFQ Фазы 2
    basis:
      type: expert
      est: 10/16/22
    hours:
      КД: 8
      ГИП: 8
    bom:
    - Z2-06
    - Z2-10
    - Z2-11
    - Z1B-01
    - Z2-01
    - Z3-01
    - Z1-01
    - Z1B-05
- name: Ф1-4. Электропроект и проект безопасности
  phase: 1
  tasks:
  - id: '4.1'
    name: Принципиальная электрическая схема участка
    phase: 1
    result: принципиальная схема силовых и сигнальных цепей — три робота, четыре привода конвейеров, две
      серийные машины, аппликатор; спецификация аппаратов
    basis:
      type: analog
      ref: 'первая очередь: 3.1 «Принципиальная электрическая схема» (ЭЛ 32, два привода); у участка втрое
        больше потребителей — 40'
    hours:
      ЭЛ: 40
    bom:
    - ZO-16
  - id: '4.2'
    name: Цепи безопасности и расчёт PL по ISO 13849-1
    phase: 1
    result: схема цепей безопасности (4 блокировки дверей и ворот, 6 кнопок останова, цепи трёх роботов
      и машин) и расчёт достигнутого PL по каждой функции, целевой PL d
    basis:
      type: norm
      ref: ISO 13849-1 (методика расчёта PL); ISO 10218-2; объём — против 24 ч первой очереди здесь три
        робота и четыре блокировки
    hours:
      ЭЛ: 32
    bom:
    - ZO-04
    - ZO-05
    - ZO-06
  - id: '4.3'
    name: Компоновка шкафа управления
    phase: 1
    result: сборочный чертёж нержавеющего шкафа со спецификацией — ПЛК, контроллер безопасности, 4 частотника,
      ПК, ИБП; тепловой расчёт, климатика под зал с мойкой
    basis:
      type: analog
      ref: 'первая очередь: 3.3 «Компоновка шкафа управления» (ЭЛ 24); аппаратов в полтора раза больше
        — 28'
    hours:
      ЭЛ: 28
    bom:
    - ZO-12
    - ZO-07
    - ZO-10
    - ZO-11
  - id: '4.4'
    name: Схема внешних подключений и кабельный журнал
    phase: 1
    result: схема подключений и кабельный журнал по участку 9 м — роботы, оптика, датчики, серийные машины;
      спецификация кабеля
    basis:
      type: norm
      ref: ПУЭ; внутренний чек-лист ЭМ-01; объём — против 20 ч первой очереди здесь втрое длиннее трассы
        и больше концов
    hours:
      ЭЛ: 28
  - id: '4.5'
    name: Расчёт SISTEMA и методика валидации функций безопасности
    phase: 1
    result: файл SISTEMA (B10d, MTTFd) по всем функциям безопасности и методика валидации по ГОСТ ISO
      13849-2 — протоколы заполняются на FAT
    basis:
      type: analog
      ref: 'первая очередь: 3.7 «Расчёт B10d и MTTFd в SISTEMA» (АСУ 16) + 3.8 «Методика валидации» (КД
        8 + АСУ 8); у участка функций больше — АСУ 24 + КД 8'
    hours:
      КД: 8
      АСУ: 24
- name: Ф1-5. Архитектура ПО, агрегации и ПМИ
  phase: 1
  tasks:
  - id: '5.1'
    name: Архитектура ПО участка и схема агрегации пачка-короб-паллета
    phase: 1
    result: описание архитектуры — трекинг, считывание, агрегация трёх уровней, журнал; модель данных
      и распределение функций ПЛК/ПК; схема сети
    basis:
      type: analog
      ref: 'первая очередь: 4.1 «Архитектура ПО и протокол обмена» (ПО 24); у участка три уровня агрегации
        и три робота — 32'
    hours:
      ПО: 32
    bom:
    - ZO-13
  - id: '5.2'
    name: Протокол обмена с ПО маркировки заказчика
    phase: 1
    result: протокол обмена (коды, агрегаты, квитирование) согласован письменно через партнёра, карта
      сообщений выпущена
    basis:
      type: analog
      ref: 'первая очередь: 4.15 «Согласование протокола обмена с владельцем системы маркировки» (ПО 16
        + ГИП 8) — принято один в один'
    hours:
      ПО: 16
      ГИП: 8
  - id: '5.3'
    name: ПМИ FAT и SAT участка
    phase: 1
    result: согласованные ПМИ заводских и площадочных испытаний — измеримые критерии (темп, доля дочитывания,
      целостность агрегации, переналадка ≤15 мин), правила зачёта 72 ч
    basis:
      type: analog
      ref: 'первая очередь: 7.1 «Программа и методика FAT» (ГИП 16) + 7.10 «ПМИ SAT и согласование» (КД
        4 + ГИП 12) = 32 — у участка столько же: критериев больше, методика та же'
