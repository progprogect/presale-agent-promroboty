questions:
- id: В4
  topic: Номенклатура
  q: сколько продуктов идёт через участок и каковы размеры пачек, коробов и схемы укладки
  why: матрицы SKU нет — размеры пачки (170×110×45), короба (400×300×180), раскладка 4×4 и 11 ярусов паллеты
    взяты по фото с площадки, а по ним посчитаны захваты, поле зрения камер, рецепты и досягаемость
  need: по каждому продукту — размеры и масса пачки, число пачек в коробе и схема укладки, размер короба,
    схема и высота паллеты
  status: ask
  ask_text: Сколько продуктов идёт через участок; по каждому — размеры и масса пачки, число пачек в коробе
    и схема укладки, размер короба. Вопрос передан партнёру.
  impact: форматы вне принятого диапазона меняют захваты, оснастку, рецепты и, в пределе, класс роботов;
    высота короба 180 мм — на нижней границе диапазона заклейщика
  risk: high
- id: В5
  topic: Производительность
  q: какова фактическая скорость линии и сколько линий должен закрыть участок
  why: расчёт ведётся на 50–90 пачек/мин из задания первой очереди; выбор между базовым составом и второй
    дельтой зависит именно от фактической скорости
  need: фактическая скорость (пачек/мин), число линий; укладка и палетирование — на одну линию или общие;
    видео отводящего конвейера на 20–30 с для замера темпа
  status: ask
  ask_text: Фактическая скорость линии (пачек/мин) и сколько линий закрывает участок? Полезно короткое
    видео работы отводящего конвейера. Вопрос передан партнёру.
  impact: при 90 пачках/мин базовый состав не даёт нормативного запаса — нужна вторая дельта (опция) и
    ≈ +80–120 ч работ; при двух линиях на один участок решение не масштабируется (палетизатор занят на
    78 % уже на одной)
  risk: high
- id: В7
  topic: Планировка
  q: сколько места можно отвести под участок и где ставятся паллеты
  why: компоновка v2 занимает ~11,4 × 3,4 м по ограждению плюс проходы, а планировка зала неизвестна —
    габарит уже вырос против первой версии из-за фактических размеров серийных машин
  need: длина × ширина зоны, привязка к линии, пути вывоза паллет; схема или фото планировки с размерами
  status: ask
  ask_text: Сколько места можно отвести под участок (длина × ширина) и где ставятся паллеты? Нужна схема
    или фото планировки с размерами. Вопрос передан партнёру.
  impact: если зона меньше габарита, компоновка переворачивается (Г- или П-образная), меняются конвейеры
    и ограждение; сверка заложена первым пакетом фазы КД
  risk: high
- id: В1
  topic: Доля несчитанных
  q: какая доля пачек сегодня не считывается с первого раза и что с ними делают
  why: мощность поста дочитывания — 11 пачек/мин; хватает ли её, определяет именно фактическая доля несчитанных
    (расчёт закрывает до ~10 % на потоке 90)
  need: доля несчитанных с первого раза и действия операторов сегодня
  status: ask
  ask_text: Какая доля пачек не считывается ручным сканером с первого раза и что с ними делают (подносят
    под другим углом, разглаживают, перемаркируют)? Вопрос передан партнёру.
  impact: при доле выше мощности поста избыток уходит в тару разбора — растёт объём ручной перемаркировки,
    хотя темп линии не падает
  risk: mid
- id: В2
  topic: Причины несчитывания
  q: каковы главные причины несчитывания по опыту операторов
  why: от распределения причин (блик, залом, дефект печати) зависит, сколько добирает пост дочитывания
    — физически разрушенный код не прочитает ни одна ступень
  need: причины по опыту операторов; 5–10 фото пачек, которые не считались
  status: ask
  ask_text: 'Главные причины несчитывания: блик плёнки, залом в зоне кода, дефект печати? Если можно —
    5–10 фото пачек, которые не считались. Вопрос передан партнёру.'
  impact: если преобладает дефект печати, процент дочитывания поста будет ниже ожиданий — это граница
    применимости, а не дефект решения
  risk: low
