  need: название и интерфейсы ПО маркировки; требуется ли паллетная агрегация
  status: ask
  ask_text: Какое ПО используется для агрегации (куда передавать связку «код пачки → код короба») и нужна
    ли агрегация на уровне паллеты? Вопрос передан партнёру.
  impact: от интерфейса зависит объём интеграции; паллетная агрегация добавляет паллетный лист и сканирование
