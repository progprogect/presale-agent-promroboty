  risk: mid
- id: В8
  topic: Короба
  q: допустим ли автомат формирования коробов из плоской заготовки и чем заклеивается короб
  why: в составе — эректор и заклейщик скотчем (серийные машины); если завод клеит клеем или использует
    самосборные короба, состав зоны 2 меняется
  need: тип заготовки короба, заклейка скотчем или клеем, схема и высота укладки на паллету
  status: ask
  ask_text: Допустим ли автомат формирования коробов из плоской заготовки; заклейка скотчем или клеем?
    Схема и высота укладки на паллету. Вопрос передан партнёру.
  impact: клеевая заклейка — другая машина; изменение высоты паллеты меняет проверку досягаемости палетизатора
  risk: mid
- id: Р1
  topic: Подача пачек
  q: как пачки приходят на участок и нужна ли их стабилизация перед считыванием
  why: от ориентации пачек зависит состав зоны считывания — нужны ли разглаживание, нижний ракурс и механика
    стабилизации
  status: answered
  answer: 'Пачки выходят с фасовочного автомата стабильно, плашмя, кодом вверх, код виден. Узлов стабилизации
    и разглаживания в составе НЕТ, нижнего ракурса НЕТ — участок поток не трогает и не замедляет. Пакеты
    прижимной ленты и нижнего ракурса в смету не включены. Граница: код, физически разрушенный заломом
    или стёртой краской, первая ступень не прочитает — такие пачки идут на пост дочитывания и далее в
    тару.'
  source: наблюдение на площадке; принятое решение 28.10.2026
  impact: если на части продуктов пачки окажутся нестабильными или кодом вниз, зона считывания дополняется
    — это проверяется матрицей SKU (В4) и фото (В2)
  risk: mid
