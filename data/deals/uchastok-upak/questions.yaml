  need: место и фон печати кода по каждому продукту
  status: ask
  ask_text: Код всегда печатается на обороте пачки на белом поле, одинаково по всем продуктам, или место
    и фон различаются? Вопрос передан партнёру.
  impact: при разном положении кода усложняются рецепты и логика предъявления на посту
  risk: mid
- id: В6
  topic: Учёт и маркировка
  q: какое ПО используется для агрегации и нужна ли агрегация на уровне паллеты
  why: участок передаёт связку «код пачки → код короба» в систему учёта заказчика — архитектура обмена
