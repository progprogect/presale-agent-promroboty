# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
summary: 'Участок закрывает путь продукта целиком: от выхода фасовочной линии до паллеты, с подтверждённым
  кодом у каждой пачки. Четыре зоны в одной ячейке длиной ~11,4 м и шириной ~3,2 м по ограждению. Зона
  1 — поточное считывание Data Matrix с четырёх ракурсов на ходу, без касания потока. Зона 1б — пост дочитывания:
  SCARA-манипулятор показывает несчитанную пачку двум стационарным считывателям под разными углами и возвращает
  её в поток подтверждённой, окончательно нечитаемые уходят в тару разбора с журналом. Зона 2 — дельта-робот
  с двойным вакуумным захватом укладывает пачки в короб вертикально кодом вверх; камера верификации перечитывает
  все коды в открытом коробе, заклейщик закрывает короб, принтер-аппликатор клеит этикетку агрегата. Зона
  3 — робот-палетизатор ставит короба на поддон высокой укладкой в 11 ярусов. Базовый состав рассчитан
  на 50–70 пачек/мин; на 90 пачек/мин вторая дельта предусмотрена опцией. Один участок обслуживает одну
  линию.'
nodes:
- name: Узел поточного считывания (4 ракурса)
  what: четыре считывателя Data Matrix — купол сверху, два боковых 45° с поляризацией, низкоугловой —
    плюс стробируемая подсветка с подавлением бликов; чтение на ходу
  why: 'купольный свет и скрещённая поляризация — отраслевой приём против блика металлизированной плёнки,
    проверенный в первой очереди проекта. Нижнего ракурса и прижимной ленты-разглаживателя нет: пачки
    сходят с автомата стабильно кодом вверх (наблюдение на площадке, принятое решение 28.10)'
- name: Конвейер пачек с трекингом (собственная КД)
  what: лента 300 мм с бортами, энкодер; ведёт координату каждой пачки от входа до укладки
  why: трекинг по энкодеру — основа учёта без двойного счёта; по нему работают шлюз, возврат с поста и
    съём пачек дельтой с движущейся ленты
- name: Пост дочитывания (SCARA + 2 считывателя)
  what: SCARA с вылетом 700 мм и вакуумным захватом за края пачки (окно кода открыто) наклоняет и поворачивает
    пачку перед двумя считывателями с купольной подсветкой; дорожки отвода и возврата, тара разбора
  why: у поста на пачку есть 5,5 с против долей секунды на ленте — отсюда прирост дочитывания на бликах
    и заломах. Возврат в свободный промежуток потока сохраняет учёт; пики сверх мощности поста уходят
    в тару — темп линии не снижается никогда
- name: Формирователь коробов (эректор)
  what: раскрывает плоскую заготовку, формует дно и подаёт открытый короб; магазин заготовок обращён к
    двери обслуживания — подсыпка без входа в рабочую зону
  why: серийная машина класса Hualian CXJ-40H12 с темпом до 8 коробов/мин при потребности 3,1–5,6 — покупаем,
    не конструируем; фактический габарит 2050×1950 мм уже вписан в компоновку v2
- name: Дельта-робот с двойным вакуумным захватом
  what: дельта класса Borunte BRTIRPL1608A (зона Ø1600) на портале над лентой и коробом; съём с движущейся
    ленты по трекингу, укладка в короб с поворотом пачки в вертикаль
  why: 'дельта — отраслевой стандарт скоростной укладки пачек-подушек (кейс-пакеры BluePrint Automation,
    Cama, Schubert). Двойной захват — расчётное решение: одиночный даёт 53 пачки/мин и не закрывает 70;
    двойной даёт 81 и закрывает 50 и 70 с запасом ≥15 %'
- name: Камера верификации над открытым коробом
  what: камера 12 Мп с купольной подсветкой перечитывает все 16 кодов разом и сверяет состав короба с
    ожидаемым, 1,2 с на короб
  why: контрольная перечитка в коробе — вторая ступень подтверждения поверх поточной схемы; неподтверждённая
    пачка извлекается роботом в тару (сценарий А1), брак в заклеенный короб не попадает
- name: Заклейщик и принтер-аппликатор
  what: заклейщик класса Hualian FXJ-5050ZX (до 12 коробов/мин) закрывает короб; аппликатор печатает и
    клеит этикетку агрегата, контрольный сканер проверяет её читаемость
  why: серийные машины с запасом по темпу; фактический габарит заклейщика 2640×920 мм вписан в компоновку
    v2 (линия коробов выросла до ~5 м)
- name: Робот-палетизатор на тумбе
  what: робот г/п 50 кг с вылетом 2,5 м (класс Inovance IR-R50-250S7) на тумбе 400 мм, вакуумная траверса
    по верхней плоскости короба; укладка на поддон EUR в 11 ярусов
  why: досягаемость проверена расчётом — дальний верхний угол паллеты 1942 мм при вылете 2500; занятость
    на потоке 90 — 78 %, поэтому один участок на одну линию
- name: Коробочный конвейер (собственная КД)
  what: роликовый конвейер на высоте 600 мм от эректора через позицию укладки, верификацию и заклейку
    до съёмной позиции палетизатора, с буфером
  why: высота 600 мм ниже ленты пачек (900 мм) — дельта кладёт пачку вниз в короб; буфер закрывает смену
    поддона (~2 мин) без остановки укладки
- name: Ограждение, безопасность, шкаф управления, ПО участка
  what: периметральное ограждение ~11,4×3,2 м с туннельным входом ленты, воротами выхода паллеты и дверями
    с блокировкой; ПЛК, HMI с рецептами SKU, ПО трекинга и агрегации
  why: безопасность геометрией (ГОСТ ISO 13857), без световых завес — как в первой очереди; рецепты SKU
    дают переналадку выбором на HMI (цель ≤15 мин по заданию)
rejected:
- option: Узел стабилизации и разглаживания пачек перед считыванием
  why: пачки выходят с фасовочного автомата стабильно, плашмя, кодом вверх (наблюдение на площадке) —
    узел не нужен и только усложнил бы участок на высокой скорости потока. Граница честно названа — физически
    разрушенный код не прочитает ни одна ступень
- option: Подтверждение кодов только групповым считыванием в коробе (агрегация в коробе)
  why: закрыта в пользу поточной схемы — каждая пачка подтверждена ДО укладки, перечитка в коробе остаётся
    контрольной. Иначе нечитаемая пачка обнаруживалась бы только в полном коробе и каждый такой случай
    останавливал бы укладку на разбор короба
- option: Одиночный захват дельта-робота
  why: по расчёту 53 пачки/мин — закрывает только 50 и без запаса; двойной захват даёт 81
- option: Вторая дельта в базовом составе
  why: на 50–70 пачек/мин избыточна; остаётся опцией до ответа по фактической скорости линии (вопрос В5).
    Третья позиция захвата (опция) даёт ≈98 пачек/мин — поток 90 закрыт, но с запасом всего ~9 % при критерии
    15 %
- option: Шестиосевой робот вместо дельты на укладке
  why: при 50–90 съёмах/мин с движущейся ленты шестиосевой не держит темп, который для дельты штатный;
    шестиосевой оставлен там, где нужны ход и грузоподъёмность, — на палетировании
- option: Палетирование общее на несколько линий
  why: палетизатор на потоке 90 занят на 78 % — вторую линию не возьмёт; закладывается один участок на
    одну линию
proof:
- 'Досягаемость: 15 проверок по компоновке v2 — провалов 0 (SCARA — дальняя точка 550 мм при вылете 700;
  дельта — съём 566 мм при пределе 800; палетизатор — дальний верхний угол паллеты 1942 мм при вылете
  2500, обратная кинематика поз сходится с ошибкой 0,0 мм)'
- 'Темп по паспортным циклам: дельта с двойным захватом 0,74 с/пачку (81/мин) — закрывает 50 и 70 пачек/мин
  с запасом ≥15 %; эректор 8 и заклейщик 12 коробов/мин при потребности 3,1–5,6; палетизатор 8,3 с/короб
  — проходит на всех потоках, на 90 занят на 78 %'
- 'Пост дочитывания: цикл 5,5 с (11 пачек/мин) — на потоке 90 закрывает долю несчитанных до ~10 %, с нормативным
  запасом до ~8 %; выше — избыток уходит в тару разбора по сценарию'
- 'Отраслевые аналоги: укладка пачек-подушек в короба дельта-роботами с видеотрекингом — серийная задача
  кейс-пакеров (BluePrint Automation, Cama, Schubert) — подтверждено на уровне серийных изделий; групповое
  считывание кодов в открытом коробе — штатная практика систем агрегации маркировки в ЕАЭС — оценка, проверяется
  на первоисточниках'
- 'Оговорка: это расчёт по паспортным характеристикам и геометрии, а не симуляция на номенклатуре заказчика
  — матрицы SKU и фактической скорости линии пока нет. Симуляция RoboDK на реальной номенклатуре — первый
  шаг фазы КД'
limits:
- 'Поток 90 пачек/мин базовый состав не закрывает с нормативным запасом: нужна вторая дельта (опция, ≈
  +80–120 ч работ сверх сметы) либо третья позиция захвата (опция, запас всего ~9 %). Решается фактической
  скоростью линии — вопрос В5'
- Габарит участка ~11,4 × 3,2 м по ограждению плюс проходы; планировка заказчика неизвестна (вопрос В7)
  — сверка и оптимизация компоновки заложены первым пакетом фазы КД. Серийные габариты эректора и заклейщика
  уже потребовали роста против первой версии компоновки (8,8 × 2,6 м)
- 'Размеры пачки (170×110×45), короба (400×300×180), раскладка 4×4 и 11 ярусов паллеты — по фото с площадки,
  матрица SKU не получена (вопрос В4). Высота короба 180 мм — на нижней границе диапазона заклейщика:
  подтвердить у поставщика и матрицей SKU'
- Код, физически разрушенный (залом с разрывом краски, стёртая печать), не прочитает ни одна ступень —
  такие пачки идут в тару разбора с журналом (время, SKU, фото)
- Один участок обслуживает одну линию; на несколько линий палетизатор и укладчик не делятся (занятость
  палетизатора 78 % на потоке 90)
- 'Участок считается расширением той же сделки: выбор модели считывателя и испытания оптики на образцах
  не повторяются. Если участок пойдёт отдельно, без первой очереди, — добавится выбор прибора (≈84 ч)
  и закупка демо-образцов'
- Шеф-монтаж поставщиков серийных машин не закупается — монтируем сами по руководствам; если поставщик
  привяжет гарантию к шеф-монтажу, добавятся внешние деньги
- Сертификация (декларация ТР ТС 010, доказательная база 004/020) — оценка по аналогии первой очереди;
  испытания выездные, участок в лабораторию не возится
- 'Командировки посчитаны на плечо первой очереди: адрес площадки — открытое вводное, при удалённой площадке
  пересчитать'
- 'Среда: дельта-робот базового класса — IP40, 0–40 °C, без конденсата; мойка струёй в зоне участка недопустима
  — условия зала уточняются вместе с планировкой (В7)'
