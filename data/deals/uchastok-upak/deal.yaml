slug: uchastok-upak
code: УЧАСТОК УПАКОВКИ
title: Участок автоматической укладки и палетирования
version: компоновка v2
updated: '2026-10-28'
status: рабочая гипотеза
note: Участок от выхода фасовочной линии до паллеты — поточное считывание кодов, пост дочитывания,
  укладка пачек в короба с агрегацией, заклейка и маркировка, палетирование.
context: 'Расширение проекта узла повторного считывания кодов (отдельная карточка) до участка целиком:
  от выхода фасовочной линии до паллеты. Каждая пачка укладывается в короб с подтверждённым кодом
  Data Matrix; связка «пачка → короб» передаётся в систему учёта. Четыре зоны в одной ячейке
  ~11,4 × 3,4 м: поточное считывание с четырёх ракурсов на ходу; пост дочитывания с манипулятором
  для несчитанных пачек; дельта-робот укладывает пачки в короб, камера верифицирует все коды
  в открытом коробе, заклейщик и принтер-аппликатор закрывают и маркируют короб; робот-палетизатор
  ставит короба на поддон в 11 ярусов. Поток 50–90 пачек/мин; базовый состав рассчитан на 50–70,
  на 90 — вторая дельта опцией. Задания как документа нет: объём определён по запросу партнёра
  и материалам с площадки, ключевые вводные ещё открыты — до ответов компоновка остаётся рабочей
  гипотезой. Работы разбиты на две фазы: Фаза 1 — конструкторская документация, Фаза 2 — внедрение.'
questions:
  questions:
  - Вопросы В1–В8 переданы партнёру — верно ли расставлены цены ошибки, чего в списке не хватает?
  - Предположения Д1–Д7 — какое из них вы считаете неверным?
  - Принятые решения Р1–Р3 (без узла стабилизации, пост дочитывания в составе, поточная схема) —
    согласны ли вы с ними по опыту таких линий?
  process:
  - Последовательность — что идёт не в том месте потока, где происходит на самом деле.
  - Параллельность — что мы считаем одновременным зря, а что можно совместить.
  - Граница поставки — верно ли показано, что делает линия заказчика и что человек.
  solution:
  - Узлы — что лишнее, чего не хватает, что решается проще.
  - 'Темп — двойной захват дельты на 50–70 пачек/мин и вторая дельта опцией на 90: согласны с развилкой?'
  - Отклонённые варианты — какой отбросили зря и почему.
  - Границы применимости — что ещё всплывёт на приёмке и здесь не названо.
  wbs:
  - Полнота — какие работы, этапы или зависимости пропущены?
  - Часы — где оценка нереалистична (мало или много)? Поправьте кнопками и коротко напишите почему.
  - Деление на фазы (КД / внедрение) — верно ли разложены пакеты по фазам?
  - Риски — что может сорвать сроки или объём и не отражено в пакетах?
  bom:
  - Состав — чего не хватает, что лишнее?
  - Картонажные машины (эректор, заклейщик) и роботы — надёжны ли предложенные классы и каналы поставки?
  - Цена и срок — где дешевле или быстрее? Впишите в правую колонку.
  - Опции (вторая дельта, третья позиция захвата, вторая позиция паллеты) — что из них вы бы
    перевели в базовый состав и почему?
notes:
  questions: 'Красное — вопросы, переданные партнёру (прямого канала к заводу нет); жёлтое — принятые
    нами предположения с основанием. До ответов на вопросы с высокой ценой ошибки компоновка —
    рабочая гипотеза, и каждое предположение дойдёт до предложения оговоркой или границей применимости.'
  process: Времена у шагов — из расчёта темпа по паспортным характеристикам узлов. Шаги поста
    дочитывания проходит не весь поток, а только пачки с несчитанным кодом; долю несчитанных
    уточняем (вопрос В1).
  solution: Это черновик раздела предложения «Почему именно такая компоновка». Темп и досягаемость
    проверены расчётом по паспортным циклам и геометрии; симуляция на реальной номенклатуре —
    первый шаг фазы КД, после получения матрицы SKU.
  wbs: 'Работы в двух фазах: Фаза 1 — конструкторская документация (этапы Ф1-1…Ф1-5), Фаза 2 —
    внедрение (Ф2-6…Ф2-15); УП-14 — управление проектом на обе фазы. Основания часов: 112 пакетов
    по аналогу со ссылкой на строку прошлого проекта, 4 по нормативу, 24 экспертно с трёхточечной
    оценкой. Резерв 12 % применяется к итогу, а не к каждой строке.'
  bom: 'Цены — закупка в BYN без наценки; у большинства позиций — вилка до ответов поставщиков.
    Группа «Опции» в итог не входит: выбирается отдельно. Сертификация (лаборатория и орган)
    и ЗИП на год в составе отсутствуют — учитываются отдельными блоками вне состава. Позиции
    «собственная КД» — только материалы и покупные детали, без работ.'
