# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
roles:
- КД
- АСУ
- ПО
- ЭЛ
- МЕХ
- ГИП
role_names:
  КД: чертежи, расчёты, документация
  АСУ: ПЛК, HMI, программирование робота, безопасность
  ПО: алгоритмы, зрение, прикладные программы, интеграция
  ЭЛ: шкаф, электропроект, электромонтаж
  МЕХ: изготовление, сборка, монтаж
  ГИП: план, закупка, согласования, сертификация, сдача
stages:
- name: Э0 · Управление проектом
  tasks:
  - id: Э0-01
    name: 'План-график проекта: сетевой график с критическим путём (робот 8–16 нед, EPM 6–11, изготовление
      ПР 5–8, стенд, монтаж), вехи, зависимости от заказчика'
    result: утверждённый план-график и реестр рисков
    basis:
      type: analog
      ref: 'аналог: П1 Э9-01 (16 ч) × 1,25 за число вех (11 против 8)'
    hours:
      ГИП: 20
    group: Планирование и ритм
  - id: Э0-02
    name: Еженедельный статус и график, нед. 1–25 (1 ч в неделю)
    result: 25 отчётов о статусе с отклонениями
    basis:
      type: norm
      ref: 'норматив: 1 ч/нед × 25 нед, по П1 Э9-02 (32 ч на 32 нед)'
    hours:
      ГИП: 25
    group: Планирование и ритм
  - id: Э0-03
    name: Еженедельный статус и график, нед. 26–50 (1 ч в неделю)
    result: 25 отчётов о статусе с отклонениями
    basis:
      type: norm
      ref: 'норматив: 1 ч/нед × 25 нед, по П1 Э9-02'
    hours:
      ГИП: 25
    group: Планирование и ритм
  - id: Э0-04
    name: Оперативная координация исполнителей и совещания, нед. 1–25 (1,25 ч в неделю)
    result: протоколы решений по спорным вопросам
    basis:
      type: norm
      ref: 'норматив: 1,25 ч/нед × 25 нед, по П1 Э9-03 (40 ч на 32 нед)'
    hours:
      ГИП: 31
    group: Планирование и ритм
  - id: Э0-05
    name: Оперативная координация и совещания, нед. 26–50
    result: протоколы решений
    basis:
      type: norm
      ref: 'норматив: 1,25 ч/нед × 25 нед, по П1 Э9-03'
    hours:
      ГИП: 31
    group: Планирование и ритм
  - id: Э0-06
    name: Сверка факта часов и закупок с бюджетом, ежемесячный отчёт по затратам проекта; фиксация фактических
      часов для базы норм времени
    result: 12 ежемесячных отчётов по затратам проекта
    basis:
      type: expert
      ref: экспертно 14 / 20 / 32 → 21. впервые на линии такого размера, ритм сверки неделя/месяц
    hours:
      ГИП: 21
    group: Планирование и ритм
  - id: Э0-07
    name: Ведение реестра рисков (ежемесячно, 12 месяцев по 2 ч)
    result: 12 обновлений реестра рисков
    basis:
      type: norm
      ref: 'норматив: 2 ч/мес × 12 мес'
    hours:
      ГИП: 24
    group: Планирование и ритм
  - id: Э0-08
    name: Согласования и отчёты по 10 вехам (эквиваленты, КД, планировка, ПМИ-1, предварительная приёмка,
      доставка, монтаж, ПМИ-2, обучение, ввод)
    result: 10 протоколов согласования
    basis:
      type: analog
      ref: 'аналог: П1 Э9-07 (24 ч на 8 вех, 3 ч на веху) × 10 вех'
    hours:
      ГИП: 30
    group: Работа с заказчиком
  - id: Э0-09
    name: 'Управление изменениями: правки КД корпусов заказчиком (п. 1.4 ТЗ), оценка влияния на сроки
      и цену, допсоглашения'
    result: журнал изменений и подписанные допсоглашения
    basis:
      type: new
      ref: НОВОЕ. экспертно 12 / 24 / 48 → 26. в П1 такой строки нет, объём зависит от числа правок КД
        заказчика
    hours:
      ГИП: 26
    group: Работа с заказчиком
  - id: Э0-10
    name: Допуски, ТБ-инструктаж, наряды-допуски на огневые работы, пропуска и места хранения на площадке
      заказчика
    result: оформленные допуски и наряды
    basis:
      type: analog
      ref: 'аналог: П1 Э9-08 (12 ч) + 3 ч на наряды-допуски на огневые работы'
    hours:
      ГИП: 15
    group: Работа с заказчиком
  - id: Э0-11
    name: 'Закрытие этапов: акты и счета по календарному плану (5 платежей)'
    result: 5 подписанных актов этапов
    basis:
      type: analog
      ref: 'аналог: П1 Э9-09 (16 ч на 4 платежа)'
    hours:
      ГИП: 20
    group: Работа с заказчиком
  - id: Э0-12
    name: 'Проектное ревью № 1 после технического проекта: компоновка, эквиваленты, интерфейс с ячейкой
      сборки (3 участника)'
    result: протокол ревью с замечаниями
    basis:
      type: expert
      ref: экспертно 8 / 12 / 18 → 12,3. по 4 ч на участника
    hours:
      КД: 4
      АСУ: 4
      ЭЛ: 4
    group: Внутренние проектные ревью
  - id: Э0-13
    name: 'Проектное ревью № 2 перед запуском в изготовление: комплект КД, электропроект, архитектура
      ПО'
    result: протокол ревью с замечаниями
    basis:
      type: expert
      ref: экспертно 10 / 14 / 22 → 14,7
    hours:
      КД: 7
      ПО: 4
      ЭЛ: 4
    group: Внутренние проектные ревью
  - id: Э0-14
    name: 'Проектное ревью № 3: готовность к отгрузке после предварительной приёмки, комплектность'
    result: протокол ревью
    basis:
      type: expert
      ref: экспертно 8 / 12 / 18 → 12,3
    hours:
      КД: 4
      ЭЛ: 4
      ГИП: 4
    group: Внутренние проектные ревью
  - id: Э0-15
    name: 'Усиленная координация на пике: исполнителей 6–8, заказов 25–30 (+0,75 ч в неделю к Э0-04 и
      Э0-05, нед. 12–40)'
    result: дополнительные протоколы координации и решения по спорным вопросам
    basis:
      type: norm
      ref: 'норматив: +0,75 ч/нед (с 1,25 до 2 ч/нед) × 29 нед'
    hours:
      ГИП: 22
    group: Усиление управления проекта
  - id: Э0-16
    name: 'Конкурсное сопровождение: ответы на вопросы заказчика и комиссии по КП, эквивалентам и квалификации,
      пояснения к расчёту производительности'
    result: пакет письменных ответов и пояснений
    basis:
      type: new
      ref: НОВОЕ. экспертно 22 / 34 / 56 → 35,7. закупка заводом согласована девятью руководителями, объём
        вопросов неизвестен
    hours:
      ГИП: 36
    group: Усиление управления проекта
  - id: Э0-17
    name: 'Ведение изменений заказчика сверх Э0-09: реестр правок КД корпусов, согласование с цехом и
      ОГТ, пересчёт программ и режимов'
    result: журнал правок с подписанными согласованиями
    basis:
      type: expert
      ref: экспертно 16 / 26 / 44 → 27,3. п. 1.4 ТЗ разрешает заказчику править КД на всех стадиях
    hours:
      АСУ: 8
      ГИП: 19
    group: Усиление управления проекта
  - id: Э0-18
    name: Статусы и координация нед. 51–52 до подписания акта ввода (хвост графика)
    result: отчёты о статусе и протоколы нед. 51–52
    basis:
      type: norm
      ref: 'норматив: (1 + 1,25 + 0,75) ч/нед × 2 нед'
    hours:
      ГИП: 6
    group: Усиление управления проекта
  - id: Э0-19
    name: 'Еженедельная сверка по 25–30 договорам и платежам поставщикам: просрочки, оплаты, акты сверки
