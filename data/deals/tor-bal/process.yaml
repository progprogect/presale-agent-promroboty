# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
title: Цикл линии — от собранного корпуса до накопителя готовых
columns:
- n: 1
  label: Сборка корпуса
- n: 2
  label: Подача
- n: 3
  label: Шов 1
- n: 4
  label: Внутренний шов
- n: 5
  label: Перехват и шов 2
- n: 6
  label: Выгрузка
- n: 7
  label: Накопление
lanes:
- id: op
  name: Персонал заказчика
  sub: что делает человек
  kind: human
- id: line
  name: Линия сварки
  sub: наша поставка
  kind: ours
- id: cl
  name: Оборудование заказчика
  sub: ячейка сборки
  газ: null
  вытяжка: null
  kind: client
steps:
- n: 1
  lane: cl
  title: Сборка корпуса и загрузка на тележку
  desc: ячейка сборки заказчика — грузовой робот с магнитом ставит собранный корпус на тележку линии;
    в нашу поставку ячейка не входит
  time: вне такта линии
- n: 1
  lane: op
  title: Загрузка деталей на пресс сборки
  desc: один человек в смену, он же наблюдает за линией; в цикл сварки не вмешивается
- n: 2
  lane: line
  title: Подача корпусов к постам
  desc: двухместная тележка идёт по рельсовому пути, ход 11 м; за рейс привозит два корпуса
  parallel: идёт в тени сварки — в такт поста не входит
  time: рейс ≤75 с
- n: 2
  lane: op
  title: Резервный режим подачи
  desc: при отказе ячейки сборки оператор ставит корпус на тележку вручную, такт линии сохраняется
  main: false
- n: 3
  lane: line
  title: Съём корпуса с тележки и шов 1
  desc: робот берёт корпус электромагнитным захватом, лазер находит стык, шов «днище с обечайкой» варится
    вращением шестой оси у неподвижной горелки
  time: 165 с
- n: 3
  lane: line
  title: Второй пост — тот же цикл
  desc: посты автономны, шаг между ними 5 м; тележка с корпусом Ø720 проходит мимо работающего поста с
    зазором более 250 мм
  parallel: с первым постом, со сдвигом на половину такта
- n: 4
  lane: line
  title: Внутренний шов — днище к днищу
  desc: тем же захватом — горелка входит в центральное отверстие сверху; переориентация и поиск стыка
    10 с, сам шов 51 с
  time: 61 с
- n: 4
  lane: line
  title: Очистка и смазка горелки
  desc: станция на пневмосалазках подъезжает к горелке — фреза сопла и антипригарная жидкость, каждые
    пять корпусов
  parallel: в паузах манипуляций; в такт входит 7 с на корпус
  time: 7 с на корпус
- n: 5
  lane: line
  title: Перехват с переворотом 180° и шов 2
  desc: корпус ставится на станцию перехвата и берётся за другой торец; второй шов «днище с обечайкой»
    — 143 с
  time: 174 с
- n: 6
  lane: line
  title: Укладка на приводной рольганг
  desc: сваренный корпус ложится на рольганг выгрузки с энкодерными датчиками положения
  time: 12 с
- n: 6
  lane: line
  title: Транзит мимо второго поста
  desc: два поворотно-передаточных модуля обводят трассу вокруг основания второго поста
  parallel: в окнах, когда рука второго поста вне зоны трассы — по блокировке в программе линии
  time: 15–25 с
- n: 7
  lane: line
  title: Наклонный рольганг и накопитель
  desc: корпуса скатываются в гравитационный накопитель с упорами, буфер около 30 минут выпуска
- n: 7
  lane: op
  title: Выгрузка готовых корпусов
  desc: рабочий вне линии снимает корпуса с накопителя
- n: 7
  lane: cl
  title: Вытяжка и дальнейшие операции
  desc: дым уходит в каналы центральной вытяжки завода через патрубки наших колпаков; корпуса уходят на
    следующий участок
cycle: шаги 3–6 повторяются на каждом корпусе и идут одновременно на двух постах; очистка горелки — каждые
  пять корпусов; шаг 1 выполняет оборудование заказчика
key_figure: такт поста 419 с на Ø600, два поста — 17,2 корпуса в час при требовании не менее 17 (в модели
  17,1–17,4)
