slug: tor-bal
code: ТОР-БАЛ
title: Линия сварки тороидальных баллонов
version: пакет проверки v1
updated: '2026-10-08'
status: на проверке
note: Роботизированная линия сварки корпусов тороидальных газовых баллонов, два сварочных поста, транспортная
  тележка.
context: 'Роботизированная линия сварки корпусов тороидальных газовых баллонов: 8 типоразмеров Ø550–720
  мм, сталь ≈3 мм, производительность не менее 17 корпусов в час. Два сварочных поста: на каждом робот
  грузоподъёмностью ≥165 кг с электромагнитным захватом держит корпус и вращает его осью 6 у неподвижной
  горелки. Корпуса подаёт транспортная тележка по рельсовому пути 11 м. Компоновка подтверждена симуляцией
  в RoboDK. Оборудование — на эквивалентах вместо оригинальных Fronius и Scansonic.'
questions:
  questions:
  - Предположения — какое из них вы считаете неверным? Жёлтые строки проверяйте первыми.
  - Основания — достаточно ли основания, чтобы работать дальше без ответа заказчика?
  - Цена ошибки — где мы занизили риск, а где перестраховались?
  process:
  - Последовательность — что идёт не в том месте потока, где происходит на самом деле.
  - Параллельность — что мы считаем одновременным зря, а что можно совместить.
  - Граница поставки — верно ли показано, что делает оборудование заказчика и что человек.
  solution:
  - Узлы — что лишнее, чего не хватает, что решается проще.
  - Отклонённые варианты — какой отбросили зря и почему.
  - Границы применимости — что ещё всплывёт на приёмке и здесь не названо.
  wbs:
  - Полнота — какие работы, этапы или зависимости пропущены?
  - Часы — где оценка нереалистична (мало или много)? Поправьте кнопками и коротко напишите почему.
  - Риски — что может сорвать сроки или объём и не отражено в пакетах?
  bom:
  - Компоновка (схема сверху) — что стоит не на месте, где тесно для обслуживания; наведение на позицию
    подсвечивает её строки в составе.
  - Состав — чего не хватает, что лишнее?
  - Выбор — надёжны ли эквиваленты (источник Megmeet вместо Fronius, лазерный трекер вместо Scansonic
    и др.)? Есть ли лучше?
  - Цена и срок — где дешевле или быстрее? Впишите в правую колонку.
  - Риски — поставки, совместимость, ресурс.
notes:
  questions: Жёлтое — принятые нами предположения с основанием; красное — вопросы заказчику. Каждое предположение
    дойдёт до предложения оговоркой или границей применимости.
  process: Времена — такт одного поста на зачётном Ø600; посты работают одновременно, поэтому производительность
    линии вдвое выше.
  solution: Это черновик раздела предложения «Почему именно такая компоновка». Контур участка уточняется
    при согласовании планировки — часть позиций состава пока посчитана по предварительному контуру.
  wbs: П1–П3 в основании часов — строки смет прошлых проектов компании, то есть тоже оценки, а не подтверждённые
    факты. Э17 — гарантийный резерв на 24 месяца. Опции О1–О4 стоят отдельно, вне итога.
  bom: Цены — закупка в BYN без НДС, оценки до ответов поставщиков; подтверждённые отмечены зелёным. «Собственное
    изготовление» — только материалы и покупные детали, без работ.
