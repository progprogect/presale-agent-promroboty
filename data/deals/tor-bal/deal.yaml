# Карточка сделки для портала (конечный заказчик НЕ указывается — только кодовое имя)
slug: tor-bal
code: ТОР-БАЛ
title: Линия сварки тороидальных баллонов
version: смета v1
updated: "2026-10-02"
status: на проверке
note: Роботизированная линия сварки корпусов тороидальных газовых баллонов, два сварочных поста, транспортная тележка.
context: >-
  Роботизированная линия сварки корпусов тороидальных газовых баллонов: 8 типоразмеров Ø550–720 мм,
  сталь ≈3 мм, производительность не менее 17 корпусов в час. Два сварочных поста: на каждом робот
  грузоподъёмностью ≥165 кг с электромагнитным захватом держит корпус и вращает его осью 6 у неподвижной
  горелки. Корпуса подаёт транспортная тележка по рельсовому пути 11 м. Компоновка подтверждена
  симуляцией в RoboDK. Оборудование — на эквивалентах вместо оригинальных Fronius и Scansonic.
questions:
  wbs:
    - Полнота — какие работы, этапы или зависимости пропущены?
    - Часы — где оценка нереалистична (мало или много)? Поправьте кнопками и коротко напишите почему.
    - Риски — что может сорвать сроки или объём и не отражено в пакетах?
  bom:
    - Компоновка (схема сверху) — что стоит не на месте, где тесно для обслуживания; наведение на позицию подсвечивает её строки в составе.
    - Состав — чего не хватает, что лишнее?
    - Выбор — надёжны ли эквиваленты (источник Megmeet вместо Fronius, лазерный трекер вместо Scansonic и др.)? Есть ли лучше?
    - Цена и срок — где дешевле или быстрее? Впишите в правую колонку.
    - Риски — поставки, совместимость, ресурс.
notes:
  wbs: П1–П3 в основании часов — строки смет прошлых проектов компании, то есть тоже оценки, а не подтверждённые факты. Э17 — гарантийный резерв на 24 месяца. Опции О1–О4 стоят отдельно, вне итога.
  bom: Цены — закупка в BYN без НДС, оценки до ответов поставщиков; подтверждённые отмечены зелёным. «Собственное изготовление» — только материалы и покупные детали, без работ.
