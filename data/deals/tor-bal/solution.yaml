# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
summary: Два одинаковых сварочных поста в ряд вдоль рельсового пути. На каждом посту робот с электромагнитным
  захватом держит корпус и вращает его шестой осью у неподвижной горелки — кольцевой шов варится одним
  непрерывным вращением одной оси, поэтому скорость по контуру стабильна, а тот же робот выполняет и все
  транспортные операции — съём с тележки, перехват с переворотом, укладку на рольганг. Корпуса подвозит
  двухместная тележка с ходом 11 м, готовые уходят по рольгангу в гравитационный накопитель. Посты автономны
  — каждый в своей секции ограждения, при отказе одного второй продолжает работу. Линия занимает около
  12,5 × 7 м.
nodes:
- name: Робот с электромагнитным захватом, два поста
  what: держит корпус, вращает его под горелкой на всех трёх швах, снимает с тележки, перехватывает с
    переворотом и укладывает на рольганг
  why: шов идёт вращением одной оси без интерполяции — скорость по контуру стабильна; тот же робот делает
    транспортные операции, отдельный манипулятор не нужен
- name: Захват на электропостоянных модулях
  what: удерживает корпус до 55 кг магнитным полем, снимает остаточную намагниченность импульсом при отпускании
  why: требование безопасности при отказе электропитания — модули держат корпус без тока; размагничивание
    снимает магнитное дутьё дуги на последующих швах
- name: Сварочный пост — источник, подача, горелка, охлаждение
  what: импульсный источник 500 А, подача проволоки Ø1,2 мм, автоматическая горелка с водяным охлаждением
    и чиллером, газовая обвязка от рампы завода
  why: один проход с перекрытием 15–20 мм на стенке около 3 мм достижим только импульсным режимом; непрерывная
    работа на 500 А требует жидкостного охлаждения
- name: Лазерное слежение за швом
  what: бесконтактно находит стык, зазор и смещение кромок и правит траекторию робота в ходе сварки
  why: корпус собран с допуском и стык «плавает» от типоразмера к типоразмеру; без слежения приходится
    либо жёстко базировать каждый корпус, либо принимать непровары
- name: Станция очистки и смазки горелки
  what: подъезжает на пневмосалазках к неподвижной горелке, фрезерует сопло и наносит антипригарную жидкость
  why: горелка стационарна, поэтому станция едет к ней, а не наоборот; работа идёт в паузах манипуляций
    и добавляет к такту только 7 с на корпус
- name: Транспортная тележка на рельсовом пути
  what: двухместная тележка с реечным приводом и абсолютным энкодером возит корпуса от точки передачи
    к постам, ход 11 м
  why: два корпуса за рейс — рейс укладывается в тень сварки и не входит в такт поста; абсолютные энкодеры
    снимают процедуру поиска нуля после отключения питания
- name: Станция перехвата с переворотом 180°
  what: принимает корпус после первых двух швов и позволяет роботу взять его за другой торец
  why: три шва лежат с разных сторон корпуса; перехват за 15 с дешевле второго робота и позиционера и
    не добавляет точек базирования
- name: Сварная колонна с консолью горелки
  what: несёт горелку, датчик слежения и узел очистки, задаёт точку сварки на высоте 1,5 м
  why: вынос горелки на консоль около 0,5 м и отодвинутая колонна — условие, при котором корпуса больших
    диаметров не задевают колонну при вращении
- name: Рольганг выгрузки, наклонный рольганг, накопитель
  what: принимает сваренные корпуса с обоих постов, обводит основание второго поста и ссыпает корпуса
    в гравитационный накопитель
  why: прямая трасса пересекала бы основание второго поста; обход двумя поворотными модулями проверен
    прогоном и дешевле магистрали вдоль стены
- name: Вытяжные колпаки, занавесы, освещение, бесперебойное питание
  what: собирают дым в каналы центральной вытяжки завода, закрывают дугу от цеха, дают не менее 400 лк
    и удерживают управление при провале напряжения
  why: двухуровневая кромка занавесов (1,55 м у дуги, 2,0 м в транспортном коридоре) — иначе рука робота
    с корпусом задевает занавес на переносе
- name: Управление линией — контроллер, панель оператора, диспетчеризация
  what: ведёт цикл обоих постов, тележку и рольганги, показывает статус участков, счётчики и тревоги,
    хранит резервные копии программ и даёт удалённую диагностику
  why: два поста работают в паре и должны продолжать работу поодиночке — логика отказа, сигнализация и
    блокировка транзита живут в контроллере линии, а не в контроллерах роботов
- name: Ограждение, блокировки, световые завесы, сигнализация
  what: закрывает периметр и разделяет посты, блокирует двери, перекрывает окна загрузки и выгрузки завесами,
    показывает режим и отказ поста светом и звуком
  why: обслуживание одного поста при работающем втором — прямое требование к отказоустойчивости; завесы
    вместо дверей на окнах нужны, чтобы поток не останавливался
- name: Пневматика, расходные материалы и запасные части
  what: подготовка воздуха с контролем фактического давления, обвязка станций, комплект расходных деталей
    горелки и запасные горелки с подающим устройством
  why: контроль давления воздуха и протока охлаждающей жидкости входит в требования к устойчивости линии;
    расходные детали и запасные части заданы перечнем в задании
rejected:
- option: Зеркальная компоновка — посты по обе стороны одного рельса
  why: экономит около 4 м² и 3 м рельса, но обслуживание одного поста пересекается с логистикой второго,
    а главное — нет места под третий пост, то есть запас по производительности 1–2 % нечем лечить
- option: Отраслевая схема — станки кольцевой сварки с вращателем и двумя горелками
  why: так эту задачу решает мировая отрасль, потолок 30+ корпусов в час и 18,8 даже на одном станке;
    но схема отступает от состава, заданного разделом 4 задания, поэтому идёт отдельным блоком как альтернатива
    на решение заказчика, а не как базовое предложение
- option: Второй робот или сварочный позиционер вместо станции перехвата
  why: перехват занимает 15 с из такта 419 с; отдельная ось на этом месте не окупается и добавляет точку
    отказа
- option: Оригинальные источники, горелки и следящие лазеры названных в задании марок
  why: их поставка закрыта экспортным регламентом ЕС — нет официального канала, гарантии и ключей активации;
    предлагаются эквиваленты, оригиналы — только по письменному запросу, без твёрдого срока
- option: Робот меньшего класса грузоподъёмности
  why: по расчёту корпус с захватом даёт 105 кг и момент около 348 Н·м, что прошло бы и на меньшем классе,
    но задание задаёт не менее 165 кг — снижение класса только по письменному согласию заказчика
proof:
- компоновка прогнана в цифровой модели на всех восьми типоразмерах Ø550–720, а не на одном корпусе
- кольцевой шов варится одним вращением шестой оси — диапазон оси ±360° при потребных 364° с перекрытием,
  остальные оси при этом неподвижны
- нагрузка на запястье — корпус 55 кг и захват 50 кг, момент около 348 Н·м, не более 56 % от допустимой
  для класса 165–180 кг
- все технологические точки досягаемы с запасом не менее 0,75 м; тележка с корпусом Ø720 проходит мимо
  работающего поста с зазором более 250 мм
- такт на Ø600 — 413–421 с, то есть 17,1–17,4 корпуса в час на линии при требовании не менее 17
- трасса выгрузки мимо второго поста проверена отдельным прогоном — обход работоспособен, транзит идёт
  в окнах по блокировке и производительность не снижает
- модель не только подтвердила схему, но и потребовала пять правок расстановки — все внесены — разворот
  ложемента перехвата на 52°, вынос горелки на консоль, точка сварки на высоте 1,5 м, вынос приёмного
  конца рольганга из-под занавесов, двухуровневая кромка занавесов
limits:
- толщина стенки корпуса принята около 3 мм по отраслевым нормам — чертежи корпусов не получены; при другой
  толщине пересчитываются режимы, скорость сварки и производительность
- скорость сварки принята 48 м/ч по данным серийных станков кольцевой сварки и подтверждается отработкой
  на корпусах заказчика; при 45 м/ч линия даёт 16,4 корпуса в час вместо 17,2
- производительность 17 корпусов в час относится к зачётному Ø600; на Ø630–720 расчёт даёт 14,8–16,7 корпуса
  в час, на Ø550–580 — 17,6–18,7
- диаметр внутреннего шва принят равным 0,35 наружного — уточняется по чертежам
- ячейка сборки корпусов в поставку не входит — стыковка по стандартным интерфейсам, точка передачи корпуса
  на тележку принята в 3 м от зоны постов
- фундамент и подготовка пола, ввод питания, сжатый воздух, рампа газовой смеси, каналы центральной вытяжки
  и цеховое освещение — зона заказчика; воздуховоды выше наших патрубков показаны на видах условно
- линии требуется не менее 4,5 м в свету; высота цеха в зоне установки не подтверждена
- длина наклонного рольганга 4 м и накопитель на 6 м приняты до получения планировки участка
- удержание тонкостенного тороидального корпуса электропостоянными модулями серийными данными не подтверждено
  — заложены ранние испытания образцов и резервное решение на удерживающих электромагнитах с буферным
  питанием, срок в этом случае растёт на 4–6 недель
- остаточная намагниченность снимается импульсом размагничивания; эффект проверяется на образцах заказчика
  при отработке технологии
- для корпусов Ø680–720 переход от второго шва к рольгангу требует сформированной траектории — решается
  при офлайн-программировании
- кабельный пакет шестой оси в модели не проверялся — закрывается выбором кругового кабельного модуля
  на стадии конструкторской документации
- режим работы принят двухсменным — расчёт годового выпуска и окупаемости опирается на 2 смены по 8 часов,
  250 дней и коэффициент использования 0,85
- предложение построено на оборудовании-эквиваленте вместо названных в задании марок; хранение не менее
  120 сварочных заданий обеспечивается памятью контроллера робота с передачей задания в источник по шине
  — оба решения требуют подтверждения заказчиком
- замер производительности на приёмке идёт по зачётному Ø600 на партии не менее 100 корпусов подряд; объём
  и условия замера фиксируются согласованной программой и методикой испытаний
- технология отрабатывается на корпусах заказчика (приняли 30–50 штук по разным типоразмерам); при их
  отсутствии отработка идёт на имитаторах, срок этапа растёт
- гарантия на линию — 24 месяца с ввода; на покупные изделия действуют гарантии их изготовителей (12 месяцев),
  разницу закрывает наше гарантийное сопровождение
- подтверждение соответствия выполняется по техническим регламентам Таможенного союза; окончательная форма
  (сертификат с испытаниями или декларация) определяется при согласовании с органом по сертификации
- обучение — одна группа до 8 человек на каждую из пяти категорий персонала, с повтором занятий для операторов
  второй смены
- переналадка между типоразмерами сведена к выбору программы — ложементы универсальны на весь ряд Ø550–720;
  поэтому «время переналадки» в предложении — это время выбора программы, а не механическая переналадка;
  сменные накладки заложены резервом на случай разной геометрии зоны опирания, и если отработка покажет,
  что они нужны, накладки станут отдельной позицией состава со своим временем переналадки
- компоновка прогнана на модели робота класса 180 кг с вылетом 2702 мм; предложенный к поставке манипулятор
  — 220 кг с вылетом 2660 мм, запас досягаемости более 0,75 м при разнице вылета 42 мм; прогон повторяется
  на модели поставщика в составе работ (модели этого манипулятора в библиотеке цифровой модели нет — собирается
  по данным изготовителя)
- контур линии принят по симуляции — около 12,5 × 7 м (12,3 × 6,75 м по ограждению), ограждение около
  40 погонных метров и четыре двери (три по компоновке и одна сервисная — запас на требования завода);
  контур уточняется при согласовании планировки участка
