- id: Q15
  topic: Память сварочных заданий
  q: где должны храниться не менее 120 сварочных программ
  need: подтверждение допустимости хранения программ в контроллере робота
  status: answered
  ask_text: Задание требует не менее 120 сварочных заданий. Доступные сварочные источники этого класса
    хранят в собственной памяти до 50 заданий; остальные хранятся в контроллере робота и передаются в
    источник по промышленной шине в начале цикла — номенклатура широкая, режим переключается в каждом
    цикле. Просим подтвердить, что такой способ хранения отвечает требованию, либо указать, что 120 заданий
    должны храниться именно в памяти источника — это меняет выбор источника и архитектуру программного
    обеспечения линии.
  impact: окажись требование привязанным к памяти источника — другой источник и другая архитектура обмена,
    то есть переделка программной части линии
  risk: high
  answer: Ограничения по числу программ нет. Контроллер робота штатно поддерживает передачу параметров
    сварки — ток, напряжение, скорость подачи, заварка кратера и другие функции — в режиме реального времени
    по цифровой шине Profinet или EtherNet/IP. То есть требование задания на не менее 120 программ закрывается
    контроллером робота, а не памятью источника, и внешний выбор программы возможен по шине.
  source: письменный ответ поставщика комплекта от 08.10.2026
  why: задание требует не менее 120 сварочных заданий, а источники этого класса держат в собственной памяти
    около 50 — надо было понять, где хранятся остальные
