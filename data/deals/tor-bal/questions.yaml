# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
questions:
- id: Q1
  topic: Номенклатура
  q: что варим — вся номенклатура корпусов, а не один типоразмер
  need: диаметры, число исполнений, масса, материал, зачётный тип для замера
  status: answered
  answer: восемь типоразмеров корпусов тороидальных баллонов Ø550, 565, 580, 600, 630, 650, 680 и 720
    мм, в сумме 166 исполнений по конструкторской документации заказчика; масса корпуса до 55 кг; зачётный
    тип для замера производительности — Ø600
  source: задание на закупку, п. 1.1 и разд. 2
  impact: ошибёмся в номенклатуре — не тот класс робота и захвата, не тот такт по каждому типу, недостающие
    сварочные программы и переделка оснастки
  risk: high
  why: в запросах такого рода обычно присылают одну деталь, а здесь восемь диаметров и 166 исполнений
    — такт и захват считаются по всему ряду, а не по зачётному Ø600
- id: Q2
  topic: Геометрия корпуса
  q: толщина стенки, подготовка кромок и диаметр внутреннего шва
  need: чертежи корпусов (приложение № 2 к заданию) — запрошены, не получены
  status: assumed
  answer: принимаем толщину стенки около 3 мм, сварку каждого шва в один проход с перекрытием 15–20 мм,
    внутренний шов (днище к днищу) на диаметре около 0,35 наружного — для Ø600 это Ø210
  basis: отраслевые нормы на тороидальные баллоны (Правила ЕЭК ООН № 67, EN 1442) дают стенку 2,5–4 мм;
    пропорции центрального отверстия — по каталогам серийных тороидальных баллонов тех же диаметров; при
    получении чертежей модель пересчитывается за один прогон
  impact: не та толщина — другие режимы и скорость сварки, другая длина швов, и расчётная производительность
    линии уезжает вместе с ними
  risk: high
  why: чертежей корпусов завод не прислал, а от толщины стенки напрямую зависят режимы сварки и расчётная
    производительность линии
  options:
  - label: принять 3 мм и оговорить в предложении
    note: считаем дальше без задержки; если чертежи дадут другую толщину — пересчёт режимов за один проход
  - label: ждать чертежи от завода
    note: расчёт производительности точный, но стадия стоит и срок подачи предложения уезжает
- id: Q3
  topic: Операция и качество
  q: что считается годным швом
  need: число и тип швов, число проходов, перечень недопустимых дефектов, нормы
  status: answered
  answer: три кольцевых шва на корпус (два «днище с обечайкой», один «днище к днищу»), каждый в один проход
    с перекрытием 15–20 мм; не допускаются брызги, прожоги, поры, трещины, непровары, подрезы, кратеры,
    неравномерное сечение, перекос и смещение кромок, включения внутри баллона; нормы — Правила ЕЭК ООН
    № 67, EN 1442, СТБ ИСО 9692-1-2006, ГОСТ 14771-76
  source: задание, пп. 1.2.2, 1.2.5, 1.3, 2.2
  impact: неверно прочтём требование к шву — не та технология и режимы, слежение за стыком окажется лишним
    или наоборот недостающим, а объём контроля на приёмке вырастет
  risk: high
  why: три шва в один проход и перечень недопустимых дефектов заданы заданием дословно — от них зависит,
    нужно ли лазерное слежение за стыком и что проверяют на приёмке
- id: Q4
  topic: Скорость сварки
  q: с какой скоростью реально идёт кольцевой шов на этой толщине
  need: подтверждённая скорость для импульсного режима в смеси Ar+CO₂, проволока Ø1,2 мм
  status: assumed
  answer: принимаем 48 м/ч (0,8 м/мин) для расчёта производительности; целевая после отработки технологии
    — 51 м/ч
  basis: два независимых производителя серийных станков кольцевой сварки баллонов из стали 2,5–6 мм заявляют
    0,8–1,0 м/мин одним проходом; взята нижняя граница диапазона. Чувствительность посчитана — при 45
    м/ч линия даёт 16,4 корпуса в час, при 48 м/ч — 17,2, при 51 м/ч — 18,1
  impact: ошибка в скорости на 3 м/ч двигает выпуск примерно на 0,8 корпуса в час — это разница между
    выполненным и невыполненным требованием задания
  risk: high
  why: скорость сварки заказчик не задаёт, а в предложении её надо назвать числом — именно от неё зависит,
    получается ли требуемые 17 корпусов в час
  options:
  - label: принять 48 м/ч и показать в предложении расчёт чувствительности
    note: нижняя граница диапазона двух независимых производителей; запас над требованием тонкий — 17,2
      корпуса в час при требуемых 17
  - label: заложить консервативные 45 м/ч
    note: цифра защищённая, но при ней линия даёт 16,4 корпуса в час и требование не закрывается без третьего
      поста
  - label: отложить число до сварочных проб на корпусах заказчика
    note: скорость будет точная, но пробы это недели и корпуса, которых у нас пока нет, — срок подачи
      предложения уезжает
- id: Q5
  topic: Производительность
  q: сколько корпусов в час и что входит в это время
  need: норма, зачётный типоразмер, перечень операций внутри такта
  status: answered
  answer: не менее 17 корпусов в час с замером на Ø600, включая захват корпуса с тележки, сварку трёх
    швов, переустановку, очистку и смазку горелки и укладку на конвейер
  source: задание, разд. 2
  impact: неверно прочтём, что входит в такт — посчитаем производительность по голой сварке, а замер на
    приёмке пойдёт с захватом, перехватом и очисткой горелки
  risk: high
  why: 17 корпусов в час и перечень операций внутри такта заданы заданием — это одновременно критерий
    приёмки и причина, по которой в линии два поста, а не один
- id: Q6
  topic: Производительность по типам
  q: требование 17 корпусов в час относится только к зачётному типу или ко всем восьми
  need: подтверждение, что на крупных диаметрах допускается меньшая производительность
  status: assumed
  answer: принимаем, что норма 17 корпусов в час относится к зачётному Ø600; на Ø630–720 расчёт и модель
    дают 14,8–16,7 корпуса в час, на Ø550–580 — 17,6–18,7
  basis: задание, п. 2.1.1 — «для других типов производительность может отличаться»; расчёт по всем восьми
    диаметрам приведён в предложении отдельной таблицей
  impact: если норма окажется общей для всех восьми типов, двух постов не хватает на Ø630–720 — это третий
    пост, другая компоновка и другая цена
  risk: high
  why: задание задаёт норму с замером на Ø600 и оговаривает, что на других типах производительность может
    отличаться, но прямо не говорит, что норма к ним не относится
  options:
  - label: норма по зачётному Ø600, в предложении таблица по всем типам
    note: так задание читается буквально, а расхождение по крупным диаметрам заказчик видит заранее, а
      не узнаёт на приёмке
  - label: заложить третий пост под норму на любом диаметре
    note: требование закрывается на всём ряде, но это другая компоновка, площадь и цена; место под третий
      пост в схеме сохранено, в базовый состав он не входит
  - label: спросить завод прямой строкой в общем письме
    note: снимает спор на приёмке полностью, но ответ может прийти уже после срока подачи предложения
- id: Q7
  topic: Режим работы
  q: в каком режиме работает цех — сколько смен в сутки и дней в году
  need: сменность, фонд рабочего времени, коэффициент использования оборудования
  status: assumed
  answer: принимаем две смены по 8 часов, 250 рабочих дней в году, коэффициент использования 0,85 — около
    57 800 корпусов в год
  basis: прямого указания о сменности в задании нет; двухсменный режим следует из требования сохранения
    точности 15 лет «при 2-сменной работе» (разд. 10) и из данных о работе цеха
  impact: ошибёмся в сменности — годовой выпуск и срок окупаемости в предложении будут мимо вдвое, а это
    первая цифра, которую проверит экономист завода
  risk: high
  why: сменность в задании прямо не названа, а на ней стоит весь расчёт годового выпуска и окупаемости
    — следует она только из требования сохранять точность 15 лет при 2-сменной работе
  options:
  - label: считать по двум сменам, по нижней планке
    note: окупаемость показана консервативно; если цех работает в три смены, фактический эффект окажется
      лучше заявленного
  - label: считать по трём сменам
    note: окупаемость выглядит вдвое быстрее, но при фактических двух сменах цифра в предложении завышена
      — это заметят при проверке
  - label: подтвердить сменность вопросом в общем письме
    note: цифра окупаемости становится твёрдой; до ответа считать всё равно приходится по предположению
- id: Q8
  topic: Граница поставки
  q: откуда корпус приходит на линию и куда уходит после сварки
  need: что входит в нашу поставку, что остаётся за заказчиком
  status: assumed
  answer: принимаем, что ячейка сборки корпусов (грузовой робот и гидравлический пресс) в нашу поставку
    не входит — она существует или закупается отдельно, стыковка по стандартным промышленным интерфейсам
    (Ethernet и дискретные сигналы); готовые корпуса забирает с накопителя рабочий вне линии
  basis: в комплектации задания (разд. 4) ячейки сборки нет, п. 1.2.1 требует только совместимости двух
    линий по серверам, протоколам и интерфейсам; выгрузка рабочим вне линии названа в разд. 8
  impact: включим лишнее — цена вырастет на целую ячейку с прессом; не включим, а её ждали — предложение
    окажется неполным по составу
  risk: high
  why: ячейка сборки корпусов описана в технологическом процессе задания, но в комплектации раздела 4
    её нет — по документу непонятно, покупают её у нас или она уже есть на заводе
  options:
  - label: оставить ячейку сборки вне поставки
    note: состав соответствует разделу 4 задания; стыковка по Ethernet и дискретным сигналам, ответственность
      за передачу корпуса на тележку делится протоколом
  - label: включить ячейку сборки в поставку
    note: закрывает любое прочтение задания, но это второй робот с гидропрессом, а требований к нему в
      задании нет — проектировать придётся вслепую
  - label: спросить завод, кто поставщик ячейки сборки и на какой она стадии
    note: один вопрос в общем письме закрывает и границу поставки, и протокол стыковки
- id: Q9
  topic: Оборудование заказчика · стыковка с ячейкой сборки
  q: где физически корпус передаётся на транспортную тележку линии
  need: координаты и высота точки передачи, протокол обмена, кто поставщик ячейки сборки
  status: assumed
  answer: принимаем точку передачи в 3 м от зоны сварочных постов, со стороны загрузки; отсюда ход тележки
    11 м и грузоподъёмность 250 кг (два корпуса, ложементы и запас)
  basis: расчёт компоновки, подтверждённый моделью; ход тележки складывается из 4,5 м от загрузки до первого
    поста, 5,0 м шага между постами и 1,5 м парковки
  impact: сдвинется точка передачи — пересчитываются длина рельсового пути, цикл подачи и объём монтажа;
    компоновка при этом остаётся прежней
  risk: mid
  why: точку, где корпус попадает на тележку линии, задание не называет, а из неё считается ход тележки
    и длина рельсового пути
  options:
  - label: оставить точку передачи в 3 м от постов
    note: ход тележки 11 м, путь 12,8 м; сдвиг точки правится длиной рельса, переделки компоновки не требует
  - label: ждать планировку участка (приложение № 3)
    note: 'привязка будет точной, но это то же приложение, которого ждём по площадке: решение не поменяется,
      поменяется число метров'
- id: Q10
  topic: Площадка
  q: где линия физически встанет и какая высота в свету в этой зоне
  need: габариты свободной зоны, высота до нижней отметки коммуникаций, состояние пола, отметки точек
    подключения к центральной вытяжке
  status: ask
  ask_text: Просим ориентировочную компоновку участка (приложение № 3 к заданию) и габариты свободной
    зоны под линию, высоту цеха в свету в этой зоне и отметки точек подключения к каналам центральной
    вытяжки. Линии требуется не менее 4,5 м в свету — верх портала вытяжного колпака — 2,9 м, рука робота
    на парковке — около 3,8 м, выше идёт трасса воздуховодов. Также просим подтвердить длину наклонного
    рольганга до зоны выгрузки (приняли 4 м) и нужный буфер накопителя (приняли гравитационный накопитель
    на 6 м, около 30 минут выпуска).
  impact: не хватит высоты в зоне установки — переделывать колпаки и трассу вытяжки придётся уже на монтаже;
    длина рольгангов и накопителя сейчас взяты с запасом
  risk: mid
  why: приложение № 3 с планировкой участка к заданию не пришло, а линии нужно не менее 4,5 м в свету
    — высота цеха в этой зоне и отметки вытяжки нам неизвестны
  options:
  - label: спросить, до ответа держать запас по длине
    note: если планировка даст меньше, позиции уменьшаются и цена падает; если больше — метры добираются
      без переделки компоновки
  - label: ужать рольганг и накопитель до минимума по расчёту
    note: цена ниже сразу, но при фактически большей длине метры добираются на монтаже и уже за наш счёт
- id: Q11
  topic: Среда и подводы
  q: что линия получает от цеха
  need: параметры сети, сжатого воздуха, газовой смеси, вытяжки
  status: answered
  answer: сеть 3 ф 220/380 В, 50 Гц, отклонения −5/+10 %, глухозаземлённая нейтраль; сжатый воздух 0,45–0,5
    МПа, 8 класс загрязнённости; газовая смесь Ar+CO₂ от рампы централизованной системы завода; вытяжка
    — каналы центральной системы завода под патрубки Ø350 мм на наших колпаках
  source: задание, разд. 4 и 6, пп. 1.2.6 и 4.1.21
  impact: промахнёмся в параметрах подводов — не тот источник бесперебойного питания, не та пневмоподготовка,
    и патрубки колпаков не встанут на цеховые каналы вытяжки
  risk: mid
  why: что линия получает от цеха — сеть, воздух, газовая смесь, вытяжка — задано заданием; проверяли,
    хватает ли этих параметров нашему оборудованию
- id: Q12
  topic: Приёмка
  q: как именно замеряется производительность при приёмке
  need: длительность замера, типоразмер, что входит в зачётное время, где проходит замер
  status: assumed
  answer: принимаем замер на зачётном Ø600 на партии не менее 100 корпусов подряд, с учётом очистки горелки
    и смены корпусов на тележке; приёмка в два этапа — предварительная с отработанной технологией на площадке
    изготовителя, затем финальные испытания под промышленной нагрузкой на площадке заказчика
  basis: порядок приёмки задан разд. 10 задания, которое требует согласованных программ и методик; объём
    контрольной партии — по практике приёмки линий такого класса, фиксируется в программе и методике испытаний
    до начала работ
  impact: разойдёмся с заводом в методике замера — спор на приёмке в самом конце проекта, когда линия
    уже стоит у заказчика, а деньги не получены
  risk: high
  why: задание требует согласованных программ и методик, но не говорит, на какой партии и сколько времени
    замеряется производительность — а именно на этом замере принимают работу
  options:
  - label: замер на 100 корпусах подряд, приёмка в две ступени
    note: около шести часов непрерывной работы — в замер попадают очистка горелки, смена корпусов и редкие
      сбои, спорить потом не о чем
  - label: короткий замер, около часа работы
    note: быстрее и дешевле для обеих сторон, но час не ловит очистку горелки и редкие остановы — риск
      переносится в эксплуатацию
  - label: объём замера не фиксировать, оставить на методику испытаний
    note: гибко на переговорах, но тогда объём замера назначает завод, и возражать будет поздно
- id: Q13
  topic: Исходные данные
  q: корпуса для отработки технологии — сколько и когда
  need: число корпусов по типам, срок передачи, ответственный
  status: assumed
  answer: принимаем, что заказчик передаёт 30–50 собранных корпусов по разным типоразмерам к началу отработки
    технологии; при их отсутствии отработка идёт на имитаторах из закупаемого металла, с ростом сроков
    и затрат
  basis: стандартная практика приёмки у изготовителя — технология отрабатывается на реальных изделиях;
    обязанность заказчика со сроком выносится в договор
  impact: корпусов не будет вовремя — отработка идёт на имитаторах из закупаемого металла, этап дорожает
    и удлиняется, а технология отработана не на реальном изделии
