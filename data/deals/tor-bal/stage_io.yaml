# Выход (deliverables) и вход (inputs) каждого этапа — для согласования на портале.
# Ключ = точное имя этапа из wbs.yaml. Составлено по пакетам сметы, 02.10.2026.
"Э0 · Управление проектом":
  deliverables:
    - Утверждённый план-график с критическим путём и реестр рисков
    - Еженедельные статусы, ежемесячные отчёты по затратам проекта
    - Протоколы согласования по 10 вехам и 5 подписанных актов этапов
    - Журнал изменений и допсоглашения по правкам КД корпусов
    - Протоколы трёх проектных ревью
  inputs:
    - Подписанный договор и аванс
    - Контакты и сроки ответов у заказчика и поставщиков
    - Допуск на площадку и наряды-допуски на огневые работы

"Э1 · Технический проект и исходные данные":
  deliverables:
    - Таблица параметров корпусов (8 Ø, 166 исполнений) и расчёт производительности по чертежам
    - Отчёт по обследованию площадки (обмеры, фото)
    - Интерфейсный документ с ячейкой сборки (ICD-01)
    - Подписанный заказчиком протокол эквивалентов
    - Планировка 1:100 (3 листа А1), сводная таблица ресурсов, задание на фундамент
    - Подписанный протокол защиты техпроекта
  inputs:
    - Чертежи 8 типоразмеров (Приложение №2 к ТЗ) в полном объёме
    - Допуск на площадку и дата выезда
    - Данные ячейки сборки заказчика (поставщик, робот, протокол, точка передачи)

"Э2 · Рабочая КД: механика":
  deliverables:
    - Протокол испытаний образцов EPM и решение по типу захвата (до выпуска КД)
    - Рабочая КД захвата, станций перехвата, колонн, рельсового модуля с тележкой, рольгангов, колпаков, ограждения, оснастки под 8 типоразмеров
    - Расчётные записки (нагрузки на запястье, прогиб станины, основания, световые завесы)
    - Общий сборочный чертёж, монтажный чертёж, сводная спецификация, пневмо- и газовая схемы
    - Комплект КД с нормоконтролем
  inputs:
    - Утверждённый технический проект
    - Образцы EPM-модулей от поставщиков для испытаний
    - Паспорт робота (моменты и инерция на запястье)
    - Отчёт симуляции RoboDK по компоновке

"Э3 · Электропроект":
  deliverables:
    - Однолинейная схема и расчёт нагрузок, схема ИБП
    - Схемы силовых цепей, управления и контура безопасности PL d
    - Схемы блока управления захватом и блока контроля залипания проволоки
    - КД трёх шкафов, кабельный журнал (~800 м)
    - Электропроект, подписанный нормоконтролем, и ведомость покупных
  inputs:
    - Утверждённый технический проект и ICD-01
    - Паспорта и схемы подключения роботов, источников, приводов, ПЛК
    - Данные о питании на площадке (ввод 380 В)

"Э4 · Программное обеспечение линии":
  deliverables:
    - "Логика ПЛК: режимы, пара постов, тележка, рольганги, захват, очистка, источники, лазерный трекер"
    - Логика безопасности (6 дверей, завесы, STO, зоны) с протоколом верификации
    - HMI/SCADA на русском и английском, каталог тревог ≈300 записей
    - Удалённая помощь и резервное копирование программ роботов
    - Генераторы траекторий и постпроцессор RoboDK → Inovance, база 166 исполнений, задания источников ≥120
    - Эмулятор линии, протоколы тестов, журнал партий и режимов сварки
  inputs:
    - Согласованные архитектура и таблица сигналов
    - Паспорта и протоколы обмена оборудования (Inovance, Megmeet, лазерный трекер)
    - Интерфейс ячейки сборки (ICD-01)

"Э5 · Программы роботов и офлайн-симуляция (RoboDK)":
  deliverables:
    - Станция RoboDK на роботе Inovance, повтор проверок по 8 типоразмерам
    - Таблица тактов по модели и закрытые пункты «не проверено»
    - "Шаблоны программ поста: цикл, захват, лазерный поиск и слежение, начало и конец шва, перехват, укладка"
    - Зоны столкновений, обмен робот — ПЛК
    - Пост 2 по шаблону поста 1
  inputs:
    - Отчёт симуляции предыдущей версии станции
    - Паспорт и модель робота Inovance
    - Геометрия корпусов по Приложению №2

"Э6 · Закупка, входной контроль, документы на покупные":
  deliverables:
    - Сводная таблица RFQ и выбор поставщиков
    - 25–30 подписанных заказов, журнал поставок
    - "Акты входного контроля: роботы, покупные узлы, электрика и безопасность"
    - Сертификат происхождения
    - Папка деклараций ЕАЭС на покупные комплектующие
  inputs:
    - Согласованная спецификация и протокол эквивалентов
    - Аванс
    - Ответы поставщиков по RFQ (робот 8–16 нед., EPM 6–11 нед.)

"Э7 · Изготовление ПР (цех, Гродно)":
  deliverables:
    - Захваты ×2 собраны, ток и усилие проверены
    - Станции перехвата ×2, колонны ×2 с консолями и постами горелок
    - Станина 11 м, рельсы, рейка, привод и двухместная тележка
    - Основания роботов, рольганги, колпаки
    - Ограждение с окраской, шкафы, панели, пневматика
    - Оснастка под 8 типоразмеров, подготовленный стенд
  inputs:
    - Выпущенный комплект КД после нормоконтроля
    - Материалы и покупные комплектующие по спецификации
    - "Стенд в Гродно: кран ≥3 т, ввод 380 В, воздух"

"Э8 · Сборка и внутренняя отладка на стенде (Гродно)":
  deliverables:
    - "Механика собрана и выверена: путь 11 м, тележка, роботы, колонны, рольганги, ограждение"
    - Электромонтаж и кабельные трассы
    - ПНР роботов, источников, лазерных трекеров, тележки, рольгангов, безопасности
    - Сквозная отладка связи ПЛК — роботы — источники — трекеры — HMI — SCADA
    - Извещения об изменении КД по факту сборки
  inputs:
    - Изготовленные узлы (Э7) и покупные комплектующие (Э6)
    - ПО ПЛК, HMI и роботов, прошедшее проверку на эмуляторе (Э4–Э5)
    - Подготовленный стенд

"Э9 · Отработка технологии сварки":
  deliverables:
    - Карты режимов (WPS) на 8 типоразмеров, оба поста
    - "Протоколы тактов: Ø600 серией 20 корпусов, остальные по 5"
    - Протокол проверки выборки исполнений
    - Протоколы испытаний захвата на корпусах и подбор импульса размагничивания
    - Контроль образцов (макрошлифы), процедура быстрой переналадки, таблица расходов
    - Технологический отчёт
  inputs:
    - Корпуса от заказчика (30–50 шт.) с актом приёма
    - Линия, отлаженная на стенде
    - "Расходные материалы: проволока, газ"

"Э10 · Предварительная приёмка у изготовителя (Гродно)":
  deliverables:
    - Согласованная ПМИ-1 и репетиция приёмки
    - "Подписанные протоколы дней 1–3: комплектность и безопасность, производительность Ø600, отказоустойчивость"
    - Протокол предварительной приёмки со списком замечаний
    - Закрытые замечания и повторные испытания
    - Видео приёмки и материалы для заказчика
  inputs:
    - Линия, отлаженная на стенде, с картами режимов (Э9)
    - Согласованная с заказчиком программа ПМИ-1
    - Регламент и приглашение на визит заказчика

"Э11 · Разборка, упаковка, доставка на площадку заказчика":
  deliverables:
    - Электрика отключена и промаркирована
    - Механика разобрана по монтажному чертежу и промаркирована
    - Груз упакован, ведомость мест
    - Погрузка (4 рейса, автокран), доставка и заноска на участок
    - Ведомость повреждений после распаковки
  inputs:
    - Подписанный протокол предварительной приёмки
    - Монтажный чертёж и чертёж транспортных положений
    - Готовность площадки заказчика принять груз (проезд, кран)

"Э12 · Монтаж и пусконаладка на площадке заказчика":
  deliverables:
    - Акт готовности площадки, анкеры установлены
    - Смонтированы станина, рельсы, тележка, роботы, колонны, станции перехвата, рольганги, колпаки, ограждение
    - Подключены питание, воздух, газ, охлаждение, цеховая сеть
    - Восстановлены мастеринг роботов и калибровка лазерных трекеров
    - Протокол функций безопасности на месте, отлаженная передача корпусов с ячейкой сборки
    - Цикл на реальных корпусах, три смены опытной эксплуатации, площадка очищена
  inputs:
    - Готовые фундамент и пол, коммуникации (380 В, воздух, газ, вытяжка Ø350) — на стороне заказчика
    - Допуски и наряды-допуски на огневые работы
    - Ячейка сборки заказчика, готовая к стыковке; корпуса для опытной эксплуатации

"Э13 · Финальные испытания под промышленной нагрузкой":
  deliverables:
    - Согласованная ПМИ-2 (≥17 корпусов в час)
    - Подписанные протоколы испытаний за 3 дня, две смены
    - Протокол замеров электроэнергии, газа, проволоки, воздуха
    - Протокол сдаточных испытаний и акт ввода в эксплуатацию
    - Закрытые замечания и повторные испытания
  inputs:
    - Линия, введённая в работу на площадке (Э12)
    - Корпуса заказчика в нужном количестве
    - Персонал заказчика на смены испытаний

"Э14 · Документация (схемы и спецификации рус+англ, эксплуатационные документы рус)":
  deliverables:
    - Электрические, электронные, механические, пневматические и газовые схемы, рус + англ
    - Спецификации комплектующих и перечень ЗИП, рус + англ
    - Архив управляющих программ и комплект ПО
    - "Руководства: оператора, программиста, по эксплуатации, ТО и ремонту; регламент ТО"
    - Паспорт линии, альбомы и акт передачи
  inputs:
    - Комплект as-built по итогам монтажа
    - Итоговые версии ПО и программ роботов
    - Требования заказчика к составу документации (ТЗ, раздел 9)

"Э15 · Обучение персонала (5 категорий)":
  deliverables:
    - "Комплекты обучения: операторы, наладчики, инженеры-электронщики, механики, электрики"
    - Тесты и практические задания
    - Обученный персонал, протоколы и удостоверения
    - Повторное обучение для второй смены
  inputs:
    - Линия в работе на площадке
    - Списки обучаемых и графики смен от заказчика
    - Готовые руководства и документация

"Э16 · Безопасность и подтверждение соответствия (ТР ТС 010/004/020)":
  deliverables:
    - "Оценка риска: границы, опасности, меры, остаточные риски, объединённая установка с ячейкой сборки"
    - Расчёт PL по 12 функциям безопасности и протокол верификации
    - Методика валидации и обоснование безопасности (ГОСТ 33855-2016)
    - Доказательные материалы по ТР ТС 010, 004, 020
    - Сертификат и зарегистрированная декларация, знак EAC на линии
  inputs:
    - Схемы цепей безопасности и данные B10d/MTTFd по компонентам
    - Декларации ЕАЭС на покупные комплектующие
    - Протокол разграничения ответственности с заказчиком по объединённой установке

"Э17 · Гарантийное сопровождение 24 месяца (резерв)":
  deliverables:
    - Журналы удалённой поддержки, месяцы 1–24
    - Акты гарантийных выездов (1, 3, 6, 9, 12, 15, 18, 21, 24 мес.)
    - Акты устранения дефектов
    - Журнал обновлений ПО и проверок резервных копий
  inputs:
    - Акт ввода в эксплуатацию (Э13)
    - Работающий удалённый доступ к линии
    - Запасные части по ЗИП
