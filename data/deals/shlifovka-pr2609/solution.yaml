# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
summary: 'Стационарный шестиосевой робот класса 130 кг стоит перед фронтом станка, без линейной оси. В
  глубину стола он не работает: его зона — входной и выходной поддоны и подающая секция шириной 1,0 м
  прямо перед столом. Ковёр собирается на этой секции, а на стол и обратно его переносит двухосевой агрегат
  «толкай-тяни» — портал на напольных рельсах по бокам стола, который планкой толкает ковёр вперёд и зацепом
  стягивает назад. Изделия берутся снизу вилкой с прижимом, пакетами по три; из плотной кладки поддона
  верхний ряд выдвигает за кромку толкатель поста ВХОД. Поддоны стоят у линии ограждения и работают шлюзом:
  рохля заводит поддон внутрь, а корпус тележки и человек остаются снаружи. Ячейка занимает 21,3 м² и
  обслуживает существующий станок, не меняя ни его программ, ни его собственных функций безопасности.'
nodes:
- name: Робот 130 кг, стационарный
  what: снимает пакеты из трёх изделий с входного поддона, укладывает их в подающую секцию и после обработки
    переносит на выходной поддон
  why: вылет 3,1 м закрывает оба поста и всю рабочую часть секции без линейной оси — проверено на 33 целях
    из 33; на фланце 83 кг (пакет 54,6 кг плюс захват), это две трети класса, и запас держится даже на
    расчётном изделии 30 кг при переходе на пакет из двух
- name: Исполнение под мокрую зону
  what: защитный чехол робота, промывочный пост захвата, опорная плита и анкеровка
  why: вода, бетонный шлам и абразив идут по всей зоне круглосуточно; оси 1–3 робота — в исполнении с
    повышенной защитой, остальное закрывается чехлом и регулярной промывкой
- name: Вилочно-прижимной захват
  what: 'единственный инструмент ячейки: пальцы заходят в зазоры настила, прижим фиксирует пакет, неподвижная
    плита-съёмник снимает изделия с пальцев при укладке'
  why: 'подхват снизу — единственный приём, работающий и на плите 24 мм, и на пустотном камне: клещам
    между изделиями, уложенными встык, некуда войти, а присоске на разборе поддона мешают шершавая мокрая
    грань и пустоты. Один инструмент на весь цикл снимает стойку смены, быстросменный адаптер и логику
    смены'
- name: Агрегат «толкай-тяни»
  what: двухосевой портал на напольных рельсах по бокам стола; планкой толкает собранный ковёр на стол
    порциями, зацепом шагами стягивает обработанный обратно
  why: робот физически не достаёт в глубину неподвижного стола под порталом станка, а переносить ковёр
    целиком дешевле и быстрее, чем ставить робота на линейную ось
- name: Подающая секция 3,6 × 1,0 м
  what: площадка перед столом с полосами UHMWPE, бортами и лотком шлама, на которой ковёр собирается и
    разбирается
  why: держит всю работу робота вне зоны станка; низкое трение по UHMWPE позволяет толкать ковёр массой
    до 1638 кг усилием 4,0 кН
- name: Пост ВХОД — карман, боковые прижимы, толкатель свеса
  what: базирует входной поддон ловителями и упором, поджимает слой с боков и выдвигает верхний ряд за
    кромку поддона под вилку
  why: раскладку предыдущего передела мы не меняем, изделия лежат встык без зазоров — взять их можно,
    только отодвинув ряд от остальных
- name: Пост ВЫХОД — ловители, упоры, центрирующая рамка
  what: базирует выходной поддон и поджимает уложенный слой с четырёх сторон четырьмя цилиндрами
  why: ровный слой на выходе — условие того, что поддон уйдёт дальше по заводу без ручной правки
- name: Ограждение, ворота, безопасный интерфейс со станком
  what: периметр высотой 2,2 м, двое ворот с замками-блокировками по створу поддонов, четыре кнопки аварийного
    останова, контактор безопасности и двухканальный датчик парковки головки станка
  why: ТР ТС 010, ГОСТ Р ИСО 10218 и ГОСТ Р ИСО 11161. Робот геометрически дотягивается за линию ограждения,
    поэтому безопасность держится на блокировке ворот и ограничении зоны в контроллере, а не на расстоянии.
    В цепи станка вмешиваемся внешним контактором, его схему не трогаем
- name: Система зрения
  what: измеряет габариты изделия, находит фактическое положение верхнего ряда на поддоне, опознаёт тип
    изделия для подгрузки программы
  why: просветы в кладке поддона нерегулярны, а ячейка должна принимать номенклатуру, которой сегодня
    нет, без переделки оснастки — отсюда измерение, а не сравнение с образцом
- name: Электрика и управление
  what: шкаф за ограждением, контроллер ячейки, панель оператора, реле безопасности, пневмоподготовка,
    воздушный нож
  why: блокировки между роботом и агрегатом обязательны — ригель уходит в зону секции только когда робот
    у постов; шкафы вынесены наружу, внутри ячейки они попадали в зону движения руки
- name: Настил стола станка
  what: комплект деревянного настила нашего изготовления плюс запасной брус
  why: настил расходный, а шаг пальцев вилки кратен шагу брусьев — геометрию зазоров задаём мы, а не подбираем
    под изношенный настил
rejected:
- option: Вакуумный захват
  why: 'узкое место ячейки — разбор поддона, а не стол: там грань шершавая и мокрая, а у половины номенклатуры
    две пустоты съедают 53 % площади присасывания. На столе условия для вакуума как раз хорошие, но там
    уже работает вилка — менять её не на что. Отраслевая практика не запрещает вакуум по мокрому вибропрессованному
    бетону, но требует воздуходувки 160–300 м³/ч при −150…−200 мбар и губчатой присоски (Ledrobit, Pedrini):
    насос и эжектор ручных лифтеров на пористом бетоне бесполезны. Это отдельный агрегат, фильтр с обратной
    продувкой и другая задача зрения — ради узла, который вилка закрывает проще. ВАЖНО: подтверждения
    от завода по вакууму нет, это наше решение по расчёту и отраслевым данным'
- option: Клещевой захват трением по торцам
  why: у серийных клещевых захватов порог по толщине 40–50 мм, а у нас плиты от 24 мм; и между изделиями,
    уложенными встык, губкам некуда войти. Для подхвата снизу такого порога не существует — серийные вилочные
    захваты берут плиты от 15–25 мм
- option: Слоевой отбор пачкой, как на линиях вибропрессования
  why: отрасль так делает потому, что слой должен уйти за такт пресса. У нас робот свободен 12–20 минут,
    пока идёт шлифовка, поэтому поштучный отбор пакетами подходит, а слоевой требует другого класса робота
    и кантователя и удорожает узел отбора в разы. Оставлен как запасной план
- option: Накопитель на всю площадь стола с роботом на линейной оси
  why: даёт выпуск выше на 8–13 %, но занимает 33,2 м² вместо 21,3 и требует линейной оси. Заявленная
    цель — убрать тяжёлый ручной труд, а не поднять выработку
- option: Робот напрямую между поддоном и столом, без агрегата
  why: робот не достаёт в глубину стола под порталом станка, а прирост выпуска против ручной работы оказывается
    в пределах погрешности расчёта
- option: Двухпозиционный поворотный стол
  why: стол станка неподвижен и загружается целиком; поворачивать пришлось бы площадку 3,6 × 1,9 м с ковром
    массой до 1638 кг
- option: Балансирный манипулятор вместо робота
  why: снимает вес с рук, но человек остаётся в мокрой зоне у станка и по-прежнему ведёт каждое изделие
    руками. Заявленную цель это закрывает наполовину; как более дешёвый путь прорабатывается отдельно
proof:
- 'Досягаемость проверена на геометрии поставляемого робота, разобранной на кинематические звенья из модели
  изготовителя: пост ВХОД 4 слоя из 4, включая нижний у пола; подающая секция 9 позиций из 9; пост ВЫХОД
  20 целей из 20. Линейная ось не нужна'
- 'Коллизии: свип агрегата по всему ходу 2,95 м, все шаги тяги, разборка и укладка — чисто. Три конструктивных
  требования найдены моделью и внесены в КД: проём во фронтальном ограждении под ногу агрегата, борта
  секции раздвинуты до ±1900 мм, центрирующая рамка опущена до 780 мм'
- 'Вариант с ожиданием ригеля над секцией проверен и отклонён расчётом, а не мнением: плечо робота пересекало
  ригель в 5 позициях из 9. Принято ожидание над столом с блокировкой в контроллере'
- 'Такт: простой станка 12,8–14,6 мин на ковёр из 90 изделий; выпуск 176–187 шт/ч при цикле шлифовки 16
  мин против 159 шт/ч ручной укладкой. Это та же цифра, что стоит в схеме процесса и в расчёте окупаемости'
- 'Параллельность подтверждена расчётом окон, а не предположением: шаг тяги 1,9 с в окно 6,6 с; толчок
  агрегата 14,4 с в окно 46,3 с; подтяжка последнего ряда 13,5 с в окно двух с половиной пакетов. Простой
  станка от параллельных операций не растёт'
- Усилие толкания полного ковра 4,0 кН при трении 0,25 и 8,0 кН при 0,50 — привод выбран по верхней границе,
  с запасом на худший случай
- Пальцы вилки 40 мм попадают в зазоры настила 45 мм с отклонением 0,0 мм во всех трёх позициях пакета
  — проверено на детальной модели захвата, а не на габаритной оболочке
- 'Доступ к поддонам проверен геометрией: вилы рохли входят внутрь, корпус тележки и человек остаются
  за линией ограждения с запасом 825 мм'
- Площадь ячейки 21,3 м² (5,00 × 4,27 м) плюс полоса проезда 2,5 м снаружи ограждения
limits:
- 'Принцип захвата механический и вакуум в составе не заложен — это наше решение, принятое по расчёту
  и отраслевым данным, а не ответ завода. Один узел остаётся нерешённым: укладка самого нижнего слоя на
  выходной поддон, где пальцы вилки упираются в настил. Путь выбирается после испытаний на реальных образцах
  — гребёнка-съёмник, тонкие пальцы, контролируемый сброс, прокладка под поддон либо вакуумный модуль;
  при выборе вакуума в состав добавляются воздуходувка, фильтр и зонный коллектор, а задача зрения расширяется
  поиском точки присасывания'
- Цикл шлифовки 12–20 минут с расчётным значением 16 — наша оценка двумя независимыми способами, а не
  данные завода. При фактических 20 минутах ячейка даёт 156–164 шт/ч, прироста к сегодняшнему уровню нет
  и остаётся только замещение ручного труда
- Ковёр 90 изделий при полном заполнении рабочей поверхности стола — расчёт сетки, не замер. Меньший ковёр
  пропорционально меняет такт и число движений робота
- Выпуск ниже, чем у схемы с накопителем на всю площадь стола, на 8–13 %. Одноярусная схема несёт всю
  перекладку в простое станка
- Отделение изделия от сплошной кладки отбором ряда «за свес» — главный непроверенный риск решения. Он
  снимается ранним макетом и стендовой отладкой до выпуска рабочей КД, а не обещанием
- Зазор между десятирядным ковром и штатным упором стола 23 мм при необходимых 32. Базовое решение — останов
  ковра сервоприводом за 20 мм до упора, станок не дорабатывается; требует замера
- Робот геометрически дотягивается за линию ограждения и до места оператора. Безопасность держится на
  блокировке ворот и ограничении зоны в контроллере, а не на расстоянии — соответствующая функция контроллера
  обязательна
- 'Если слои входного поддона уложены с перевязкой, повёрнутый ряд выходит за грузоподъёмность на вылете:
  потребуется либо робот крупнее класса, либо отбор по два изделия (медленнее), либо договорённость о
  кладке без перевязки'
- Коэффициент трения изделия по настилу 0,25 принят по описанию. При 0,50 усилие вырастает вдвое (привод
  считан с запасом), при 0,15 появляется риск сдвига изделий при разгоне — ограничивается ускорением
- 'Укладка нижнего слоя на выходной поддон: пальцы упираются в настил поддона. Способ решения выбирается
  в рабочей КД после замера настила поддона заказчика; слои со второго по четвёртый этой проблемы не имеют'
- Свободные сухие контакты станка не подтверждены. Без них применяется схема с обесточиванием станка на
  время работы ячейки в его рабочем пространстве — выпуск ниже ориентировочно на 3–7 %
- Согласие изготовителя станка на объединение установок не получено. Без него объединённую установку нельзя
  декларировать, а врезка в цепи станка может затронуть его гарантию
- Одна оснастка закрывает изделия 2–30 кг, длиной 190–650, шириной 90–400 и толщиной 24–250 мм. Выход
  за этот диапазон требует второго инструмента и возвращает в состав быстросменный адаптер
- Изделий тяжелее 18,2 кг в сегодняшнем каталоге нет; запас до 30 кг заложен по требованию и на реальном
  изделии не проверен. На изделии 30 кг пакет уменьшается с трёх до двух, и смена ковра удлиняется
- 'Тонкие плиты 24 мм: планка толкает их за кромку высотой 16–18 мм, есть риск клевка переднего края на
  стыке секции и стола. Проверяется на стенде до выпуска рабочей КД'
- Геометрия участка — свободная глубина перед станком, сливной канал, сечение настила, пол под анкеровку
  — принята по описанию и видео. Привязка агрегата к столу выполнена по расчётным размерам; обмеры входят
  первым шагом работ
- Тип и габарит поддона, модель рохли и ширина проезда 2,5 м — оценка. Вся схема доступа построена на
  том, что вилы длиной 1150 мм входят вдоль стороны поддона 1200 мм
- Приёмочные показатели (производительность, работа на 14 позициях, человек вне ограждения) и объём контрольной
  серии — наше предложение, а не согласованный документ; окончательно закрепляются до договора
- Такт и площадь считаны на кинематике робота того же класса, но другой модели; досягаемость пересчитана
  на поставляемом роботе и подтверждена с запасом, поскольку его рука длиннее. Повторный расчёт такта
  на фактической геометрии входит в технический проект
- Выровненность изделий по высоте в ковре принята в пределах разброса ручной укладки; компенсации по высоте
  в ячейке нет
- Ячейка обслуживает только станок шлифовки; полировка принята отдельной машиной. Если это второй проход
  на том же станке, компоновка остаётся той же, но число перекладок удваивается
- Поддон на входе всегда одного типа, сортировка не требуется. Смешанные поддоны потребуют сортировки
  — это другая задача
- Обмена данными с заводскими учётными системами не предусмотрено; журнал ведётся на панели оператора
  ячейки
- Контроль дефектов поверхности и оценка результата шлифовки в объём зрения не входят
- Паспорт и электрическая схема станка, документы на настил, программы ЧПУ с расчётным временем цикла,
  тип поддона и план участка передаются заказчиком по запросу — это его обязанность со сроком. Без них
  часть рабочей КД и электропроекта не выпускается
- Особых требований службы охраны труда завода не заявлено. Если они есть, состав функций безопасности
  и ограждения может вырасти против заложенного
