# Выход (deliverables) и вход (inputs) каждого этапа — для согласования на портале.
# Ключ = точное имя этапа из wbs.yaml. Составлено по смете v5, 01.10.2026.
"Шаг 1 · выездная диагностика участка":
  deliverables:
    - Отчёт по обследованию с протоколами, подписан акт
    - Бланк обмеров 17 позиций с эскизами
    - Таблица трения μ (сухой / мокрый настил)
    - Протокол усилий выдвижения и подхвата (плиты 24 и 41 мм) + видео
    - Хронокарта цикла станка и ручной перекладки
    - Фотоархив для зрения (60–80 кадров) и схема кладки поддона
    - Запрос в КАМИ по электросхеме Denver отправлен
  inputs:
    - Ответ заказчика на письмо-запрос (паспорт и электросхема станка, документы на настил, программы ЧПУ, тип поддона, план участка)
    - Допуск на площадку и согласованная дата выезда
    - Изготовленная оснастка замеров (салазки, скоба, вилка)
"Шаг 2 · технический проект":
  deliverables:
    - Технический проект (комплект чертежей общих видов по всем узлам)
    - План участка и габаритный чертёж ячейки
    - Схема стыка «ячейка ↔ станок», согласованная с главным механиком
    - Станция симуляции на фактической геометрии + отчёт (такт, досягаемость, коллизии)
    - Оценка риска уровня ТП, перечень функций безопасности
    - Спецификация закупки с ответами поставщиков (RFQ)
    - Уточнённая смета шага 3, ТЗ, протокол защиты ТП
  inputs:
    - Отчёт шага 1 со всеми протоколами
    - Схема электрики Denver и письменное согласие владельца/КАМИ на врезку
    - КП поставщиков по длинным позициям (робот, направляющие)
"Э3 · Рабочая КД и электропроект":
  deliverables:
    - Полный комплект рабочей КД (захват, агрегат, секция, посты, плита, ограждение)
    - Электропроект (принципиальные схемы, шкаф, кабельный журнал)
    - Закупочные спецификации по всем узлам
  inputs:
    - Утверждённый технический проект
    - Фактические замеры 17 позиций
    - Решение по направляющим (профильный рельс или V-ролики) по итогам RFQ
"Э4 · Программное обеспечение ячейки":
  deliverables:
    - Логика ПЛК и программы робота
    - Контур безопасности (конфигурация, тесты)
    - Зрение и автораскладка (оценка на нашей стороне)
    - HMI, синхронизация двух ног агрегата, протокол внутреннего тестирования
  inputs:
    - Электропроект Э3 (адресация, интерфейсы)
    - Станция симуляции с траекториями
    - Карта безопасности робота и документация ПЛК
"Э5 · Изготовление и сборка (Гродно)":
  deliverables:
    - Все узлы изготовлены, ячейка собрана на стенде в Гродно
    - Акты входного контроля поставок (робот, покупные узлы)
  inputs:
    - Рабочая КД Э3
    - Поставка робота и длинных позиций (критический путь 16–18 недель)
    - Материалы и метизы по спецификациям
"Э6 · Стендовая отладка (Гродно)":
  deliverables:
    - Отлаженный цикл на реальной номенклатуре (протоколы испытаний)
    - Замер такта, протокол ПСИ на стенде
    - Ячейка принята внутренней приёмкой и упакована к отгрузке
  inputs:
    - Собранная ячейка Э5 и ПО Э4
    - Образцы изделий и поддоны реальной продукции заказчика
"Э7 · Документация и подтверждение соответствия":
  deliverables:
    - Оценка риска ячейки и объединённой установки «ячейка + станок»
    - Расчёт PL контура безопасности
    - Эксплуатационная документация, ПМИ, схемы, ведомость ЗИП
    - Декларация ТР ТС 010/004/020
  inputs:
    - Результаты стендовых испытаний Э6
    - Декларации и паспорта поставщиков комплектующих
"Э8 · Доставка, монтаж и пусконаладка (Минск)":
  deliverables:
    - Ячейка смонтирована, подключена и откалибрована на площадке
    - ПНР на реальном потоке, выход на паспортный такт
    - Акт приёмки заказчиком, персонал обучен (2–3 смены)
  inputs:
    - Упакованная ячейка после Э6
    - Готовность площадки (пол, электро- и пневмоподводы, окно остановки станка)
    - Допуски нашего персонала на территорию
"Э9 · Управление проектом":
  deliverables:
    - План-график, реестр рисков, 32 недельных статуса
    - 4 подписанных акта этапов по графику платежей
    - Итоговый отчёт и фактические часы в справочник норм
  inputs:
    - Подписанный договор и график платежей
"Ранний макет и износный образец":
  deliverables:
    - Протокол испытаний макета отбора (свес, подхват, пакет, кантовка)
    - Решение о заморозке КД вилки и кармана
    - Протокол износа UHMWPE → регламент ТО
  inputs:
    - Образцы изделий заказчика (3–5 типоразмеров)
    - Материалы оснастки макета (недели 2–5 проекта)
