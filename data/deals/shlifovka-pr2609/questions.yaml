  impact: объём программирования панели оператора
  risk: low
- id: Q18
  topic: Полировка и второй проход
  q: обслуживает ли ячейка только один станок
  need: выполняется ли полировка на том же станке вторым проходом или на отдельной машине
  status: assumed
  answer: принимаем, что полировка выполняется на отдельной машине, а ячейка обслуживает только станок
