# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
questions:
- id: Q1
  topic: Номенклатура
  q: что перекладываем — вся номенклатура, а не одна позиция
  need: габариты, масса, число типоразмеров, самое тяжёлое и самое крупное изделие
  status: answered
  answer: 14 выделенных позиций массой 3,9–18,2 кг — плоские облицовочные плиты толщиной 24, 41, 58 и
    88 мм и пустотные столбовые камни 390×138×190 и 390×188×190 мм; длина почти везде 390 мм. Расчётный
    запас по массе — до 30 кг, изделий такой массы в сегодняшнем каталоге нет. Одна оснастка рассчитана
    на диапазон 2–30 кг, длина 190–650, ширина 90–400, толщина 24–250 мм.
  source: каталог продукции заказчика, выборка позиций согласована; запас по массе — требование заказчика
  impact: класс робота, конструкция захвата, число изделий в пакете, такт
  risk: high
- id: Q2
  topic: Операция
  q: что именно делает ячейка и что считается годной укладкой
  need: что происходит с изделием, критерий качества укладки, среда
  status: answered
  answer: ячейка укладывает изделия плотным ковром встык на деревянный настил стола станка с базированием
    по штатному упору и после обработки разбирает ковёр обратно на поддон. Станок шлифует верхнюю грань
    всего ковра за один установ, шлифовка мокрая — вода и бетонный шлам по всей зоне. Годная укладка —
    изделие не повреждено, ряд выровнен по фронту, ковёр доведён до упора.
  source: фото и видео участка, подтверждено заказчиком
  impact: тип захвата, конструкция агрегата подачи, исполнение оборудования
  risk: high
- id: Q3
  topic: Точность укладки
  q: насколько критична выровненность изделий по высоте в ковре
  need: допустимое превышение соседних изделий, как это обеспечивается сегодня
  status: assumed
  answer: принимаем, что выравнивание по высоте обеспечивается самим настилом и ровностью поддона, а допустимое
    превышение соседних изделий лежит в пределах разброса ручной укладки; дополнительных измерительных
    и компенсирующих устройств в ячейку не закладываем
  basis: сегодня ковёр выкладывают руками без каких-либо измерительных приспособлений — значит процесс
    терпим к разбросу ручной укладки; ячейка ставит изделие на тот же настил и по тому же упору, то есть
    повторяет базирование, а не ухудшает его
  impact: нужна ли компенсация по высоте, требования к плоскостности настила
  risk: mid
- id: Q4
  topic: Производительность
  q: сколько изделий в час и в каком режиме работает участок
  need: длительность цикла шлифовки, ёмкость одной загрузки стола, сменность
  status: assumed
  answer: цикл шлифовки полного стола 12–20 мин, расчётное значение 16; на стол укладывается 90 изделий
    сеткой 9×10 по камню 390×190 при полном заполнении рабочей поверхности; режим — двое рабочих в смену,
    до трёх смен, циклы идут подряд без пауз
  basis: цикл оценён двумя независимыми способами — по траектории инструмента на паспортных подачах мостового
    станка того же класса и по производительности съёма мозаично-шлифовальных машин по бетону; обе оценки
    сошлись и подтверждены обратным счётом от числа людей на участке. Ёмкость ковра — расчёт сетки на
    паспортной рабочей поверхности стола. Режим — со слов заказчика
  impact: расчёт выпуска, обоснование окупаемости, выбор схемы подачи ковра
  risk: high
- id: Q5
  topic: Граница поставки
  q: откуда изделие приходит и куда уходит, что наше и что заказчика
  need: точки входа и выхода, кто подаёт и забирает, что остаётся в контуре заказчика
  status: answered
  answer: 'вход — поддон, который человек завозит рохлей в пост ВХОД ячейки; выход — поддон, который человек
    вывозит с поста ВЫХОД. Всё между этими двумя поддонами делает ячейка. Станок шлифовки остаётся оборудованием
    заказчика: его программы, параметры цикла и собственные функции безопасности мы не меняем. Конвейеров
    на участке нет, поддон одного типа, сортировка не требуется.'
  source: постановка задачи заказчика; раскладку предыдущего передела не меняем — решение согласовано
  impact: объём поставки, зона ответственности на приёмке, конструкция постов поддонов
  risk: high
- id: Q6
  topic: Площадка
  q: где это физически встанет
  need: свободная глубина перед фронтом станка, пол и возможность анкеровки, сливной канал, подводы
  status: assumed
  answer: принимаем 4,0 м свободной глубины перед фронтом станка при потребности ячейки 5,00 × 4,27 м,
    плюс полосу проезда 2,5 м снаружи ограждения под рохлю; пол бетонный, анкеровка напольных рельсов
    агрегата и плиты робота возможна; сливной канал перед станком перекрывается опорной рамой; питание
    и сжатый воздух на участке есть
  basis: видео и фотографии участка плюс описание заказчика «места много»; габариты ячейки взяты из расчётной
    модели компоновки, а не на глаз. Абсолютный минимум по глубине — 2,2 м, ниже 2,0 м решения нет ни
    в каком виде. Замеры вынесены в выездную диагностику первым шагом работ, то есть предположение проверяется
    до основных вложений
  impact: компоновка, положение робота, объём монтажных работ, фундаментные работы
  risk: high
- id: Q7
  topic: Оборудование заказчика
  q: что остаётся в контуре из существующего и как с ним стыковаться
  need: электросхема станка, наличие свободных сухих контактов «цикл завершён», «старт», «авария» и сигнала
    парковки обрабатывающей головки
  status: ask
  ask_text: Просим электрическую схему и эксплуатационную документацию станка и подтверждение, выведены
    ли свободные сухие контакты «цикл завершён», «старт», «авария» и сигнал парковки обрабатывающей головки
    — либо их потребуется организовывать.
  impact: 'схема стыка и производительность ячейки. Запасной ход проработан: без контактов применяется
    схема с обесточиванием станка на время работы ячейки в его рабочем пространстве, выпуск при ней ниже
    ориентировочно на 3–7 %'
  risk: mid
- id: Q8
  topic: Приёмка
  q: по какому критерию заказчик примет работу
  need: измеримые показатели, номенклатура испытаний, объём контрольной серии, место испытаний
  status: assumed
  answer: 'принимаем приёмку по трём показателям: производительность не ниже сегодняшней ручной укладки
    при подтверждённом цикле шлифовки, устойчивая работа на реальной номенклатуре не менее 14 позиций
    и отсутствие человека внутри ограждения в течение всего цикла. Контрольная серия — не менее десяти
    ковров подряд на площадке заказчика, плюс стендовые испытания в нашем цехе до отгрузки'
  basis: показатели выведены из заявленной цели заказчика (убрать тяжёлый ручной труд) и из расчёта такта
    компоновки; двухступенчатая приёмка «стенд у изготовителя, затем площадка» — обычная практика компании
    по роботизированным ячейкам. Формулировка идёт в ТКП как предложение и согласуется до договора
  impact: программа и методика испытаний, сроки пусконаладки, резерв на доводку
  risk: mid
- id: Q9
  topic: Исходные данные
  q: что заказчик даёт и когда
  need: паспорт и электросхема станка, документы на настил, программы ЧПУ с расчётным временем цикла,
    тип поддона, план участка, допуск на площадку
  status: assumed
  answer: принимаем, что заказчик по письменному запросу передаёт паспорт и электрическую схему станка,
    документы на настил стола, программы ЧПУ с расчётным временем цикла, тип поддона и план участка, а
    также даёт допуск на площадку для обмеров; сами обмеры выполняем мы первым шагом работ
  basis: перечень собран по тому, что физически требуется для выпуска рабочей КД и электропроекта. Передача
    исходных данных — обычная обязанность заказчика, которая уходит в договор отдельным приложением со
    сроками. Выезд с обмерами уже заложен отдельным шагом, поэтому отсутствие части данных не останавливает
    работу, а только сдвигает её
  impact: старт рабочей КД, риск простоя проекта, обязанности заказчика в договоре
  risk: mid
- id: Q10
  topic: Нормы и особые требования
  q: чем регламентировано
  need: технические регламенты, стандарты по безопасности роботизированных ячеек, требования службы охраны
    труда завода
  status: assumed
  answer: 'применяем ТР ТС 010/2011 и, по электрике и электромагнитной совместимости, ТР ТС 004 и 020;
    ГОСТ Р ИСО 10218-1 и -2 по роботизированной ячейке; ГОСТ Р ИСО 11161 по объединённой установке «ячейка
    плюс станок». Состав: ограждение 2,2 м, ворота с замками-блокировками, четыре кнопки аварийного останова,
    оценка риска, расчёт уровня производительности функций безопасности и декларирование — всё в объёме
    работ'
  basis: обязательный минимум для роботизированной ячейки в ЕАЭС; особых требований службы охраны труда
    завода не заявлено, в материалах участка их нет
  impact: состав документации, функции безопасности, цена ограждения и подтверждения соответствия
  risk: low
- id: Q11
  topic: Согласие изготовителя станка
  q: получено ли согласие на объединение станка и ячейки в одну установку
  need: письменное согласие изготовителя станка или его сервис-партнёра на объединение и на подключение
    к цепям станка; подтверждение, что это не снимает гарантию
  status: ask
  ask_text: Для объединения станка и ячейки в одну установку нам требуется письменное согласие изготовителя
    станка или его официального сервис-партнёра на такое объединение и на подключение к цепям станка.
    Просим сообщить, у кого станок на гарантии и на сервисном обслуживании, и помочь это согласие получить
    — либо подтвердить, что завод берёт эти отношения на себя.
  impact: кто является изготовителем объединённой установки, возможность её декларирования, сохранение
    гарантии на станок, состав работ по стыку
  risk: high
- id: Q12
  topic: Деньги и решение
  q: ориентир бюджета, желаемый срок запуска и кто принимает решение
  need: порядок бюджета, форма закупки, дата, к которой участок должен работать, кто решает по деньгам
  status: ask
  ask_text: Просим назвать порядок бюджета, к которому вы готовы примеряться, желаемый срок запуска участка
    и форму закупки — прямой договор или конкурсная процедура, а также кто со стороны завода принимает
    решение по деньгам. Это позволит предложить конфигурацию, которая в бюджет укладывается, а не только
    самую полную.
  impact: выбор конфигурации и состава поставки, разбивка работ на шаги, приоритет сделки
  risk: high
- id: Q13
  topic: Схема кладки входного поддона
  q: как изделия лежат на поддоне, с которого робот их забирает
  need: есть ли перевязка слоёв, прокладки, зазоры между изделиями, чередование ориентации
  status: assumed
  answer: 'принимаем кладку без прокладок между слоями, с чередованием ориентации слоёв на 90° и нерегулярными
    просветами 5–20 мм; изделия лежат встык, готовых зазоров под захват нет. Раскладку предыдущего передела
    мы не меняем: верхний ряд выдвигается толкателем за кромку поддона и подхватывается вилкой снизу'
  basis: разбор фотографии реального поддона и решение не вмешиваться в стандартный процесс предыдущего
    передела. Отбор спроектирован именно под сплошную кладку, то есть предположение взято по худшему для
    нас варианту, а не по удобному
  impact: алгоритм отбора, класс робота, такт разборки поддона
  risk: high
- id: Q14
  topic: Настил стола и трение
  q: по чему скользит ковёр и во что заходят пальцы захвата
  need: материал и сечение настила, шаг и ширина зазоров, коэффициент трения изделия по настилу
  status: assumed
  answer: принимаем настил из параллельных деревянных брусьев сечением около 80×60 мм с зазорами 60–100
    мм, в которые заходят пальцы вилки толщиной 40 мм; коэффициент трения изделия по настилу принят 0,25
    с проверкой чувствительности на 0,15 и 0,50
  basis: 'кадры видео участка и описание заказчика; шаг пальцев подобран кратным шагу брусьев и проверен
    на детальной модели захвата. Риск управляемый: комплект настила нашего изготовления входит в поставку,
    то есть геометрию зазоров задаём мы, а не подбираем под изношенный настил'
  impact: конструкция вилки, усилие приводов агрегата, риск сдвига изделий при разгоне
  risk: mid
- id: Q15
  topic: Машинное зрение
  q: что должна делать камера
  need: измерение или опознавание, допустимая погрешность, нужен ли контроль дефектов
  status: assumed
  answer: зрение измеряет габариты изделия, находит фактическое положение верхнего ряда на поддоне для
    коррекции точки захвата и опознаёт тип изделия для подгрузки нужной программы. Контроль дефектов поверхности
    и оценка результата шлифовки в объём не входят
  basis: требование принимать заранее неизвестную номенклатуру без переделки оснастки диктует измерение,
    а не сравнение с образцом; коррекция по факту нужна из-за нерегулярных просветов в кладке поддона.
    Задача контроля качества шлифовки заказчиком не ставилась
  impact: состав системы зрения, объём программирования и отладки, требования к освещению
  risk: mid
- id: Q16
  topic: Эксплуатация
  q: кто работает на ячейке и что требуется от персонала
  need: квалификация, нужно ли обучение, нужен ли сервис в городе заказчика
  status: assumed
  answer: ячейкой управляет тот же персонал участка; в штатном цикле внутрь ограждения никто не заходит
    — человек только завозит и вывозит поддоны рохлей снаружи. Обучение персонала, эксплуатационная документация
