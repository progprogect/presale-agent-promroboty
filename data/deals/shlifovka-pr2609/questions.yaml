  basis: 'заявленная цель — снять тяжёлый труд, а не сократить людей; схема доступа проверена геометрией:
    корпус тележки и человек остаются за линией ограждения'
  impact: состав обучения, эксплуатационная документация, требования к постам поддонов
  risk: low
- id: Q17
  topic: Интеграция с учётными системами
  q: нужен ли обмен данными с заводскими системами
  need: протокол, что именно учитываем, кто ведёт со стороны завода
