  options:
  - label: просить завод помочь получить согласие изготовителя
    note: правильный путь, но срок не в наших руках — зависит от переписки с изготовителем станка
  - label: завод письменно берёт отношения с изготовителем станка на себя
    note: быстрее, ответственность за гарантию станка остаётся у завода; нужна бумага, а не устное «работайте»
  - label: строить стык без врезки в цепи станка
    note: гарантия станка не затрагивается, но вопрос объединённой установки это не снимает, а выпуск
      ниже ориентировочно на 3–7 %
