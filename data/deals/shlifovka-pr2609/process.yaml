# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
title: Цикл участка — от поддона с необработанными изделиями до поддона с обработанными
columns:
- n: 1
  label: Подача поддона
- n: 2
  label: Отбор ряда
- n: 3
  label: Набор ковра
- n: 4
  label: Передача на стол
- n: 5
  label: Шлифовка
- n: 6
  label: Съём со стола
- n: 7
  label: Укладка и вывоз
lanes:
- id: op
  name: Оператор участка
  sub: что делает человек
  kind: human
- id: cell
  name: Ячейка перекладки
  sub: наша поставка
  kind: ours
- id: cl
  name: Оборудование заказчика
  sub: мостовой станок шлифовки
  kind: client
steps:
- n: 1
  lane: op
  title: Завоз входного поддона
  desc: рохля ставит поддон в ловители поста ВХОД; корпус тележки и человек остаются за линией ограждения,
    внутрь заходят только вилы и поддон
  time: ≈2 мин, снаружи цикла
- n: 2
  lane: cell
  title: Отбор ряда из плотной кладки
  desc: толкатель поста выдвигает верхний ряд за кромку поддона, вилка подхватывает пакет из трёх изделий
    снизу и прижимает его
- n: 3
  lane: cell
  title: Набор ковра на подающей секции
  desc: робот укладывает пакеты рядами встык на секцию перед столом; из рядов собирается ковёр на 90 изделий
  time: 8,1 мин на ковёр
- n: 3
  lane: cell
  title: Накопительное толкание
  desc: планка агрегата порциями по три ряда подвигает собранную часть ковра к столу
  parallel: с укладкой следующих рядов роботом
  time: 14,4 с на толчок
- n: 4
  lane: cell
  title: Доводка до упора и отход агрегата
  desc: последний толчок доводит ковёр до штатного упора стола, агрегат уходит из зоны станка, зрение
    проверяет фронт ковра
  time: ≈30 с
- n: 4
  lane: cl
  title: Пуск цикла станка
  desc: станок получает от ячейки сигнал готовности и запускает свою программу; программы и функции безопасности
    станка не меняются
- n: 5
  lane: cl
  title: Шлифовка верхних граней ковра
  desc: за один установ обрабатываются верхние грани всех 90 изделий ковра, шлифовка мокрая
  time: 12–20 мин, расчётно 16
- n: 5
  lane: cell
  title: Ячейка ждёт и промывает захват
  desc: схема одноярусная, вся перекладка идёт в простое станка; окно цикла используется на промывку захвата
    и смену поддонов
  parallel: со шлифовкой на станке
- n: 6
  lane: cell
  title: Шаговая тяга ковра со стола
  desc: зацеп агрегата заходит за дальний ряд и шагами стягивает обработанный ковёр со стола обратно на
    подающую секцию
  time: 12,2 с
- n: 7
  lane: cell
  title: Укладка на выходной поддон
  desc: робот переносит пакет с секции на поддон поста ВЫХОД, центрирующая рамка поджимает слой с четырёх
    сторон
  parallel: с шагами тяги агрегата
  time: 5,5 мин на ковёр
- n: 7
  lane: op
  title: Вывоз заполненного поддона
  desc: рохля забирает поддон с поста ВЫХОД снаружи ограждения, зона поста разблокируется квитированием
    с поста кнопок
  time: ≈2 мин, снаружи цикла
cycle: шаги 2–7 повторяются на каждом ковре из 90 изделий; поддона хватает на две трети ковра, поэтому
  поддоны меняются полтора раза за цикл, в окне шлифовки
key_figure: 176–187 шт/ч против 159 шт/ч ручной укладкой при цикле шлифовки 16 мин — и ни одного изделия,
  поднятого руками
