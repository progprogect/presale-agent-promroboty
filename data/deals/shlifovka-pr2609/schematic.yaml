# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
title: Ячейка перекладки блоков на мокрой шлифовке
views:
- id: iso
  title: Изометрия
  file: schematic/iso.svg
- id: plan
  title: Планировка
  file: schematic/plan.svg
- id: side
  title: Вид сбоку
  file: schematic/side.svg
positions:
- pos: 1
  name: Промышленный робот 130 кг, в защитном чехле
  note: Вылет 3,1 м закрывает оба поста и рабочую часть секции, линейная ось не нужна. Робот дотягивается
    за линию ограждения, поэтому безопасность держится на блокировке ворот и ограничении зоны в контроллере,
    а не на расстоянии.
- pos: 2
  name: 'Шкаф управления робота: контроллер, карта безопасности PL d, пульт обучения'
  note: 'Шкафы вынесены за ограждение: внутри ячейки они попадали в зону движения руки. В модели два шкафа
    не различаются — назначение принято по составу.'
- pos: 3
  name: Плита робота и анкеровка
- pos: 4
  name: Вилочный захват с прижимом
  note: 'В проработке: узел укладки нижнего слоя на выходной поддон. Пальцы толщиной 40 мм входят в зазоры
    настила станка и секции, но на выходном поддоне такого зазора нет — при укладке нижнего слоя они упираются
    в настил поддона (слои со второго по четвёртый ложатся на предыдущий слой и проблемы не имеют). Способ
    решения выбирается в рабочей КД после замера настила поддона заказчика; на схеме показана текущая
    геометрия без решения.'
  flag: warn
- pos: 5
  name: 'Агрегат «толкай-тяни»: направляющие, рейка, защита, энергоцепь'
  note: Два рельса 3,7 м вдоль стола, ход агрегата 2,95 м. Рейка, кожухи с продувкой и энергоцепь идут
    вдоль рельсов и отдельной геометрии в модели не имеют — привязаны к этой позиции.
- pos: 6
  name: 'Агрегат: привод'
- pos: 7
  name: 'Агрегат: ригель, ноги и каретки, пневматика подъёма, датчики положения'
  note: 'Показано северное ожидание: ригель стоит над пустым столом, пока робот работает на секции; на
    юг он выходит только когда робот у постов (блокировка в ПЛК). В парковке мост станка проходит над
    концом ригеля с зазором 60 мм. Пневматика подъёма и датчики положения размещены на ригеле и ногах.'
- pos: 8
  name: 'Агрегат: пальцы-зацепы и планка'
  note: Планка толкания и пять пальцев-зацепов показаны в поднятом положении (в рабочем они опущены на
    0,25 м).
- pos: 9
  name: Подающая секция 3,6 × 1,0 м
  note: 'Габарит по модели: рама 3,8 × 1,06 м, борта раздвинуты до ±1,9 м (вилка с плитой прижима 1,25
    м задевала борт); в составе указан габарит 3,6 × 1,0 м — уточняется при выпуске рабочей КД. Под настилом
    должно быть пусто: пальцам вилки нужен проход.'
- pos: 10
  name: Толкатель свеса (пост ВХОД)
  note: Толкатель выдвигает ряд верхнего слоя за кромку поддона под вилку (на схеме показан свес 0,19
    м); боковые прижимы удерживают слой с боков.
- pos: 11
  name: Центрирующая рамка (пост ВЫХОД)
  note: 'В проработке: нижний слой на выходном поддоне (см. поз. 4). Рамка опущена до отметки 0,78 м и
    разнесена на 0,2 м от поддона: при верхе 0,86 м вилка задевала её на последнем участке опускания.'
  flag: warn
- pos: 12
  name: 'Посты поддонов — обвязка: ловители и упоры, датчики поддона, посты кнопок'
  note: 'На каждом посту: ловители-уголки по углам поддона и продольный упор, датчик наличия поддона,
    пост кнопок у ворот (запрос доступа, квитирование). Детали мелкие, показаны в масштабе.'
- pos: 13
  name: Ворота с замками-блокировками
  note: Ворота 1,4 м в свету по створу поддона. Рохля заводит поддон вилами внутрь, корпус тележки и оператор
    остаются снаружи (запас 0,825 м от линии ограждения). Показаны закрытыми.
- pos: 14
  name: Ограждение 2,2 м
  note: Высота по модели 2,0 м, в составе 2,2 м. Проёмы 2,06–2,35 м по бокам фронта — под ход ног агрегата
    с приводом, закрываются кожухом вдоль рельса. Со стороны станка проходит подающая секция и стол. В
    изометрии высота условная.
- pos: 15
  name: 'Зрение базовое: камера на стойке, лазерный датчик на ригеле'
  note: Камера контроля секции на стойке 3,0 м; лазерный датчик на ригеле измеряет габариты изделия.
- pos: 16
  name: 'Электрика и управление: шкаф ПЛК, реле безопасности, пневмоподготовка'
  note: Шкаф за ограждением. HMI-колонна, четыре аварийных останова, воздушный нож в модели не размещены
    — см. список ниже.
- pos: 17
  name: Настил станка
  note: Комплект деревянного настила нашего изготовления на столе станка 3,6 × 1,9 м; шаг пальцев вилки
    кратен шагу брусьев.
- pos: 18
  name: Станок мостовой шлифовки (оборудование заказчика, вне поставки)
  note: 'Оборудование заказчика, в поставку не входит. Показан в парковке: мост слева, голова поднята.
    Станок, его программы и собственные функции безопасности не меняются.'
notes:
- 'Показан характерный момент цикла «набор ковра»: вилка с пакетом из трёх изделий над подающей секцией,
  ряды P1 и P2 уложены, ригель агрегата в северном ожидании над пустым столом; на входном поддоне верхний
  ряд выдвинут за кромку, на выходном уложена часть нижнего слоя.'
- 'План: станок сверху, пост ВХОД слева, пост ВЫХОД справа, проезд рохли снизу снаружи ограждения. Круг
  — вылет робота 3,1 м. Размеры ячейки: 5,00 × 4,27 м = 21,3 м² плюс проезд 2,5 м снаружи ограждения.
  Янтарным показаны зоны постов, блокируемые при открытых воротах.'
- 'Позиция схемы может состоять из нескольких объектов (рельсы, ноги ригеля, ворота): подсветка и номер
  общие. Строки состава B7, B9, B12, B14 (направляющие, рейка, защита, энергоцепь) относятся к рельсам,
  B10, B11, B15 (ригель, пневматика, датчики положения) — к ригелю; отдельной геометрии у рейки, кожухов,
  энергоцепи, пневматики и датчиков в модели нет.'
- Светло-оранжевым показано оборудование заказчика (станок, поддоны, проезд, канал) — в поставку не входит.
  Голубым — изделия.
- В изометрии ограждение условной высоты 1,2 м (по модели 2,0 м), рука робота — стилизованная, не поза
  цикла.
off_scheme:
