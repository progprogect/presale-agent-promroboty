# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
roles:
- К
- А
- Э
- М
role_names:
  К: инженер-конструктор
  А: АСУ ТП / ПО / ПНР / управление
  Э: инженер-электронщик
  М: слесарь-сварщик-монтажник
stages:
- name: Шаг 1 · выездная диагностика участка
  tasks:
  - id: Ш1-01
    name: 'Переписка и передача данных: запрос заказчику (паспорт и электросхема станка, документы на
      настил, программы ЧПУ, тип поддона, план участка), запрос в КАМИ после выезда, выгрузка фотоархива
      и обмеров в файлы сделки'
    result: запросы отправлены, данные в 01_research/02_spec
    basis:
      type: expert
      ref: экспертно 3 / 4 / 6 → 4,2 (укрупнение v5.1, −2 ч к сумме прежних)
    hours:
      А: 4
    group: Подготовка в Гродно
  - id: Ш1-02
    name: 'Бланки протоколов: 17 позиций обмеров, хронокарта, таблица трения'
    result: комплект бланков в планшете
    basis:
      type: analog
      ref: 'аналог: v4 1.2 (ПМИ и бланки стенда, 16 К)'
    hours:
      К: 2
    group: Подготовка в Гродно
  - id: Ш1-03
    name: Эскиз и изготовление оснастки трения (салазки-навеска, скоба под динамометр)
    result: оснастка изготовлена и уложена в ящик
    basis:
      type: analog
      ref: 'аналог: etap0 27.2 (6 К + 12 М на две оснастки)'
    hours:
      К: 2
      М: 6
    group: Подготовка в Гродно
  - id: Ш1-04
    name: Эскиз и изготовление оснастки выдвижения и подхвата (полоса-вилка, брус-упор)
    result: оснастка изготовлена
    basis:
      type: analog
      ref: 'аналог: etap0 27.2'
    hours:
      К: 2
      М: 6
    group: Подготовка в Гродно
  - id: Ш1-05
    name: Тарировка динамометра и крановых весов, комплектация выездного ящика по описи
    result: тарировочная запись, укомплектованный ящик
    basis:
      type: analog
      ref: 'аналог: etap0 27.2'
    hours:
      А: 4
    group: Подготовка в Гродно
  - id: Ш1-06
    name: Переезд Гродно → Минск и обратно с ночёвкой
    result: инженер на площадке в назначенное время
    basis:
      type: norm
      ref: 'норматив: 280 км × 2, etap0 27 (дорога 8 ч)'
    hours:
      А: 8
    group: Выезд
  - id: Ш1-07
    name: 'Программа замеров на площадке: 17 обмеров геометрии, опознание материала настила (Шор D), трение
      3×3, выдвижение за свес и подхват вилкой (плиты 24 и 41 мм), хронометраж цикла, условия среды и
      шильдик, фотонабор 60–80 кадров и схема кладки'
    result: 'комплект протоколов выезда: обмеры, μ, усилия, хронокарта, условия, фотоархив'
    basis:
      type: analog
      ref: 'аналог: etap0 разд. 7, 26, 8, 27.1 (сумма прежних Ш1-07…Ш1-13, без изменения)'
    hours:
      А: 7
    group: Выезд
  - id: Ш1-08
    name: 'Обработка замеров: расчёт μ, усилий толкания и тяги по факту'
    result: расчётная записка с числами
    basis:
      type: analog
      ref: 'аналог: etap0 27.2 (10 К + 12 А на обработку и отчёт)'
    hours:
      К: 4
      А: 4
    group: Обработка и отчёт
  - id: Ш1-09
    name: Отчёт по обследованию с протоколами и выводами для технического проекта
    result: отчёт передан заказчику, подписан акт
    basis:
      type: analog
      ref: 'аналог: etap0 27.2'
    hours:
      К: 6
      А: 6
    group: Обработка и отчёт
