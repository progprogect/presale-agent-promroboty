title: Ячейка мокрой шлифовки — перекладчик
version: смета v5.1
updated: "2026-10-02"
status: на проверке
note: Роботизированная загрузка-разгрузка мостового ОЦ на участке мокрой шлифовки, компоновка «толкай-тяни».
context: >-
  Участок мокрой шлифовки вибропрессованных бетонных изделий (плиты и пустотные камни, 14 позиций,
  4–18 кг, расчётно до 30 кг). Сегодня оператор вручную укладывает изделия плотным ковром на стол
  мостового станка 2,0×3,6 м и разбирает после шлифовки; цель — убрать тяжёлый труд. Решение:
  стационарный 6-осевой робот 130 кг с вилочно-прижимным захватом + двухосевой агрегат «толкай-тяни»
  собственной разработки, подающая секция, поддоны работают шлюзом (оператор вне ячейки). Среда —
  вода, бетонный шлам, абразив. Компоновка подтверждена симуляцией на 38 позициях номенклатуры.
  Путь: шаг 1 выездная диагностика → шаг 2 технический проект → шаг 3 ячейка под ключ (~40 недель).
