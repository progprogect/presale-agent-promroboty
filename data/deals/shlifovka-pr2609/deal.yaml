slug: shlifovka-pr2609
code: ПР-2609
title: Ячейка мокрой шлифовки — перекладчик
version: пакет проверки · ред. 2 — развилка принципа захвата
updated: '2026-10-12'
status: на проверке
note: Роботизированная загрузка-разгрузка мостового ОЦ на участке мокрой шлифовки, компоновка «толкай-тяни».
context: 'Участок мокрой шлифовки вибропрессованных бетонных изделий (плиты и пустотные камни, 14 позиций,
  4–18 кг, расчётно до 30 кг). Сегодня оператор вручную укладывает изделия плотным ковром на стол мостового
  станка 2,0×3,6 м и разбирает после шлифовки; цель — убрать тяжёлый труд. Решение: стационарный 6-осевой
  робот 130 кг и двухосевой агрегат «толкай-тяни» собственной разработки, подающая секция, поддоны работают
  шлюзом (оператор вне ячейки). Среда — вода, бетонный шлам, абразив. ГЛАВНОЕ В ЭТОЙ РЕДАКЦИИ: принцип
  захвата больше не выбран на бумаге, а определяется натурными испытаниями на площадке (Фаза 0). Целевая
  гипотеза — вакуум губчатой присоской на воздуходувке высокого расхода: если он держит на мокрой пористой
  грани, исчезают сразу три узла — отбор ряда «за свес», укладка нижнего слоя на выходной поддон и привязка
  пальцев к зазорам настила. Резервная ветка — вилочно-прижимной захват, проработанный до КД. Компоновка,
  робот, агрегат и ограждение в обеих ветках одинаковы; развилка касается инструмента, поста ВХОД, зрения
  и узла нижнего слоя. Компоновка подтверждена расчётной моделью: 33 цели из 33 по досягаемости, коллизии
  чисты, такт посчитан; прогон на всей номенклатуре — работа технического проекта. Испытания принципа
  захвата проводятся на образцах изделий — на стендах производителей вакуумного оборудования, параллельно
  на двух-трёх площадках; выезд на участок даёт обмеры, хронометраж фактического цикла, проверки механической
  ветки и отбор образцов. Срок фазы из-за этого 3–6 недель. Путь: Фаза 0 обследование и испытания принципа
  захвата → Фаза 1 технический проект по выбранной ветке → Фаза 2 ячейка под ключ.'
questions:
  questions:
  - Предположения — какое из них вы считаете неверным? Самая дешёвая ошибка ловится здесь.
  - Цена ошибки — где мы её занизили или завысили?
  - Что спросить у заказчика дополнительно, пока письмо ещё не ушло?
  process:
  - Шаги — что происходит не в том месте потока или вообще пропущено?
  - Параллельность — где мы её заявили зря, а где не заметили?
  - Граница поставки — верно ли показано, что делает человек, а что ячейка?
  solution:
  - Развилка принципа захвата — согласны, что её решает натурное испытание, а не расчёт? Чего не хватает
    в программе проверок?
  - Узлы — что лишнее, чего не хватает, что решается проще?
  - Границы применимости — что ещё всплывёт на приёмке и здесь не названо?
  wbs:
  - Полнота — какие работы или зависимости пропущены? Добавьте задачу кнопкой в конце этапа.
  - Часы — где нереалистично? Поправьте кнопками ± и коротко напишите почему.
  - Блоки «Выход / Вход» под этапами — согласны с составом результатов и условиями старта?
  bom:
  - Состав — чего не хватает, что лишнее для мокрой абразивной среды?
  - Ветка В (вакуум) — где ошиблись в составе вакуумного комплекта и что знаете по воздуходувкам и губчатым
    присоскам?
  - Где знаете дешевле или надёжнее — особенно ограждение, зрение, направляющие (V-ролики против профильного
    рельса)?
  - Сроки — какие позиции реально ждать дольше заявленного?
notes:
  wbs: Фаза 0 — обследование участка, отбор образцов изделий и испытания принципа захвата на стендах производителей
    вакуумного оборудования; её результат определяет ветку, по которой идёт Фаза 1. Зрение и автораскладка
    оцениваются на нашей стороне. «Аналог etap0 / v4 / reviziya» в основаниях — строки прошлых смет этой
    и соседних сделок, то есть тоже оценки.
  bom: 'Цены — закупка в BYN без наценки; серым — вилка. Группа «Ветка В · вакуум» помечена как вариант:
    её итог показан отдельно и в общую сумму не входит — при выборе этой ветки из состава уходят вилочный
    захват и толкатель свеса, и дельта по закупке получается от −3 100 до +8 500 BYN.'
