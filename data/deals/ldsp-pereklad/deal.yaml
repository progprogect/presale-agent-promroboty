slug: ldsp-pereklad
code: ЛДСП-ПЕРЕКЛАД
title: Роботизированный комплекс перекладки деталей ЛДСП с паллеты на паллету
version: концепция v1
updated: '2026-10-08'
status: черновик
note: Комплекс разбирает входную паллету с деталями ЛДСП послойно по фотографии, читает коды маркировки
  и укладывает детали на выходную паллету с оптимизацией плотности.
context: 'Детали от 150×60 до 2800×1200 мм, масса от 0,15 до 42 кг, толщина 10, 16 и 18 мм, цвет от белого
  до чёрного глянца. Распознавание послойное, съёмкой; на деталях этикетки QR и AZTEC. Площадка 10,7 ×
  11,2 м с колоннами. По заданию оборудование и комплектующие закупает заказчик, а проект, спецификация
  и шефмонтаж — на нас. ГЛАВНОЕ, ЧТО НАДО ПРОВЕРИТЬ ПЕРВЫМ. Задание требует робота грузоподъёмностью не
  менее 100 кг с вылетом не менее 3100 мм. Расчёт показывает, что такой робот задачу не выполняет: предельная
  деталь 2800×1200 мм массой 42 кг вместе с вакуумной траверсой даёт на фланце 118–130 кг и момент инерции
  относительно вертикальной оси кисти 73–94 кг·м², тогда как паспортная допустимая инерция по шестой оси
  у роботов этого класса — 40 кг·м². Превышение в 1,8–2,4 раза. Поэтому предлагается класс 180–250 кг
  с допустимой инерцией кисти не ниже 150 кг·м². Расчёт приведён в концепции целиком, чтобы его можно
  было перепроверить, — и это первое, что мы просим проверить. Проработаны три варианта: стационарный
  робот с тремя паллетными постами и буфером (рекомендуемый), портальное исполнение и робот на линейной
  оси.'
questions:
  questions:
  - Предположения — какое из них вы считаете неверным? Жёлтые строки проверяйте первыми.
  - Такт в задании не задан вообще. Принято 250 деталей в час на смешанной номенклатуре — правдоподобна
    ли такая цифра для участка такого типа?
  - Распределение номенклатуры по габаритам принято гипотезой (15 % крупных, 60 % средних, 25 % мелких).
    Насколько это похоже на реальную мебельную программу?
  - Цена ошибки — где мы занизили риск, а где перестраховались?
  process:
  - Последовательность — что идёт не в том месте потока, где происходит на самом деле.
  - Параллельность — что мы считаем одновременным зря, а что можно совместить.
  - Граница поставки — верно ли показано, что делает оборудование заказчика и что человек.
  solution:
  - ГЛАВНОЕ — расчёт класса робота. Сходится ли момент инерции и согласны ли вы, что робот из задания
    задачу не выполняет? Если наша оценка массы траверсы завышена, скажите прямо.
  - Узлы — что лишнее, чего не хватает, что решается проще.
  - Вакуумная траверса с восемью зонами и контролем веса — рабочая ли схема для плиты 16–18 мм?
  - Распознавание чёрного глянцевого ЛДСП — закрывает ли предложенная схема подсветки проблему?
  - Отклонённые варианты — какой отбросили зря и почему. Особенно портал.
  - Границы применимости — что ещё всплывёт на приёмке и здесь не названо.
  wbs:
  - Полнота — какие работы, этапы или зависимости пропущены?
  - Часы — где оценка нереалистична (мало или много)? Поправьте кнопками и коротко напишите почему.
  - Зрение и прикладное ПО — самая тяжёлая часть проекта по часам. Хватит ли заложенного, чтобы довести
    распознавание тёмных декоров до приёмки?
  - Риски — что может сорвать сроки или объём и не отражено в пакетах?
  bom:
  - Состав — чего не хватает, что лишнее?
  - Робот — согласны ли с классом и с предложенными моделями? Какой канал поставки надёжнее?
  - Камеры и подсветка сканирующего моста — достаточно ли каналов для детали 2800 мм и кода 30 мм?
  - Цена и срок — где дешевле или быстрее? Впишите в правую колонку.
  - Риски — поставки, совместимость, ресурс.
notes:
  questions: 'Жёлтое — принятые нами предположения с основанием; красное — вопросы заказчику. Контакта
    у заказчика пока нет, вопросы ему не задавались: работа ведётся на предположениях, и каждое из них
    дойдёт до предложения оговоркой или границей применимости.'
  process: Времена — на одну деталь. Расчётный такт 14,4 секунды, из них 11 % — простой на смену выходной
    паллеты.
  solution: 'Это черновик раздела предложения «Почему именно такая компоновка». Ключевое расхождение с
    заданием — класс робота: он выбран расчётом момента инерции, а не по записанной в задании цифре, и
    это расхождение вынесено в границы применимости открытым текстом.'
  wbs: 'Резерв применён к итогу, а не к каждой строке. Доля экспертных оценок высока: сопоставимого закрытого
    проекта по разбору паллеты машинным зрением в базе норм времени нет.'
  bom: 'Цены — закупка в BYN без наценки, по большей части оценки до ответов поставщиков. По заданию оборудование
    закупает заказчик: спецификация выдаётся нами, и любая замена позиции согласуется письменно, иначе
    ответственность за достижение показателей с нас снимается.'
