notes:
- 'Показан характерный момент цикла: робот снял с входного поста 1 деталь 2800 × 1200 мм (она поднята
  над стопкой, траверса 2400 мм перекрывает деталь, свес по 200 мм), мост снимает верхний слой над входным
  постом 2, на выходном посту уложена часть груза, на буфере лежит деталь. Паллеты ввозятся и вывозятся
  с юга через три проёма со световыми барьерами.'
- 'Робот на схеме — корректного класса (245 кг, вылет 3094 мм), а не заданного в задании (не менее 100
  кг, вылет не менее 3100 мм): расчёт показал, что робот из задания не проходит по моменту инерции на
  кисти при детали 2800 × 1200 мм. Вылет модели на 6 мм меньше заданного; дальний угол крайнего входного
  поста (крестик на плане) — 3,00 м от оси, запас 0,09 м. Вылет в паспорте номинальный, на высоте нижней
  и верхней детали стопки рабочий вылет меньше — проверяется симуляцией. Центры постов — 2,0–2,28 м от
  оси, буфер — 1,92 м.'
- 'План: круг вылета (синий пунктир) и габарит разворота детали 2800 мм (янтарный штрих-пунктир) — оба
  около 3,1 м от оси; ячейка 6,6 × 6,2 м — описанный около них прямоугольник: ограждение в 3,3 м от оси
  с трёх сторон. Деталь 2800 мм разворачивается в убранном положении руки: центр детали не дальше 1,6
  м от оси плюс полудиагональ детали 1,52 м даёт 3,12 м (расчёт концепта). С севера ограждение в 2,9 м
  от оси, поэтому оба круга выходят за него на 0,2 м, и деталь в этом секторе исключается программным
  ограничением зоны, а не расстоянием.'
- Высота цеха 5,0 м — принятое допущение, фактическая не замерена; на плане участка из задания высот нет.
  Решение работоспособно при высоте не менее 4,0 м; требуемая свободная высота 3,6 м (верх сканирующего
  моста 3,4 м, ограждение 2,2 м, робот около 2,6 м). Высота колонн на схеме принята равной высоте цеха.
- 'Участок: шесть колонн 420 × 420 мм по чертежу задания, свободная полоса между гранями колонн около
  7,4 м (привязка размеров на чертеже допускает отклонение ±0,1 м); ячейка 6,6 × 6,2 м стоит в этой полосе
  с зазором 0,4 м до колонн. Глубина участка в задании не обозначена — пол показан до грани третьего ряда
  колонн. Шкафы и вакуумная станция стоят вне ограждения у северной стены.'
- 'Полупрозрачным показано то, чьё положение в концепте не задано и принято схемой условно: шкаф контроллера
  робота, пульты и пост оператора, стойки моста. Положение двух ворот тоже условное (в концепте заданы
  только число и тип). Позиция схемы может состоять из нескольких объектов (стойки моста, ворота, барьеры,
  пульты, бары подсветки): подсветка и номер общие; строки состава без своей геометрии привязаны к узлу,
  в котором стоят.'
- Светло-оранжевым показано то, что относится к заказчику и в поставку не входит (паллеты, колонны, проезд);
  голубым — изделия (детали ЛДСП). В изометрии ограждение и барьеры условной высоты 1,6 м, рука робота
  стилизована — это не поза цикла.
