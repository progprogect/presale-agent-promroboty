# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
title: Цикл работы комплекса — от подачи входной паллеты до готовой выходной паллеты с паллетным листом
columns:
- n: 1
  label: Подача паллет
- n: 2
  label: Съёмка слоя
- n: 3
  label: Расчёт укладки
- n: 4
  label: Взятие детали
- n: 5
  label: Укладка
- n: 6
  label: Завершение паллеты
lanes:
- id: op
  name: Оператор
  sub: что делает человек
  kind: human
- id: cell
  name: Комплекс перекладки
  sub: наша поставка
  kind: ours
- id: cl
  name: Сторона заказчика
  sub: напольный транспорт и смежные участки
  kind: client
steps:
- n: 1
  lane: cl
  title: Подвоз входных паллет
  desc: погрузчик заводит одну-две входные паллеты с деталями одной толщины и цвета
  time: до 3 мин
- n: 1
  lane: op
  title: Запрос на ввоз и установка паллет
  desc: оператор запрашивает ввоз на пульте полосы, робот отводится и сектор поста переводится в безопасное
    состояние; оператор ставит паллеты по ловителям, кладёт маркер пустой паллеты на подложку выходной,
    задаёт толщину и число входных паллет, выходит и подтверждает
  time: до 3 мин
- n: 1
  lane: cell
  title: Зонный безопасный останов
  desc: робот стоит, пока человек в секторе поста; мьютинг световых барьеров при ручном ввозе неприменим
  parallel: входит в простой такта — 15 % при смене обеих паллет за один заход
- n: 1
  lane: cell
  title: Контроль постов и замер подложки
  desc: датчики подтверждают наличие и базировку паллет, система меряет высоту подложки 3–12 мм
  time: 8 с
- n: 2
  lane: cell
  title: Съёмка верхнего слоя
  desc: сканирующий мост снимает слой в 2–3 кадра двумя каналами — высота и контур
  parallel: идёт над второй входной паллетой, пока робот разбирает первую
  time: 10–16 с на слой
- n: 2
  lane: cell
  title: Распознавание, силуэт стопки и чтение кодов
  desc: выделяются границы деталей, центр, габариты, угол, распознаётся маркер пустой паллеты; запоминается
    силуэт стопки в плане — он нужен правилу соседства; камера на мосту читает QR и AZTEC всего слоя
  parallel: совмещено с разбором предыдущего слоя
  time: 6–10 с на слой
- n: 2
  lane: op
  title: Разбор сомнительных случаев
  desc: при неуверенном распознавании оператор подтверждает деталь на экране
  parallel: по допущению — не чаще 1 детали из 100
- n: 3
  lane: cell
  title: Расчёт схемы укладки
  desc: алгоритм считает места с учётом свесов, центра масс, высоты груза и ориентации к стороне заезда;
    деталь длиннее 1600 мм не разворачивается, её ориентация берётся как есть
  parallel: считается во время движения робота
  time: 0,3 с
- n: 3
  lane: cell
  title: Проверка соседства
  desc: контур детали сверяется с измеренными силуэтами и текущими вершинами соседних постов; не прошедшая
    проверку деталь откладывается
  parallel: шаг постов 1800 мм меньше полного развода 2900 мм, габариты груза соседей перекрываются на
    1000 мм
- n: 4
  lane: cell
  title: Взятие детали
  desc: робот подводит траверсу, включает зоны вакуума по габариту детали, обдувает и присасывает
  time: 4,0 с
- n: 4
  lane: cell
  title: Контроль единичности
  desc: при подъёме вес детали на траверсе сверяется с расчётным по габариту и толщине
  parallel: внутри подъёма, отдельного времени не занимает
- n: 5
  lane: cell
  title: Перенос и укладка
  desc: деталь ложится на рассчитанное место; длиннее 1800 мм разворачивается в убранном положении руки
  time: 8,0 с
- n: 5
  lane: cell
  title: Отложить или вернуть через буфер
  desc: деталь, не подходящая в текущий слой или не прошедшая проверку соседства, уходит на буферное накопительное
    место и возвращается, когда появится место или изменится соотношение высот стопок
  parallel: по оптимизации укладки примерно каждая десятая деталь и по правилу соседства ещё примерно
    каждая десятая, плюс 6 с на такую деталь
- n: 6
  lane: cell
  title: Завершение выходной паллеты
  desc: при высоте груза 1200 мм печатается паллетный лист с составом и номером, загорается сигнал
  time: 15 с
- n: 6
  lane: op
  title: Замена выходной паллеты
  desc: оператор наклеивает лист, запрашивает ввоз на пульте, вывозит готовую паллету, ставит пустую с
    подложкой и маркером пустой паллеты и тем же заходом меняет отработанную входную паллету, затем подтверждает
    выход
  time: до 4 мин
- n: 6
  lane: cl
  title: Увоз готовой паллеты
  desc: напольный транспорт заказчика забирает паллету на склад или упаковку
cycle: шаги 2–5 повторяются на каждом слое и каждой детали; шаг 6 — примерно каждые 25–30 минут (около
  110 деталей на выходную паллету); входную паллету оператор меняет тем же заходом, иначе простой удваивается
key_figure: расчётный такт «15,6 с на деталь» — 231 деталь в час; это та же цифра, что в листе решения
  и в расчёте окупаемости (редакция 1 давала 14,4 с и 250 деталей в час)
