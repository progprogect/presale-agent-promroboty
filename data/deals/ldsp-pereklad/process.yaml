# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
title: Цикл работы комплекса — от подачи входной паллеты до готовой выходной паллеты с паллетным листом
columns:
- n: 1
  label: Подача паллет
- n: 2
  label: Съёмка слоя
- n: 3
  label: Расчёт укладки
- n: 4
  label: Взятие детали
- n: 5
  label: Укладка
- n: 6
  label: Завершение паллеты
lanes:
- id: op
  name: Оператор
  sub: что делает человек
  kind: human
- id: cell
  name: Комплекс перекладки
  sub: наша поставка
  kind: ours
- id: cl
  name: Сторона заказчика
  sub: напольный транспорт и смежные участки
  kind: client
steps:
- n: 1
  lane: cl
  title: Подвоз входных паллет
  desc: погрузчик заводит одну-две входные паллеты с деталями одной толщины и цвета
  time: до 3 мин
- n: 1
  lane: op
  title: Установка паллет и пуск
  desc: оператор ставит паллеты по ловителям, задаёт толщину и число входных паллет, подтверждает готовность
  time: до 3 мин
- n: 1
  lane: cell
  title: Контроль постов и замер подложки
  desc: датчики подтверждают наличие и базировку паллет, система меряет высоту подложки 3–12 мм
  time: 8 с
- n: 2
  lane: cell
  title: Съёмка верхнего слоя
  desc: сканирующий мост снимает слой в 2–3 кадра двумя каналами — высота и контур
  parallel: идёт над второй входной паллетой, пока робот разбирает первую
  time: 10–16 с на слой
- n: 2
  lane: cell
  title: Распознавание и чтение кодов
  desc: выделяются границы деталей, центр, габариты, угол; камера на мосту читает QR и AZTEC всего слоя
  parallel: совмещено с разбором предыдущего слоя
  time: 6–10 с на слой
- n: 2
  lane: op
  title: Разбор сомнительных случаев
  desc: при неуверенном распознавании оператор подтверждает деталь на экране
  parallel: по допущению — не чаще 1 детали из 100
- n: 3
  lane: cell
  title: Расчёт схемы укладки
  desc: алгоритм считает места с учётом свесов, центра масс, высоты груза и ориентации к стороне заезда
  parallel: считается во время движения робота
  time: 0,3 с
- n: 4
  lane: cell
  title: Взятие детали
  desc: робот подводит траверсу, включает зоны вакуума по габариту детали, обдувает и присасывает
  time: 4,0 с
- n: 4
  lane: cell
  title: Контроль единичности
  desc: при подъёме вес детали на траверсе сверяется с расчётным по габариту и толщине
  parallel: внутри подъёма, отдельного времени не занимает
- n: 5
  lane: cell
  title: Перенос и укладка
  desc: деталь ложится на рассчитанное место; длиннее 1800 мм разворачивается в убранном положении руки
  time: 8,0 с
- n: 5
  lane: cell
  title: Отложить или вернуть через буфер
  desc: неподходящая в текущий слой деталь уходит на буфер и возвращается позже
  parallel: примерно каждая десятая деталь, плюс 6 с на такую деталь
- n: 6
  lane: cell
  title: Завершение выходной паллеты
  desc: при высоте груза 1200 мм печатается паллетный лист с составом и номером, загорается сигнал
  time: 15 с
- n: 6
  lane: op
  title: Замена выходной паллеты
  desc: оператор наклеивает лист, вывозит готовую паллету, ставит пустую и подтверждает на пульте
  time: до 3 мин
- n: 6
  lane: cl
  title: Увоз готовой паллеты
  desc: напольный транспорт заказчика забирает паллету на склад или упаковку
cycle: шаги 2–5 повторяются на каждом слое и каждой детали; шаг 6 — примерно каждые 25–30 минут (около
  110 деталей на выходную паллету)
key_figure: расчётный такт «14,4 с на деталь» — 250 деталей в час; это та же цифра, что в листе решения
  и в расчёте окупаемости
