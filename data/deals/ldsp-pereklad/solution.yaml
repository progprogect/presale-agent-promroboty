# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
deal: перекладка деталей ЛДСП с паллеты на паллету
variant: В1 — стационарный робот корректного класса, три паллетных поста и буфер
stage: concept
author: layout
updated: '2026-10-08'
revision: 2
summary: 'Один робот стоит в центре, вокруг него веером три паллетных поста и буферный стол: всё, что
  роботу нужно, лежит в радиусе 2,2 м, и из цикла он не выходит. Оператор подвозит паллеты напольным транспортом
  с одной стороны через три проёма со световыми барьерами. Над входными паллетами висит сканирующий мост:
  он снимает верхний слой двумя каналами, выделяет границы деталей, центры, габариты и углы, а отдельная
  камера читает коды найденных этикеток; на тёмных и глянцевых декорах кадр повторяется с другой подсветкой.
  Алгоритм строит очередь из распознанного слоя и считает места на выходной паллете по правилам задания:
  центр масс в габарите паллеты, свес до 300 мм вдоль заезда и до 1000 мм поперёк, со стороны заезда свеса
  нет, высота груза до 1200 мм, в слое детали одной толщины. Робот берёт деталь нужными зонами вакуума
  с обдувом зоны контакта, при подъёме сверяет вес с расчётным — это и есть контроль того, что взята одна
  деталь, а не две слипшиеся, — переносит и укладывает. Перед опусканием проверяется правило соседства:
  контур детали против измеренных силуэтов и текущих вершин соседних постов. Деталь до 1600 мм при необходимости
  разворачивается в убранном положении руки, деталь длиннее не разворачивается вовсе. Деталь, не подходящая
  в текущий слой или не прошедшая проверку соседства, уходит на буфер и возвращается, когда появится место
  или изменится соотношение высот. При достижении 1200 мм комплекс печатает паллетный лист с фактическим
  составом и зовёт оператора, а разбор второй входной паллеты в это время уже идёт. На время ввоза паллеты
  робот останавливается зонным безопасным остановом: паллету ввозит человек, и мьютинг световых барьеров
  здесь неприменим.'
nodes:
- name: Робот с рабочим вылетом не менее 3383 мм на высотах захвата, на постаменте 600 мм
  what: берёт деталь с входной паллеты и укладывает на выходную по рассчитанной схеме
  why: 'Класс выбран двумя расчётами, а не по заданию. Первый — момент инерции: предельная деталь 2800×1200×18
    мм массой 42 кг вместе с траверсой даёт на фланце 118–130 кг и момент инерции относительно вертикальной
    оси кисти 73–94 кг·м², тогда как у роботов класса «не менее 100 кг, вылет не менее 3100 мм» из задания
    паспортная допустимая инерция по оси 6 составляет 40 кг·м². Превышение в 1,8–2,4 раза, нужна допустимая
    инерция не ниже 150 кг·м². Второй — рабочая зона: паспортный вылет действует на одной конкретной высоте
    кисти, а наши высоты захвата идут полосой 1190 мм, от верха нижней детали 155 мм до верха полной стопки
    1345 мм. У машины с паспортными 3094 мм рабочий вылет на верху полной стопки падает до 2802 мм. Постамент
    600 мм смещает полосу высот в середину рабочей зоны и возвращает 223 мм, но дальний угол крайнего
    поста лежит в 3183 мм, и с запасом 200 мм требуется рабочий вылет 3383 мм, то есть паспортный около
    3450 мм — класс 350–400 кг.'
- name: Вакуумная траверса собственной разработки с восемью зонами
  what: удерживает деталь нужным числом зон под её габарит, контролирует вес и обдувает зону контакта
  why: 'Восемь переключаемых зон позволяют одной траверсой брать и деталь 150×60, и деталь 2800×1200,
    не включая лишние присоски: открытая присоска подсасывает воздух и роняет разрежение. Тензодатчик
    даёт контроль единичности взятия — ультразвуковой контроль двойного листа здесь неприменим, он нормирован
    на плёнку до 0,4 мм и плиту 16–18 мм не просветит. Обдув зоны контакта нужен из-за пыли на поверхности
    ЛДСП.'
- name: Сканирующий мост с 2.5D-сенсором, обзорной камерой и камерой чтения кодов
  what: снимает верхний слой входной паллеты, выделяет детали и читает QR и AZTEC
  why: 'Требования задания к одной камере внутренне противоречивы: охват 2900×1600 мм при рабочем расстоянии
    100–1300 мм — это угол около 96°, серийные камеры столько не дают, а код 30×30 мм обзорной камерой
    физически нечитаем, для него нужно порядка 8700 пикселей по ширине поля. Поэтому каналов несколько,
    и код читается отдельной камерой до взятия детали — после взятия этикетка закрыта траверсой.'
- name: Переключаемая подсветка моста
  what: повторяет кадр с другой схемой освещения на тёмных и глянцевых декорах
  why: 'Чёрный глянцевый ЛДСП — документированная слабость 2.5D-съёмки: поверхность почти не возвращает
    структурированный свет. Отраслевой обход существует и подтверждён, поэтому резервная схема подсветки
    закладывается сразу, а не добавляется на пусконаладке.'
- name: Три паллетных поста и буферный стол
  what: две входные паллеты, одна выходная, буфер под деталь, не подошедшую в текущий слой
  why: 'Буфер снимает тупик, когда распознанная деталь не ложится в текущий слой: без него робот либо
    ломает схему укладки, либо встаёт. Третий пост позволяет менять выходную паллету, не останавливая
    разбор входной.'
- name: Контроль веса при подъёме
  what: сверяет фактический вес с расчётным по распознанной детали
  why: Это единственный доступный способ поймать взятие двух слипшихся деталей на плите 16–18 мм. Для
    лёгких деталей дополняется контролем высоты стопы.
- name: Контур безопасности с световыми барьерами на трёх проёмах
  what: закрывает зону робота, проёмы подачи паллет перекрыты барьерами
  why: Паллеты подаются напольным транспортом вручную, то есть человек регулярно подходит к границе зоны.
    Барьеры вместо дверей — чтобы не останавливать цикл на каждой смене паллеты.
- name: Постамент робота 600 мм
  what: поднимает базу робота, чтобы полоса высот захвата легла в середину рабочей зоны
  why: 'Полоса высот захвата 155–1345 мм шире, чем узкая зона максимального вылета. Без постамента центр
    кисти ходит от 855 до 2045 мм над плоскостью крепления, и рабочий вылет на верхней детали полной паллеты
    падает на 292 мм против паспортного. Постамент 600 мм возвращает 223 мм рабочего вылета без замены
    машины и одновременно решает обратную задачу — дотянуться до нижней детали, которая лежит практически
    на полу. Приём стандартный: серийные постаменты роботов выпускаются ростом 585–1890 мм.'
- name: Маркер пустой паллеты
  what: пластина с контрастным полем на подложке, по которой система отличает пустую паллету
  why: 'Прямое требование задания (п. 6.1 и этап 2 п. 4.3). Геометрией пустую паллету от паллеты с деталями
    не отличить в принципе: подложка высотой 3–12 мм неотличима от детали толщиной 10 мм. Четыре маркера:
    по два на входной пост, один в работе, один в обороте. Окончательный вид согласуется с заводом — задание
    прямо это предусматривает.'
- name: Правило соседства при опускании
  what: перед опусканием контур детали проверяется против измеренных силуэтов и текущих вершин соседних
    постов; не прошедшая проверку деталь уходит на буферное накопительное место
  why: 'Шаг паллетных постов 1800 мм меньше полного развода 2900 мм, при котором габариты груза соседних
    постов вообще не пересекаются. Полный развод стационарным роботом недостижим: он требует дальнего
    угла 4022 мм. При шаге 1800 мм габариты груза перекрываются на 1000 мм, и длинномер на соседних постах
    нельзя держать на пересекающихся высотах. Обе величины, нужные для проверки, система уже имеет: силуэт
    стопки даёт съёмка сверху, текущую вершину — счёт слоёв и лазерные датчики высоты. Поэтому буфер сделан
    накопительным местом на несколько деталей, а не столом на одну.'
- name: Зонный безопасный останов на время ввоза паллеты
  what: оператор запрашивает ввоз на пульте полосы, робот отводится, сектор поста переводится в безопасное
    состояние, после ввоза оператор подтверждает выход
  why: 'Мьютинг световых барьеров здесь неприменим: он рассчитан на проход груза без человека, а паллету
    ввозит человек на рохле — груз и человек идут вместе, и мьютинг отключал бы защиту ровно в момент
    входа человека. Проверка расчётом по ISO 13855 даёт требуемое безопасное расстояние 1,0–1,7 м против
    фактических 200 мм от паллеты до ограждения. Плата функциональной безопасности, барьеры и пульты в
    составе уже есть — меняются программа и логика, но вырастает простой: робот стоит на время ввоза.'
- name: Декартова зона безопасности робота
  what: ограничивает ограниченное пространство робота с учётом инструмента и груза
  why: 'Робот геометрически достаёт дальше ограждения: рабочая зона 3,45 м плюс полудиагональ детали 1,52
    м даёт около 5,0 м, а ограждение стоит в 3,7 м. Поэтому границу задаёт штатная функция безопасности
    контроллера с декартовыми зонами и учётом инструмента и груза, а не расстояние. Полотно ограждения
    отстоит от границы зоны не менее чем на 500 мм. Граница выставляется с запасом на тормозной путь робота
    с деталью — паспортных данных по тормозному пути для машин-кандидатов нет, они запрашиваются у производителя.'
- name: Печать паллетного листа
  what: по заполнении паллеты печатает фактический состав с уникальным номером
  why: прямое требование задания; это и есть результат, ради которого ставится зрение
rejected:
- option: Робот из задания — 100–130 кг, вылет 3100 мм
  why: 'Отклонён расчётом, а не предпочтением: допустимая инерция вертикальной оси кисти 40 кг·м² против
    требуемых 73–117 кг·м². Это паспортное ограничение производителя.'
- option: Портальное исполнение (вариант В2)
  why: 'По деньгам равен В1 — дешевле по нижней границе на 29 тыс. и дороже по верхней на 9 тыс., разница
    внутри погрешности оценки. Но портал мы проектируем, а изготавливает подрядчик заказчика, которого
    мы не выбираем, при том что ответственность за результат по заданию остаётся на нас. Гипотеза «портал
    нужен для низкого цеха» расчётом не подтвердилась: серийные мебельные порталы требуют 3,75–3,85 м,
    ячейка с роботом — 3,6 м. Портал объективно сильнее, если постов больше четырёх или нужна сортировка
    по заказам, — тогда рекомендация меняется.'
- option: Робот на линейной оси (вариант В3)
  why: 'Такт хуже (15,5–17,5 с против 14,4 с) и площадь больше (56 м² против 41 м²). Остаётся заделом:
    если позже понадобится сортировка по заказам, ось добавляется к тому же роботу без переделки остального.'
- option: Площадной вакуумный захват на всю длину детали
  why: Масса захвата 116 кг, на фланце 158 кг, инерция 117 кг·м² — выталкивает в следующий класс робота,
    а расход воздуха требует компрессора 30–45 кВт. Остаётся альтернативой в спецификации на случай, если
    опытная проверка покажет, что дискретные присоски не держат покоробленные детали.
- option: Ультразвуковой контроль двойного листа
  why: датчики нормированы на плёнку до 0,4 мм, плиту 16–18 мм не просветят
- option: Эжекторная генерация вакуума на траверсе
  why: не проходит по расходу воздуха
- option: Второй робот
  why: Расчётный такт 14,4 с одним роботом даёт 250 деталей в час, а требуемая производительность в задании
    не задана. Если выяснится, что нужно вдвое больше, это другая компоновка и другая цена, и вопрос возвращается.
- option: Сортировка на выходе станка раскроя вместо разбора паллеты
  why: 'Так задачу решает европейская отрасль — Homag Sortbot, Barbaric Nesting Picker, ячейки Zimmer
    Group снимают деталь со стола или конвейера, где её положение известно, а не разбирают навал на паллете.
    Этот путь надёжнее и дешевле по зрению, но он за пределами задания: заказчик ставит задачу на участке
    после обработки. Называем его прямо как более короткую дорогу к той же цели — на случай, если завод
    готов обсуждать место внедрения, а не только средство.'
- option: Балансирный манипулятор вместо робота
  why: Снимает вес с рук оператора, но человек остаётся в цикле и ведёт каждую деталь руками, а паллетный
    лист и оптимизация укладки не появляются вовсе. Заявленные цели задания закрывает меньше чем наполовину.
proof:
- Класс робота проверен расчётом момента инерции по паспортным ограничениям двух конкретных моделей, расчёт
  приведён в концепте целиком и перепроверяем.
- Такт 14,4 с разложен по операциям и сверен с отраслевыми ориентирами серийных ячеек того же класса.
- Ячейка 7,4 × 5,6 м = 41,4 м² вписывается в свободную полосу между колоннами шириной 7596 мм с зазором
  98 мм на сторону; требуемая свободная высота 3,9 м.
- 'Центры паллетных постов лежат в 1,70–2,48 м от оси робота, буфер — в 2,47 м, но роботу обязательно
  надо доставать до дальних углов постов, а они в 3,18 м. Прежнее утверждение «все четыре адреса в радиусе
  2,2 м» было неверным и снято: адреса задаёт не центр паллеты, а её дальний угол.'
- 'Шаг паллетных постов 1800 мм задан габаритом ГРУЗА, а не паллеты: деталь 2800 мм свешивается с паллеты
  1200 × 800 по 1000 мм в каждую сторону (задание, п. 6.1), и при меньшем шаге свес соседнего поста повисает
  прямо над паллетой.'
- Модель рабочей зоны, по которой выбран класс робота, воспроизводит паспортную таблицу крайних положений
  центра кисти производителя с расхождением 0,9 мм.
- Серийные ячейки того же класса на шарнирном роботе существуют (HOMAG SORTBOT R-300 на деталях 240–2800
  мм), то есть выбор кинематики не наш эксперимент.
limits:
- 'Производительность в задании не задана. Расчётные 231 деталь в час получены на принятой смешанной номенклатуре:
  15 % деталей крупнее 1200×800, 60 % средних, 25 % мелких, средняя деталь 0,6 м² и 7 кг, доля длинномера
  под правилом соседства 10 %. На другой номенклатуре такт другой.'
- Распознавание самых тёмных и глянцевых декоров не гарантируется до опытной съёмки реальных образцов.
  Это документированное ограничение 2.5D-съёмки, а не свойство нашего решения. Опытная съёмка входит в
  объём работ первым этапом.
- Требования задания к камере (охват 2900×1600 мм при рабочем расстоянии 100–1300 мм и разрешении не хуже
  1 мм) одной серийной камерой не выполняются. Поставляется многокамерная схема на сканирующем мосту;
  параметры отдельной камеры будут отличаться от записанных в задании.
- Код 30×30 мм читается отдельной камерой до взятия детали. После взятия этикетка закрыта траверсой. Если
  положение этикетки не будет стандартизовано, доля нечитаемых кодов вырастет.
- Глубина планирования укладки — один распознанный слой плюс буферное место, как задано заданием. Плотность
  укладки при такой глубине ниже теоретически достижимой.
- 'Сортировка деталей по заказам не предусмотрена: один выходной пост. Появление такого требования меняет
  архитектуру.'
- Обмен с учётными системами завода не предусмотрен; паллетный лист печатается и выгружается файлом локально.
- Высота помещения принята 5,0 м, фактическая не замерена. Решение работоспособно при 4,0 м. Пол принят
  бетонным с возможностью анкеровки; фундамент в объём не входит.
- Входные паллеты подаются и выходные вывозятся напольным транспортом заказчика вручную; конвейеров и
  накопителей в объёме нет. Простой на смену выходной паллеты и на ввоз входной учтён в такте, 15 %. Короткие
  рольганги в трёх проёмах (ориентировочно 18–36 тыс. BYN) вернули бы около 8 % производительности и сделали
  бы мьютинг законным, но в базовый состав не заложены.
- Коробление деталей принято до 5 мм на длине 2800 мм, компенсация — пружинные штоки присосок с ходом
  не менее 20 мм. Большее коробление потребует пересчёта схемы захвата.
- Допустимая доля ручных вмешательств оператора принята 1 % деталей. Критическим сбоем приняты падение
  или повреждение детали, ошибка в паллетном листе и остановка дольше 10 минут. Обе цифры — наше предложение,
  а не согласованный документ.
- Закупка комплектующих ведётся строго по выданной нами заказной спецификации. Любая замена позиции —
  робот, камеры, вакуумная техника, вычислитель — согласуется с нами письменно до заказа. При закупке
  вне спецификации ответственность за достижение заявленных показателей с нас снимается. Это условие идёт
  и в предложение, и в договор.
- Опубликованных внедрений «робот разбирает паллету деталей ЛДСП послойно по фотографии» не найдено. Отрасль
  решает сортировку накопителями и съёмом со стола раскроя. Решение технически обосновано, но типовым
  для отрасли не является.
- Класс робота выбран по расчёту момента инерции и по рабочей зоне на высотах захвата и отличается от
  заданного в задании и по грузоподъёмности, и по вылету. Окончательная модель подтверждается диаграммой
  рабочей зоны производителя и прогоном связки «масса — инерция — центр масс» в его инструменте.
- 'Деталь предельного размера 2800 × 1200 мм вариант В1 на этой площадке автоматически не обрабатывает:
  потолок 2600 мм. Задан он не роботом, а шириной свободной полосы между колоннами 7596 мм — шаг паллетных
  постов больше 1800 мм в неё не помещается, а шаг задаёт предельную деталь. Детали 2600–2800 мм либо
  перекладываются вручную, либо требуют портала или робота на линейной оси.'
- 'Деталь длиннее 1600 мм не разворачивается вокруг вертикали внутри ячейки: описанная окружность груза
  выходит за границу ограниченного пространства робота. Принято, что такая деталь лежит поперёк направления
  заезда и на входной паллете тоже. Если на входе ориентация произвольная, часть длинномера комплекс уложить
  не сможет.'
- Правило соседства. Шаг постов 1800 мм меньше полного развода 2900 мм, поэтому габариты груза соседних
  постов перекрываются на 1000 мм. Деталь, заходящая контуром на измеренный силуэт соседнего поста, опускается
  только выше текущей вершины этого соседа; иначе уходит на буфер и возвращается позже. Это влияет и на
  такт, и на плотность укладки.
- 'Ограниченное пространство робота задаётся декартовой зоной безопасности контроллера, а не расстоянием:
  робот геометрически достаёт дальше ограждения. Полотно ограждения отстоит от границы зоны не менее чем
  на 500 мм. Запас на тормозной путь робота с деталью закладывается по данным производителя, а этих данных
  у нас нет — они запрашиваются.'
- 'Мьютинг световых барьеров в проёмах ввоза паллет не применяется: паллету ввозит человек, груз и человек
  идут вместе. Вместо мьютинга — зонный безопасный останов робота в секторе обслуживаемого поста. Робот
  стоит на время ввоза, и это учтено в такте при условии, что оператор меняет входную и выходную паллеты
  за один заход. Это рабочее правило, и оно идёт в инструкцию оператора; при двух отдельных заходах такт
  16,6 с и 217 деталей в час.'
- Цена и канал поставки роботов класса 3,45 м в Беларуси не найдены. До ответов поставщиков бюджет оборудования
  варианта В1 — вилка 491–754 тыс. BYN шириной более 260 тыс.
- Требуемая свободная высота выросла до 3,9 м из-за постамента; решение работоспособно при высоте помещения
  не менее 4,3 м, а не 4,0 м, как считалось раньше.
