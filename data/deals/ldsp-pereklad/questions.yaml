questions:
- id: Q1
  topic: Номенклатура
  q: какова реальная номенклатура и доля каждого типоразмера в программе, а не только крайние габариты
  need: распределение деталей по габаритам и массе (гистограмма за 1–3 месяца реального производства),
    доля деталей крупнее 1200×800 мм, доля деталей мельче 400×200 мм, среднее число деталей в слое входной
    паллеты
  status: assumed
  ask_text: 'Просим выгрузку реальной номенклатуры деталей за 1–3 месяца производства (длина, ширина,
    толщина, количество) либо сводку: какую долю программы составляют детали крупнее 1200×800 мм, какую
    — мельче 400×200 мм, и сколько деталей в среднем лежит в одном слое входной паллеты.'
  basis: 'Типовая раскладка мебельной программы корпусной мебели: крупные боковины и столешницы единичны,
    основная масса — полки, фасады и царги среднего размера; доли взяты как рабочая гипотеза и подлежат
    замене на фактическую выгрузку.'
  impact: класс робота и вылет, конструкция и число вакуумных захватов, такт, реальное число деталей на
    выходной паллете, вся экономика окупаемости. Компоновка «под 2800×1200» и компоновка «под среднюю
    деталь» — это два разных комплекса и две разные цены.
  risk: high
  answer: 'До ответа считаем «смешанную» программу: 15 % деталей крупнее 1200×800 мм (включая единичные
    2800×1200), 60 % средних 400×200…1200×800 мм, 25 % мелких; средняя деталь ~0,6 м², ~7 кг.'
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q2
  topic: Номенклатура · предельная деталь
  q: действительно ли самая тяжёлая деталь одновременно самая габаритная
  need: подтверждение связки 42 кг = 2800×1200×18 мм
  status: assumed
  answer: Принимаем, что максимальная масса 42 кг соответствует именно детали 2800×1200×18 мм, то есть
    захват должен удержать самую тяжёлую деталь на максимальном плече — комбинации «тяжёлая, но компактная»
    в номенклатуре нет.
  basis: 'Расчёт по ТЗ п. 3.4: ЛДСП плотностью 650–750 кг/м³ (типовые плиты Кроноспан) при объёме 2,8
    × 1,2 × 0,018 м даёт 39–45 кг, то есть указанные в ТЗ 42 кг сходятся с максимальным габаритом при
    максимальной толщине с точностью около 1 %.'
  impact: конструкция и масса захвата, выбор класса робота, расчёт моментов и инерции на кисти
  risk: high
- id: Q3
  topic: Номенклатура · геометрия деталей
  q: какова фактическая величина коробления («пропеллер», провисание краёв) у длинных деталей
  need: допустимое отклонение от плоскостности в мм на длине 2800 мм, доля таких деталей
  status: ask
  ask_text: ТЗ отмечает «пропеллеры» и провисание краёв у длинных деталей. Просим назвать предельное отклонение
    от плоскостности, с которым деталь считается годной (мм на длину детали), и как часто такие детали
    встречаются. Это определяет, выдержит ли вакуумный захват присасывание к покоробленной детали без
    дополнительных подпружиненных присосок.
  working_assumption: До ответа считаем отклонение до 5 мм на 2800 мм и закладываем подпружиненные присоски
    с компенсацией хода не менее 20 мм.
  basis: ТЗ п. 3.4 называет явление, но не нормирует его; величина взята по типовому допуску на плоскостность
    ЛДСП и подлежит проверке на образцах.
  impact: конструкция присосок и ход демпферов, надёжность захвата, доля сбоев на приёмке
  risk: mid
- id: Q4
  topic: Номенклатура · этикетка и код
  q: на какой стороне детали находится этикетка и можно ли зафиксировать её положение
  need: сторона детали (лицевая верхняя / нижняя), допустимость стандартизации положения этикетки в один
    угол, гарантия читаемости кода после транспортировки
  status: assumed
  answer: Принимаем, что этикетка всегда наклеена на обращённую вверх сторону детали на входной паллете
    и что в ходе проекта её положение стандартизуется (фиксированный угол детали, ориентация по длинной
    стороне). Если это не так и этикетка может оказаться снизу, в комплекс придётся добавлять кантование
    детали или вторую камеру снизу — это отдельный объём и отдельная цена.
  basis: ТЗ п. 3.6 прямо допускает изменение расположения, размеров и наполнения этикетки в ходе выполнения
    проекта; стандартизация положения кода — обычная практика при вводе автоматического считывания, поскольку
    она дешевле любой аппаратной компенсации хаотичного положения.
  impact: число камер и сканеров, необходимость кантования детали, такт (поиск кода по всей детали против
    чтения в известном месте), достоверность паллетного листа
  risk: high
- id: Q5
  topic: Операция · сохранность детали
  q: что считается повреждением детали и допустим ли контакт присосок с лицевой поверхностью
  need: требования к следам от присосок на декоративном слое, допустимость захвата за лицевую сторону,
    требования к обдуву от пыли
  status: assumed
  answer: Принимаем захват вакуумом за обращённую вверх (в общем случае лицевую) поверхность детали присосками
    из некрасящего материала с обдувом зоны контакта сжатым воздухом перед захватом; следы и отпечатки
    на декоративном слое не допускаются, контроль — визуальный на приёмке.
  basis: ТЗ п. 5.2 задаёт вакуумный тип захвата и п. 6.1 прямо требует обдува деталей от пыли; вакуумное
    взятие ламинированной плиты за пласть — штатная практика отрасли (Schmalz FXP/FMP заявлены производителем
    именно под палетирование плитных деталей), поскольку меламиновая плёнка непориста и держит разрежение.
  impact: материал и тип присосок, система обдува, расход воздуха, критерии приёмки по качеству
  risk: mid
- id: Q6
  topic: Операция · двойной захват
  q: как исключается подъём двух слипшихся деталей сразу
  need: требование к контролю единичности взятой детали
  status: assumed
  answer: Принимаем, что в состав комплекса входит контроль двойного захвата (ультразвуковой датчик двойного
    листа на захвате либо контроль по толщине/массе), иначе при плотной укладке деталей на входной паллете
    возможен подъём двух деталей сразу — с ошибкой паллетного листа и риском падения детали.
  basis: ТЗ п. 6.1 прямо допускает, что детали в слое «могут лежать плотно без зазоров ввиду транспортировки»;
    контроль двойного листа — серийное отраслевое решение для плитных материалов (microsonic dbk+4, wenglor
    Doppellagenerkennung, Pepperl+Fuchs).
  impact: состав датчиков, достоверность паллетного листа, число сбоев на приёмочном прогоне
  risk: mid
- id: Q7
  topic: Производительность
  q: сколько деталей в час должен перекладывать комплекс
  need: требуемый такт (средний и пиковый), деталей в час или паллет в смену, которые должен обеспечить
    РТК
  status: assumed
  ask_text: 'В ТЗ не задана производительность комплекса. Просим назвать её в любом удобном виде: сколько
    деталей в час (или сколько выходных паллет в смену) должен формировать РТК, и есть ли пиковые значения
    выше среднего. Это ключевая цифра: от неё зависит, хватает ли одного робота или потребуется второй
    пост, и она определяет и состав комплекса, и цену.'
  basis: 'Такт разложен по операциям: подвод к детали 1,5 с + опускание и захват 1,5 с + подъём 1,0 с
    + перенос 2,5–4,0 с + укладка с позиционированием 2,0 с + возврат 2,5–3,5 с + чтение кода 1,5–2,5
    с + доля съёмки слоя, итого 13–17 с. Проверено по отраслевым ориентирам: Barbaric Nesting Picker NST
    — до 10 деталей/мин, роботизированные сортировочные ячейки Zimmer Group — 2,0–25,0 деталей/мин, но
    оба такта относятся к съёму детали с известной позиции на столе, а не к разбору паллеты со съёмкой
    каждого слоя, поэтому берём нижнюю часть диапазона.'
  impact: число роботов и постов, необходимость второй камеры и второй входной паллеты, ёмкость буфера,
    класс робота по скорости, срок окупаемости и вся экономика ТКП
  risk: high
  answer: До ответа считаем от среднего такта 15 секунд на деталь одним роботом — это около 240 деталей
    в час и ориентировочно 1–1,5 выходных паллеты в час на смешанной номенклатуре.
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q8
  topic: Производительность · режим работы
  q: в каком режиме работает участок
  need: число смен в сутки, рабочих дней в году, сезонность, допустимое время на переналадку между паллетами
  status: assumed
  answer: Принимаем две смены по 8 часов, 250 рабочих дней в году, без ночной смены; время на смену входной
    и выходной паллеты оператором — до 3 минут, в такт не входит.
  basis: Типовой режим мебельного производства корпусной мебели в РБ; принято как база расчёта окупаемости
    и подлежит подтверждению заказчиком — цифра влияет на срок окупаемости, но не на состав комплекса.
  impact: расчёт окупаемости в ТКП, требования к ресурсу узлов, регламент обслуживания
  risk: mid
- id: Q9
  topic: Производительность · ручные вмешательства
  q: какая доля ручных вмешательств оператора допустима
  need: допустимый процент деталей, по которым система просит помощь оператора (нераспознанные границы,
    нечитаемый код), и как это учитывается в производительности
  status: ask
  ask_text: ТЗ допускает участие оператора в сложных случаях распознавания. Просим назвать, какая доля
    таких вмешательств считается приемлемой в штатной работе (например, не более 1 детали из 100), и засчитывается
    ли деталь, уложенная с помощью оператора, как успешная.
  working_assumption: до ответа считаем допустимой долей вмешательств 1 % деталей
  basis: ТЗ п. 6.1 называет участие оператора допустимым, но не нормирует его частоту; без нормы приёмка
    превращается в спор о том, что считать сбоем.
  impact: требования к алгоритму зрения, фактическая производительность, численность персонала, критерии
    приёмки
  risk: mid
- id: Q10
  topic: Граница поставки · ответственность
  q: кто отвечает за работоспособность комплекса, если оборудование и комплектующие закупает заказчик
  need: порядок согласования заказной спецификации, право вето поставщика на замену позиций, разграничение
    ответственности за результат при отступлении от спецификации
  status: assumed
  ask_text: 'По ТЗ изготовление оборудования и закупка комплектующих выполняются заказчиком, а за работоспособность
    комплекса и участие в приёмке отвечает поставщик. Просим зафиксировать порядок работы с заказной спецификацией:
    закупка выполняется строго по выданной нами спецификации, любая замена позиции (робот, камера, вакуумная
    техника, вычислитель) согласуется с нами письменно до заказа, а при закупке вне спецификации ответственность
    за достижение заявленных показателей с нас снимается. Также просим подтвердить, кто изготавливает
    нестандартную механику (рамы, захват, посты паллет) и по чьим чертежам.'
  basis: 'Конструкция «железо покупает заказчик — за результат отвечает поставщик» без такого разграничения
    коммерчески опасна: любая замена позиции на более дешёвый аналог переносит на нас чужой выбор, а на
    приёмке спор о причине несоответствия неразрешим.'
  impact: структура договора и объём нашей ответственности, состав и детальность заказной спецификации,
    риск недостижения такта на чужих комплектующих, цена и резерв в смете
  risk: high
  answer: До ответа исходим из того, что закупка идёт строго по нашей спецификации с письменным согласованием
    любых замен, а наша ответственность ограничена проектом, ПНР и достижением показателей на оборудовании
    из спецификации.
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q11
