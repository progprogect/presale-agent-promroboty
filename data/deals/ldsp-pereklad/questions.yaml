  risk: mid
- id: Q32
  topic: Эксплуатация
  q: кто работает на комплексе и кто его обслуживает
  need: квалификация оператора, наличие на заводе службы КИПиА и программиста, объём обучения, нужен ли
    сервис в городе заказчика
  status: assumed
  answer: Принимаем одного оператора на комплекс без специальной робототехнической подготовки (работа
    только через панель оператора на русском языке) и обслуживание силами заводской службы главного механика;
    в объём входит инструктаж операторов и передача документации и резервных копий программ.
  basis: ТЗ п. 2 относит инструктаж персонала и передачу документации с резервными копиями к зоне поставщика,
