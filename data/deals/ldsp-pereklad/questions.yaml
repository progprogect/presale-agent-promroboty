- id: Q28
  topic: Зрение · охват и разрешение
  why: 'Требование задания — охват 2900 × 1600 мм с разрешением 1 мм — одной серийной камерой не закрывается:
    самый крупнопольный серийный сканер даёт 1954 × 1459 мм.'
  q: чем закрывается требуемая зона съёмки 2900 × 1600 мм с разрешением не хуже 1 мм
  need: сколько камер и как они размещаются, одна камера на входную паллету или сканирование с фланца
    робота
  status: assumed
  answer: 'Принимаем, что одной камерой требование ТЗ не закрывается, и закладываем по отдельной камере
    на каждую входную паллету (либо съёмку в два кадра со сшивкой) — ТЗ это прямо допускает. Параметры
    камеры в ТЗ требуют уточнения на этапе проектирования: охват 2900 × 1600 мм при рабочем расстоянии
    100–1300 мм соответствует углу обзора около 96°, чего серийные 2.5D-камеры не дают.'
  basis: Самый крупнопольный серийный структурированный сканер Photoneo PhoXi XL даёт зону съёмки около
    1954 × 1459 мм на дистанции 2326 мм при диапазоне 1680–3780 мм, то есть требуемый охват 2900 × 1600
    мм одним кадром серийного оборудования не покрывается.
  impact: 'требуемую зону съёмки не закроем: придётся добавлять камеры или кадры, а это стоимость зрения
    и время в такте'
  risk: mid
  options:
  - label: по отдельной камере на каждую входную паллету
    note: съёмка слоя быстрее и калибровка проще, но камер больше — это заметная статья в стоимости зрения
  - label: одна камера со съёмкой в два кадра и сшивкой
    note: дешевле по железу, но добавляет время в такт и усложняет калибровку; задание такую схему прямо
      допускает
- id: Q29
  topic: Зрение · чтение QR и AZTEC
  why: Обзорная камера код 30 × 30 мм физически не прочитает — по расчёту на пиксель нужно поле вчетверо
    мельче, — поэтому нужен отдельный канал чтения.
  q: как читаются коды размером 30 × 30 мм
  need: отдельный сканер или камера чтения кода, место чтения в цикле, влияние на такт
  status: assumed
  answer: 'Принимаем отдельный канал чтения кода: обзорная камера находит деталь, а код читает отдельная
    камера — на фланце робота или на стационарном посту, мимо которого робот проносит деталь. Обзорной
    камерой код прочитать невозможно, и это закладывается в такт отдельной операцией 1,5–2,5 с на деталь.'
  basis: 'Расчёт: для надёжного декодирования QR нужно не менее 3 пикселей на модуль (MDPI Sensors 22(19):7230,
    техническая записка Omron VHV5); код 30 × 30 мм — это модуль около 1 мм, значит нужно не хуже 0,33
    мм на пиксель, то есть около 8700 пикселей по ширине поля 2900 мм — такой камеры в серийном производстве
    нет. ТЗ п. 5.1 прямо допускает разные камеры для QR-кода и для распознавания деталей.'
  impact: код не прочитается — паллетный лист теряет смысл; добавление поста чтения меняет такт и компоновку
  risk: mid
  options:
  - label: камера чтения кода на фланце робота
    note: отдельный пост не нужен, но растёт масса на кисти — а по инерции кисти у нас и так самое узкое
      место
  - label: стационарный пост чтения, мимо которого робот проносит деталь
    note: кисть не нагружается, зато 1,5–2,5 секунды на деталь в такте и ещё одно место в компоновке
- id: Q30
  topic: Оборудование · класс робота и захват
  why: 'Робот из задания — «не менее 100 кг, вылет 3100 мм» — задачу не выполняет по моменту инерции кисти:
    превышение в 1,8–2,4 раза. Это расчёт по паспортам производителей, а не мнение.'
  q: достаточно ли робота грузоподъёмностью 100 кг с вылетом 3100 мм, как задано в ТЗ
  need: проверка по трём независимым критериям — масса нагрузки, момент на кисти, момент инерции на кисти
  status: assumed
  answer: 'Принимаем, что заданного ТЗ робота «не менее 100 кг, вылет не менее 3100 мм» для детали 2800
    × 1200 мм недостаточно, и закладываем робот класса 350–400 кг с паспортным вылетом не менее 3450 мм
    (редакция 08.10.2026 по пересчёту компоновки: прежняя оценка 210–280 кг исходила из вылета 3100 мм,
    которого не хватает). Расчёт: траверса, перекрывающая деталь 2800 × 1200 мм, весит около 80–95 кг,
    с деталью 42 кг нагрузка на фланце 122–137 кг — уже выше 125 кг; момент инерции относительно вертикальной
    оси кисти составляет около 80 кг·м² против допустимых 40 кг·м² у робота класса 125 кг, то есть превышение
    двукратное. Альтернатива, которую проверим на стадии компоновки, — укороченная траверса около 2000
    мм с разнесёнными присосками и облегчённой рамой либо портальное исполнение вместо шарнирного робота.'
  basis: 'Масса траверсы оценена по даташиту Schmalz: рейка FXP шириной 130 мм и длиной 1234 мм весит
    около 6,1 кг, в пересчёте на 2800 мм это около 13,8 кг на рейку, четыре рейки дают около 55 кг, плюс
    рама, вакуумгенерация, зонные клапаны и демпферы 25–40 кг. Момент инерции посчитан как J = m·L²/12
    для траверсы и детали. Допуски взяты из даташита Fanuc R-2000iC/125L (125 кг, вылет 3100 мм — ровно
    класс из ТЗ): допустимая инерция J4/J5 72 кг·м², J6 40 кг·м², допустимый момент J4/J5 710 Н·м, J6
    355 Н·м. Требуемый вылет выведен не из задания, а из компоновки: 03_concept/calc/calc3.out.txt даёт
    для детали 2800 мм паспортный вылет около 3704 мм (FANUC M-900iB/400L), для 2600 мм на этой площадке
    — около 3450 мм; машина класса 245 кг с вылетом 3094 мм закрывает деталь только до 1480 мм.'
  impact: 'робот не потянет деталь на вылете: контроллер срежет ускорения и посчитанный такт не состоится,
    а смена класса робота это сотни тысяч BYN'
  risk: high
  options:
  - label: робот класса 350–400 кг с паспортным вылетом около 3450 мм
    note: после пересчёта геометрии это минимум, закрывающий деталь 2600 мм на этой площадке; железо дорожает
      до 320–500 тыс. BYN
  - label: портальное исполнение вместо шарнирного робота
    note: по железу дешевле примерно на 250 тыс. BYN и закрывает всю деталь 2800 мм, но несущую машину
      проектируем мы, а изготавливает подрядчик заказчика
  - label: вернуться к роботу класса 245 кг за 126–146 тыс. BYN
    note: самый дешёвый сценарий, но он действует только при подтверждённом потолке детали около 1480
      мм — то есть зависит от ответа по номенклатуре
- id: Q31
  topic: Оборудование · универсальность захвата
  why: Один захват должен брать и деталь 150 × 60 мм, и деталь на 2,8 метра; модульный захват с зонной
    коммутацией вакуума прямо требует задание, и отрасль делает именно так.
  q: одним захватом брать и деталь 150 × 60 мм, и деталь 2800 × 1200 мм
  need: модульность и зонирование вакуума, нужна ли автоматическая смена захвата, минимальный зазор между
    деталями на входной паллете
  status: assumed
  answer: 'Принимаем единый модульный захват с зонной коммутацией вакуума: крупная деталь берётся всеми
    зонами, мелкая — одной малой секцией с присосками уменьшенного диаметра; автоматическая смена захвата
    не закладывается. Сквозные отверстия до 20 мм и глухие до 35 мм парируются зонированием и самозапирающимися
    присосками.'
  basis: ТЗ п. 5.2 прямо требует модульную систему захвата под весь диапазон размеров; производитель площадных
    захватов Schmalz (серии FXP/FMP) заявляет взятие заготовки независимо от геометрии и вырезов, что
    соответствует требованию по отверстиям в деталях.
  impact: 'мелкую деталь нечем будет взять или захват утянет соседнюю: это конструкция и масса захвата
    и минимальный обрабатываемый размер'
  risk: mid
  auto: true
- id: Q32
  topic: Эксплуатация
  why: Задание отдаёт инструктаж и документацию нам и требует панель оператора на русском — то есть комплекс
    рассчитан на обычного оператора цеха, а не на робототехника.
  q: кто работает на комплексе и кто его обслуживает
  need: квалификация оператора, наличие на заводе службы КИПиА и программиста, объём обучения, нужен ли
    сервис в городе заказчика
  status: assumed
  answer: Принимаем одного оператора на комплекс без специальной робототехнической подготовки (работа
    только через панель оператора на русском языке) и обслуживание силами заводской службы главного механика;
    в объём входит инструктаж операторов и передача документации и резервных копий программ.
  basis: ТЗ п. 2 относит инструктаж персонала и передачу документации с резервными копиями к зоне поставщика,
    а п. 5.2 требует панель оператора на русском или белорусском языке — то есть расчёт документа на рядового
    оператора цеха, а не на робототехника.
  impact: 'комплекс окажется сложнее, чем персонал завода может обслуживать: это объём обучения, состав
    документации и потребность в сервисном договоре'
  risk: low
  auto: true
- id: Q33
  topic: Операция · правила укладки
  why: Правила свесов, центра масс и высоты груза заданы в задании с рисунками — именно они, а не размер
    паллеты, определяют, куда робот обязан дотянуться.
  q: по каким правилам считается укладка на выходную паллету корректной
  need: ограничения по свесам, центру масс, высоте груза и однородности слоя
  status: answered
  answer: Центр масс детали не должен выходить за габарит паллеты 1200 × 800 мм; вдоль заезда допустим
    свес до 300 мм со стороны, противоположной заезду (итого до 1500 мм); поперёк заезда — свес до 1000
    мм в обе стороны (деталь до 2800 мм); со стороны заезда транспортировочного устройства свес не допускается;
    в одном слое детали одной толщины; предельная высота груза 1200 мм; детали крупнее паллеты укладываются
    симметрично её оси.
  source: ТЗ пп. 3.5 и 6.1, с поясняющими рисунками
  impact: меняются требуемый вылет робота, шаг постов и ширина проездов — правила свесов задают, куда
    робот обязан дотянуться
  risk: high
- id: Q34
  topic: Площадка · условия эксплуатации и тара
  why: Среда, питание, воздух и типоразмер поддона взяты из задания дословно — это справочные условия,
    которые не обсуждаются.
  q: в каких условиях работает комплекс и с какой тарой
  need: температура, питание, сжатый воздух, тип и размер паллеты, подложка
  status: answered
  answer: Закрытое отапливаемое помещение цеха, от +5 до +35 °C; питание 380 В ±10 % и 220 В ±10 %, 50
    Гц ±0,5 Гц; сжатый воздух 5–6 бар; поддон 1200 × 800 × 145 мм, рекомендуемая ширина проезда около
    3200 мм, минимальное расстояние от ограждения до паллеты около 200 мм; на основание паллеты укладывается
    подложка высотой от 3 до 12 мм, высота которой замеряется системой, а на подложку кладётся маркер
    пустой паллеты.
  source: ТЗ пп. 3.2, 3.5, 6.1, 6.3
  impact: исполнение шкафов, пневмосхема и алгоритм определения пустой паллеты окажутся рассчитаны не
    на те условия и не на ту тару
  risk: mid
  auto: true
updated: '2026-10-08'
authorization: 'Принятые решения 08.10.2026: (1) контактного лица у заказчика нет и писать ему пока нельзя
  — работаем целиком на предположениях; (2) вводные с высокой ценой ошибки переведены из «спросить» в
  «предположение» с обязательным основанием, вопрос сохранён в поле q и будет задан, когда появится адрес.
  Каждое предположение обязано дойти до ТКП оговоркой или границей применимости. ОТДЕЛЬНО: класс робота
  из задания (не менее 100 кг, вылет не менее 3100 мм) по расчёту не проходит — деталь 2800×1200 массой
  42 кг с траверсой даёт на фланце 122–137 кг и момент инерции порядка 80–90 кг·м² против примерно 40
  кг·м², допустимых по оси 6 у роботов класса 125 кг. Требуется класс 210–280 кг либо портальное решение.
  Это расхождение с заданием выносится заказчику отдельно и до его ответа считается установленным фактом,
  а не предположением: физика не обсуждается.'
