  basis: ТЗ п. 3.5 упоминает только подложку на основании паллеты, а п. 6.3 требует лишь формирования
    паллетного листа; операций обмотки, обвязки и укладки прокладок в описании техпроцесса (п. 4.3, пять
    этапов) нет.
  impact: состав оснастки и периферии, такт, объём поставки
  risk: low
- id: Q27
  topic: Зрение · тёмные и глянцевые декоры
  q: подтверждается ли распознавание самых тёмных и глянцевых декоров на реальных образцах
  need: перечень самых сложных декоров (чёрный глянец, тёмный глянец, зеркальные плёнки), их доля в программе,
    согласие на опытную съёмку образцов до подписания
  status: assumed
  ask_text: 'Распознавание чёрных и глянцевых поверхностей — известное ограничение 2.5D-съёмки (структурированный
    свет и ToF): глянец даёт пересвет и потерю сигнала, тёмная поверхность — недосвет проекции, в результате
    в облаке точек появляются пропуски, и границы детали определяются неустойчиво. Просим назвать самые
    тёмные и самые глянцевые декоры в программе и их долю, и согласовать опытную съёмку: передать нам
    3–5 образцов таких деталей либо организовать выезд с камерой на участок. До такой проверки распознавание
    чёрного глянца мы не можем гарантировать ни в ТКП, ни в договоре.'
  basis: 'Проблема документирована: статья «Robust 3D reconstruction of highly reflective objects via
    structured light» и материал vision-systems.com о влиянии свойств поверхности на 3D-сенсоры; отраслевое
    обходное решение именно для чёрных мебельных плит описано у wenglor — ToF-датчик меряет расстояние
    до чёрной кромки плит МДФ, и робот по этим данным берёт деталь.'
  impact: выбор камеры и схемы подсветки, вероятность доработок на ПНР, достижимость критерия приёмки,
    резерв часов на отладку зрения, риск невыполнимого обязательства в договоре
  risk: high
  answer: До проверки закладываем камеру с режимом расширенного динамического диапазона и поляризацией,
    резервную схему подсветки и возможность дополнить 2.5D-съёмку контурным выделением на просвет снизу
    или боковым ToF-замером кромок.
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q28
  topic: Зрение · охват и разрешение
  q: чем закрывается требуемая зона съёмки 2900 × 1600 мм с разрешением не хуже 1 мм
  need: сколько камер и как они размещаются, одна камера на входную паллету или сканирование с фланца
    робота
  status: assumed
  answer: 'Принимаем, что одной камерой требование ТЗ не закрывается, и закладываем по отдельной камере
    на каждую входную паллету (либо съёмку в два кадра со сшивкой) — ТЗ это прямо допускает. Параметры
    камеры в ТЗ требуют уточнения на этапе проектирования: охват 2900 × 1600 мм при рабочем расстоянии
    100–1300 мм соответствует углу обзора около 96°, чего серийные 2.5D-камеры не дают.'
  basis: Самый крупнопольный серийный структурированный сканер Photoneo PhoXi XL даёт зону съёмки около
    1954 × 1459 мм на дистанции 2326 мм при диапазоне 1680–3780 мм, то есть требуемый охват 2900 × 1600
    мм одним кадром серийного оборудования не покрывается.
  impact: число камер и стоимость зрения, время съёмки слоя в такте, схема крепления и калибровки
