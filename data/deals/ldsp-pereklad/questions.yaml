- id: Q29
  topic: Зрение · чтение QR и AZTEC
  q: как читаются коды размером 30 × 30 мм
  need: отдельный сканер или камера чтения кода, место чтения в цикле, влияние на такт
  status: assumed
  answer: 'Принимаем отдельный канал чтения кода: обзорная камера находит деталь, а код читает отдельная
    камера — на фланце робота или на стационарном посту, мимо которого робот проносит деталь. Обзорной
    камерой код прочитать невозможно, и это закладывается в такт отдельной операцией 1,5–2,5 с на деталь.'
  basis: 'Расчёт: для надёжного декодирования QR нужно не менее 3 пикселей на модуль (MDPI Sensors 22(19):7230,
    техническая записка Omron VHV5); код 30 × 30 мм — это модуль около 1 мм, значит нужно не хуже 0,33
    мм на пиксель, то есть около 8700 пикселей по ширине поля 2900 мм — такой камеры в серийном производстве
