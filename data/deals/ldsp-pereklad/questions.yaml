  impact: состав оборудования зрения, такт, компоновка (пост чтения), достоверность паллетного листа
  risk: mid
- id: Q30
  topic: Оборудование · класс робота и захват
  q: достаточно ли робота грузоподъёмностью 100 кг с вылетом 3100 мм, как задано в ТЗ
  need: проверка по трём независимым критериям — масса нагрузки, момент на кисти, момент инерции на кисти
  status: assumed
  answer: 'Принимаем, что заданного ТЗ робота «не менее 100 кг, вылет не менее 3100 мм» для детали 2800
    × 1200 мм недостаточно, и закладываем робот класса 210–280 кг с вылетом не менее 3100 мм. Расчёт:
    траверса, перекрывающая деталь 2800 × 1200 мм, весит около 80–95 кг, с деталью 42 кг нагрузка на фланце
    122–137 кг — уже выше 125 кг; момент инерции относительно вертикальной оси кисти составляет около
    80 кг·м² против допустимых 40 кг·м² у робота класса 125 кг, то есть превышение двукратное. Альтернатива,
    которую проверим на стадии компоновки, — укороченная траверса около 2000 мм с разнесёнными присосками
    и облегчённой рамой либо портальное исполнение вместо шарнирного робота.'
  basis: 'Масса траверсы оценена по даташиту Schmalz: рейка FXP шириной 130 мм и длиной 1234 мм весит
    около 6,1 кг, в пересчёте на 2800 мм это около 13,8 кг на рейку, четыре рейки дают около 55 кг, плюс
    рама, вакуумгенерация, зонные клапаны и демпферы 25–40 кг. Момент инерции посчитан как J = m·L²/12
    для траверсы и детали. Допуски взяты из даташита Fanuc R-2000iC/125L (125 кг, вылет 3100 мм — ровно
    класс из ТЗ): допустимая инерция J4/J5 72 кг·м², J6 40 кг·м², допустимый момент J4/J5 710 Н·м, J6
    355 Н·м. Проверка на реальной модели — стадия bom.'
  impact: класс и цена робота (разница между 125 и 280 кг существенная), конструкция захвата, требования
    к основанию и фундаменту, достижимый такт, выполнимость требований ТЗ в целом
  risk: high
- id: Q31
  topic: Оборудование · универсальность захвата
  q: одним захватом брать и деталь 150 × 60 мм, и деталь 2800 × 1200 мм
  need: модульность и зонирование вакуума, нужна ли автоматическая смена захвата, минимальный зазор между
    деталями на входной паллете
  status: assumed
  answer: 'Принимаем единый модульный захват с зонной коммутацией вакуума: крупная деталь берётся всеми
    зонами, мелкая — одной малой секцией с присосками уменьшенного диаметра; автоматическая смена захвата
    не закладывается. Сквозные отверстия до 20 мм и глухие до 35 мм парируются зонированием и самозапирающимися
    присосками.'
  basis: ТЗ п. 5.2 прямо требует модульную систему захвата под весь диапазон размеров; производитель площадных
    захватов Schmalz (серии FXP/FMP) заявляет взятие заготовки независимо от геометрии и вырезов, что
    соответствует требованию по отверстиям в деталях.
  impact: конструкция и масса захвата, достижимый минимальный размер детали, такт, риск захвата соседней
