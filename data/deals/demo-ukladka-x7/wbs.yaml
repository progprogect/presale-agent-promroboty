# Декомпозиция работ (WBS). Часы — по ролям; итоги считает генератор.
# basis: analog (по аналогу, ref — строка прошлой сделки) | norm (по нормативу, ref — источник)
#        | expert (экспертно, est — "О/В/П", часы = (О+4В+П)/6)
roles: [ГИП, АСУТП, Робототехник, Конструктор КД]
stages:
  - name: Проектирование
    tasks:
      - id: "1.1"
        name: Компоновка и симуляция RoboDK
        result: отчёт по досягаемости, коллизиям и циклу на номенклатуре
        basis: {type: analog, ref: "Палетирование-2025, стр. 1.2"}
        hours: {ГИП: 8, Робототехник: 24}
      - id: "1.2"
        name: Сборочный чертёж рельсового пути
        result: выпущен сборочный чертёж со спецификацией
        basis: {type: norm, ref: "норматив КД-07"}
        hours: {Конструктор КД: 34}
      - id: "1.3"
        name: Схема электрики и щит управления
        result: принципиальная схема и компоновка щита
        basis: {type: expert, est: "12/20/34"}
        hours: {ГИП: 5, АСУТП: 21}
  - name: Закупка и поставка
    tasks:
      - id: "2.1"
        name: RFQ и договоры с поставщиками
        result: размещены заказы по всем позициям BOM
        basis: {type: analog, ref: "Палетирование-2025, стр. 2.1"}
        hours: {ГИП: 13}
      - id: "2.2"
        name: Контроль графика поставки
        result: еженедельный статус, риски эскалированы
        basis: {type: expert, est: "5/8/13"}
        hours: {ГИП: 8}
      - id: "2.3"
        name: Входной контроль оборудования
        result: акты входного контроля по всем позициям
        basis: {type: norm, ref: "чек-лист ВК-02"}
        hours: {АСУТП: 8, Робототехник: 5}
  - name: Монтаж и пусконаладка
    tasks:
      - id: "3.1"
        name: Монтаж рельсового пути и робота
        result: механомонтаж завершён, геометрия выверена
        basis: {type: analog, ref: "Палетирование-2025, стр. 4.2"}
        hours: {ГИП: 5, Робототехник: 34}
      - id: "3.2"
        name: Электромонтаж и подключение щита
        result: ячейка запитана, цепи безопасности проверены
        basis: {type: norm, ref: "ПУЭ, чек-лист ЭМ-01"}
        hours: {АСУТП: 21}
      - id: "3.3"
        name: Программирование и отладка цикла
        result: цикл на всей номенклатуре в паспортное время
        basis: {type: expert, est: "13/21/34"}
        hours: {АСУТП: 13, Робототехник: 21}
      - id: "3.4"
        name: ПМИ и приёмка
        result: протокол ПМИ подписан
        basis: {type: norm, ref: "шаблон ПМИ"}
        hours: {ГИП: 8, АСУТП: 5, Робототехник: 5}
