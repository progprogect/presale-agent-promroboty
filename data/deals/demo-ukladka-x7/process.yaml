# Схема процесса дорожками. Та же спека рендерится в картинку титула ТКП
# (knowledge/cspl/generators/process-diagram).
# Внимание: значения с запятой (время «8,6 с») пишем в блочном стиле или в кавычках —
# в потоковом {a: 1, b: 2} запятая разделяет поля.
title: Цикл работы участка — от выхода заготовки из пресса до увоза заполненной тары
columns:
- {n: 1, label: Штамповка}
- {n: 2, label: Съём}
- {n: 3, label: Контроль}
- {n: 4, label: Укладка}
- {n: 5, label: Смена тары}
lanes:
- {id: op, name: Оператор, sub: что делает человек, kind: human}
- {id: cell, name: Ячейка укладки, sub: наша поставка, kind: ours}
- {id: cl, name: Оборудование заказчика, sub: пресс и отводящий рольганг, kind: client}
steps:
- n: 1
  lane: cl
  title: Штамповка заготовки
  desc: пресс выдаёт заготовку на отводящий рольганг
  time: "8,6 с"
- n: 2
  lane: cell
  title: Съём с рольганга
  desc: робот берёт заготовку вакуумным захватом по нелицевой стороне
  time: "3,1 с"
- n: 3
  lane: cell
  title: Распознавание типоразмера
  desc: камера сверху определяет типоразмер и положение
  parallel: идёт во время подвода робота к таре
  time: "0,4 с"
- n: 4
  lane: cell
  title: Укладка в гнездо
  desc: робот ставит заготовку в гнездо по схеме укладки типоразмера
  time: "4,2 с"
- n: 4
  lane: op
  title: Визуальный надзор
  desc: оператор следит за участком, в цикл не вмешивается
- n: 5
  lane: cell
  title: Сигнал «тара заполнена»
  desc: ячейка останавливает подачу и зажигает лампу
- n: 5
  lane: op
  title: Подтверждение замены
  desc: оператор подтверждает смену тары с пульта
  time: "15 с"
- n: 5
  lane: cl
  title: Увоз тары погрузчиком
  desc: погрузчик заказчика забирает заполненную тару
  time: "90 с"
cycle: шаги 1–4 повторяются на каждой заготовке; шаг 5 — раз на 48 заготовок
key_figure: такт ячейки 7,7 с против 8,6 с у пресса — участок ограничен прессом, а не нами
