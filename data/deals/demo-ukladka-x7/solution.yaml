# Компоновка на один лист. Структура = раздел ТКП «Почему именно такая компоновка».
summary: >-
  Один шестиосевой робот у конца отводящего рольганга снимает заготовку вакуумным захватом
  и укладывает её в тару по схеме своего типоразмера. Типоразмер определяет камера сверху,
  пока робот идёт к таре, — отдельной позиции контроля в цикле нет. Две позиции тары под
  поворотным столом: пока робот наполняет одну, вторую меняет погрузчик, и участок не
  останавливается. Ячейка ограждена, вход тары закрыт световым барьером.
nodes:
- name: Робот с вакуумным захватом
  what: снимает заготовку с рольганга и ставит в гнездо тары
  why: вакуум по нелицевой стороне — единственный способ не повредить поверхность по требованию ТЗ
- name: Камера распознавания
  what: определяет типоразмер и положение заготовки на рольганге
  why: заготовки идут вперемешку, а схема укладки у каждого типоразмера своя
- name: Поворотный стол на две позиции тары
  what: подставляет пустую тару и выводит заполненную в зону погрузчика
  why: без него участок встаёт на 90 секунд каждой смены тары, и такт перестаёт укладываться в пресс
- name: Ограждение со световым барьером
  what: закрывает зону робота, вход тары перекрыт барьером
  why: ТР ТС 010/2011 и ГОСТ Р ИСО 10218; барьер вместо двери — чтобы не останавливать цикл на смене тары
rejected:
- option: Робот без камеры, типоразмеры разделяет оператор
  why: оператор становится частью такта и ошибается; при 420 шт/ч это узкое место, а не экономия
- option: Две позиции тары без поворотного стола, робот дотягивается до обеих
  why: вылет вырастает до следующего типоразмера робота, и цена узла получается выше стола
- option: Конвейер вместо погрузчика
  why: избыточно — погрузчик у заказчика уже ходит по этому пролёту
proof:
- досягаемость проверена на всех четырёх типоразмерах во всех гнёздах обеих позиций тары
- коллизий нет, минимальный зазор до ограждения 140 мм
- такт 7,7 с против 8,6 с у пресса — запас 10 %
- смена тары проходит внутри цикла, остановки участка нет
limits:
- заготовки тяжелее 5 кг не берутся вакуумным захватом этого типоразмера — нужен другой захват
- заготовки с отверстиями в зоне присосок требуют пересчёта схемы захвата
- при росте программы выше 480 шт/ч узким местом становится уже ячейка, а не пресс
