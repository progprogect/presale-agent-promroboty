# Вводные по запросу. Эталон набора — knowledge/templates/key-questions.md.
# internal: true — вопрос остаётся внутри (на публичный портал не уходит).
questions:
- id: Q1
  topic: Номенклатура
  q: что укладываем — вся номенклатура, а не одна заготовка
  need: габариты, масса, материал, число типоразмеров, доля каждого в программе
  status: answered
  answer: четыре типоразмера штампованных заготовок от 180×120 до 320×240 мм, 0,9–3,4 кг, сталь 08пс;
    доли в программе 45 / 30 / 15 / 10 %
  source: письмо заказчика 12.09, таблица в приложении
  impact: грузоподъёмность и вылет робота, захват, схема укладки, цикл
  risk: high
- id: Q2
  topic: Операция
  q: что считается годной укладкой
  need: точность позиционирования в таре, допустимое смещение слоя, требование к поверхности
  status: answered
  answer: отклонение заготовки в гнезде не более ±2 мм, царапины на лицевой поверхности не допускаются —
    захват вакуумный по нелицевой стороне
  source: ТЗ п. 3.4
  impact: тип захвата, скорость подвода, оснастка тары
  risk: high
- id: Q3
  topic: Производительность
  q: сколько штук в час и в каком режиме
  need: средний и пиковый такт, смен в сутки, дней в году
  status: answered
  answer: 420 заготовок в час в пике, две смены, 250 рабочих дней
  source: ТЗ п. 2.1
  impact: число постов, параллельность операций, обоснование окупаемости
  risk: high
- id: Q4
  topic: Граница поставки
  q: откуда заготовка приходит и куда уходит
  need: точки входа и выхода, кто подаёт и забирает, что наше и что заказчика
  status: assumed
  answer: принимаем, что заготовка выходит из пресса на отводящий рольганг заказчика, мы снимаем её
    с конца рольганга; заполненную тару увозит погрузчик заказчика
  basis: так устроены три аналогичных участка заказчика по фотографиям цеха, присланным 12.09
  impact: объём поставки, цена, зона ответственности на приёмке
  risk: high
- id: Q5
  topic: Площадка
  q: где это физически встанет
  need: доступная площадь и высота, пол, подводы, среда, встройка или новое помещение
  status: ask
  ask_text: Просим габариты свободной зоны у пресса (длина × ширина × высота до нижней отметки
    коммуникаций), тип и состояние пола, точки подключения 380 В и сжатого воздуха.
  impact: компоновка, ограждение, работы по монтажу, фундамент
  risk: high
- id: Q6
  topic: Оборудование заказчика
  q: что остаётся в контуре из существующего
  need: модель пресса, интерфейс выдачи сигнала готовности, можно ли вмешиваться в его схему
  status: ask
  ask_text: Просим марку пресса и отводящего рольганга и уточнение, выведен ли «сухой контакт»
    окончания цикла, либо его надо организовывать.
  impact: интеграция, протокол обмена, риск стыковки
  risk: mid
- id: Q7
  topic: Приёмка
  q: по какому критерию заказчик примет работу
  need: контрольная партия, время цикла, процент брака, где испытываем
  status: assumed
  answer: принимаем контрольную партию 500 заготовок по всем четырём типоразмерам на площадке
    заказчика, критерий — такт и ноль повреждений лицевой поверхности
  basis: типовая практика приёмки по ГОСТ на участках подобного класса, объём партии — по аналогичному
    проекту компании
  impact: программа и методика испытаний, сроки, резерв на доводку
  risk: mid
- id: Q8
  topic: Исходные данные
  q: что заказчик даёт и когда
  need: чертежи заготовок и тары, образцы, ответственный и срок
  status: assumed
  answer: принимаем, что чертежи четырёх заготовок и тары заказчик передаёт в течение двух недель
    после подписания, образцы — к началу испытаний захвата
  basis: срок взят по аналогичным проектам; в договор уйдёт как обязанность заказчика со сроком
  impact: старт работ, риск простоя проекта, обязанности заказчика в договоре
  risk: mid
- id: Q9
  topic: Нормы
  q: чем регламентировано
  need: ТР ТС, ГОСТ по безопасности, требования службы охраны труда завода
  status: assumed
  answer: ТР ТС 010/2011, ГОСТ Р ИСО 10218-1/2, ограждение с блокировками и световым барьером на входе тары
  basis: обязательный минимум для роботизированной ячейки в РБ; особых требований заказчик не заявлял
  impact: состав документации, сертификация, цена ограждения
  risk: low
- id: Q10
  topic: Деньги и решение
  q: бюджет, срок, кто решает
  internal: true
  need: ориентир бюджета, желаемая дата запуска, финансирование, тендер и конкуренты, ЛПР
  status: ask
  ask_text: внутренний вопрос, заказчику не задаётся в таком виде
  impact: вариант комплектации, стратегия ТКП, приоритет сделки
  risk: mid
