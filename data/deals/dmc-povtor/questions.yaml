questions:
- id: Q1
  topic: Номенклатура
  q: с какой номенклатурой пачек работает комплекс — вся, а не один формат
  need: габариты Д×Ш×Т и масса крайних форматов, число SKU и их доли в выпуске, газонаполнение, тип плёнки
    по каждому формату, место кода на пачке
  status: assumed
  ask_text: 'Просим заполнить и направить Приложение 1 (матрица SKU). По каждому формату нужны: масса,
    габариты пачки Д×Ш×Т в мм, тип плёнки (металлизированная — да/нет), газонаполненная пачка или нет,
    скорость линии в пачках в минуту, на каком автомате идёт формат, фактическая доля несчитанных кодов
    и фото пачки, на котором видно место нанесения кода.'
  basis: Матрица SKU (Приложение 1 к заданию) не приложена — в документе прямо сказано, что её предоставит
    заказчик. Габариты выведены из массы и типа упаковки по типовым типовым форматам пакета-подушки этого
    веса; число SKU — по практике производств фасованной продукции такого масштаба. Это оценка, а не измеренная
    величина.
  impact: тип и грузоподъёмность манипулятора, конструкция и ход вакуумного захвата, число рецептов и
    время переналадки (≤15 мин по ТЗ), геометрия зоны считывания, цикл
  risk: high
  answer: 'Работаем по крайним форматам из текста задания: пачка-подушка 60–150 г из многослойной металлизированной
    плёнки, габариты ориентировочно от 160×110×50 до 300×200×90 мм, число SKU принимаем 15–25 с преобладанием
    двух-трёх ходовых форматов. Код считаем нанесённым на лицевую сторону в верхней трети пачки.'
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q2
  topic: Операция
  q: что именно делает комплекс с пачкой и что считается успешным результатом
  need: последовательность операций и измеримые критерии качества
  status: answered
  answer: 'снять с ленты пачку с несчитанным кодом, дочитать код в одном или нескольких положениях (поворот,
    смена угла, при необходимости разглаживание зоны кода), вернуть пачку в поток без двойного учёта и
    без попадания в поток пачки с неподтверждённым кодом; окончательно несчитанные пачки — в отдельную
    тару с записью события (время, SKU, линия, фото). Измеримые критерии: дочитывание ≥95 % при исправно
    нанесённом коде, повреждение пачек ≤0,1 %, ошибки возврата и учёта — 0, работа на 90 шт/мин без снижения
    темпа линии'
  source: ТЗ разд. 1, пп. 4.4 и 4.5, разд. 9 (таблица критериев приёмки)
  impact: архитектура решения, состав поста считывания, требования к захвату, программа испытаний
  risk: high
- id: Q3
  topic: Производительность
  q: какой поток и в каком режиме работает линия
  need: поток в пачках в минуту, режим работы, годовой фонд, целевая готовность
  status: answered
  answer: 50–90 пачек в минуту на линию в зависимости от продукта и формата; режим 24 ч в сутки, 22 суток
    в месяц, 264 суток в год (≈528 ч/мес, ≈6336 ч/год); окна плановых работ — только непроизводственные
    сутки (8–9 в месяц), ежесменные операции ≤10 мин без остановки линии; целевая готовность ≥98 % производственного
    времени
  source: ТЗ разд. 1 (поток) и разд. 5 (режим, фонд, окна ТО, готовность)
  impact: число постов и манипуляторов, глубина буфера, требования к ЗИП и к MTBF/MTTR, цена ТО
  risk: high
- id: Q4
  topic: Доля несчитанных кодов (факт)
  q: сколько пачек в потоке реально не читается — по каждой линии и по каждому SKU
  need: процент и штуки в смену за 1–3 месяца, разбивка по линиям, SKU и сменам, пиковые значения
  status: assumed
  ask_text: 'Просим фактическую статистику несчитанных кодов за последние 1–3 месяца по каждой линии:
    доля несчитанных пачек к выпуску в процентах и в штуках за смену, разбивка по SKU, а также худшее
    значение за смену (пик). Это главная цифра экономики проекта: при 0,5 % и при 5 % получаются решения
    разного масштаба и разной стоимости — от одного компактного поста до нескольких постов с буфером.
    Если регулярной статистики нет, достаточно ручного подсчёта по 3–5 сменам на самом проблемном SKU.'
  basis: 'Единого отраслевого норматива доли несчитанных по металлизированной плёнке не найдено. Опорные
    точки: документированный случай деградации термотрансферной печати на металлизированном ламинате дал
    4,1 % нечитаемых кодов и был устранён сменой ленты (кейс TS Dowren, TTO на ретортной линии); линии
    с верификацией печати в норме держат менее 1 %. 2 % — середина между нормой и аварийным режимом.'
  impact: число манипуляторов и постов, нужен ли буфер и отводящий конвейер, объём тары брака, CAPEX и
    TCO за 5 лет, срок окупаемости — то есть выбор варианта целиком
  risk: high
  answer: Расчёт ведём от проектной точки 2 % несчитанных, с обязательной проверкой масштабирования решения
    на 5 % и 10 %, как требует разд. 3 задания.
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q5
  topic: Причина несчитывания и способ нанесения кода
  q: почему код не читается и поможет ли в принципе дочитывание с другого ракурса
  need: способ и марка принтера (термотрансфер TTO / каплеструйный / лазер / этикетка), место и ориентация
    кода на пачке, распределение причин по группам
  status: assumed
  ask_text: 'Просим указать способ нанесения кода (термотрансферный принтер, каплеструйный, лазер или
    этикетка) с маркой принтера, место кода на пачке (на какой стороне, на каком шве, ориентация) и —
    по возможности — распределение причин несчитывания по четырём группам: дефект печати, залом или складка
    плёнки, блик, смещение или наклон пачки. Если такой статистики нет, просим прислать 20–30 фотографий
    несчитанных пачек, на которых видна зона кода, либо сами пачки. Поясняем, зачем: дочитывание с другого
    ракурса снимает блик и неудачную ориентацию, разглаживание зоны кода — залом, но физически непропечатанный
    или оборванный код не дочитывается ни с какого ракурса, и такая пачка в любом случае уйдёт в тару
    для перемаркировки. Доли этих групп прямо определяют, какой процент дочитывания мы вправе гарантировать.'
  basis: 'TTO — преобладающий способ маркировки гибкой упаковки на вертикальных упаковочных автоматах,
    согласуется с типом упаковки из задания. Распределение причин — рабочая гипотеза без опоры на данные
    заказчика. ИМЕННО ЭТА ЦИФРА решает, нужен ли манипулятор: блик и ориентация лечатся оптикой, залом
    требует разглаживания, дефект печати не лечится ничем. Пока доля заломов не измерена, выбор между
    вариантами О и О+Р обоснован гипотезой, а не фактом — и так должен быть назван в предложении.'
  impact: достижимость критерия «дочитывание ≥95 %», состав оптики (поляризация, купольный свет, число
    ракурсов), необходимость узла разглаживания, граница применимости в ТКП
  risk: high
  answer: Принимаем термотрансферное нанесение (TTO) по ходу упаковочного автомата. Распределение причин
    несчитывания принимаем 40 % блик и ориентация, 40 % залом и складка, 20 % дефект печати.
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q6
  topic: Граница поставки
  q: где начинается и где заканчивается наш объём
  need: точка врезки в линию, что остаётся заказчика, кто делает монтаж и подводы, окно на монтаж
  status: assumed
  answer: 'принимаем, что комплекс — отдельный модуль на раме из нержавеющей стали на колёсах с винтовыми
    опорами, встраиваемый в разрыв существующего конвейера выше узла агрегации. В нашем объёме: участок
    транспортёра комплекса с энкодером, система считывания, манипулятор(ы) с захватом, узел возврата,
    тара окончательного брака, шкаф управления, ПО и обмен с системой маркировки, монтаж и пусконаладка.
    У заказчика остаются: упаковочный автомат, принтер маркировки и его камера, ПО уровней L2/L3 и узел
    агрегации, подвод питания и сжатого воздуха до точки подключения шкафа, кабельные трассы по цеху.
    Монтаж и врезка — в непроизводственные окна, одно окно 2–3 суток на линию; на время наладки линия
    работает в режиме байпаса'
  basis: ТЗ п. 4.8 (схема встройки в существующую линию, рама на колёсах, обязательный режим байпаса)
    и п. 4.6 (обмен с существующим ПО L2/L3 остаётся на стороне заказчика); разд. 5 прямо запрещает любые
    работы с остановкой вне непроизводственных суток. Разделение объёмов — типовое для встройки модуля
    в действующую линию
  impact: объём поставки и цена, ответственность за простой линии при монтаже, зона ответственности на
    SAT, состав договорных обязанностей заказчика
  risk: high
- id: Q7
  topic: Площадка
  q: куда физически встаёт модуль на каждой линии
  need: свободная длина конвейера до узла агрегации, проходы, высота ленты и свободная высота, пол, подводы
    380 В и воздуха, режим санитарной мойки
  status: assumed
  ask_text: 'Просим планировку участка по каждой линии с размерами: свободная длина конвейера между упаковочным
    автоматом и узлом агрегации (сколько метров можно занять под модуль), ширина прохода и свободная зона
    с обеих сторон ленты, высота ленты от пола и свободная высота до коммуникаций, тип и состояние пола;
    точка подключения 380 В с доступной мощностью и точка подключения сжатого воздуха с давлением и классом
    по ISO 8573-1; как и чем моется участок (сухая уборка, пена, обмыв водой) и попадает ли зона под влажную
    мойку. Достаточно эскиза от руки с размерами и нескольких фотографий участка.'
  basis: Планировка участка не получена, хотя задание на неё ссылается. Габарит выведен из компоновки
    поста считывания с буфером и зоной отбраковки; оценка по аналогичным встраиваемым модулям, а не замер.
  impact: компоновка целиком (встройка в разрыв ленты против выноса поста в сторону), глубина буфера,
    исполнение рамы и степень защиты, объём и стоимость монтажа
  risk: high
  answer: Закладываем модуль длиной 2,5–3,0 м по ходу ленты и шириной 1,2–1,5 м, с односторонним обслуживанием,
    встраиваемый в разрыв конвейера выше узла агрегации.
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q8
  topic: Оборудование заказчика
  q: что остаётся в контуре из существующего и с чем мы обмениваемся данными
  need: модели упаковочных автоматов, принтера и камеры, поставщик ПО L2/L3, устройство узла агрегации,
    доступные протоколы, наличие энкодера
  status: assumed
  ask_text: 'Просим по каждой линии: модель упаковочного автомата и его систему управления; модель принтера
    маркировки и камеры верификации кода; наименование и поставщика программного обеспечения маркировки
    уровней L2/L3; описание узла агрегации — где и чем считываются коды пачек перед укладкой в короб;
    какие интерфейсы обмена доступны (OPC UA, Modbus TCP, Profinet, TCP-сокет) и готов ли поставщик вашего
    ПО маркировки открыть обмен событиями; есть ли на конвейере энкодер и можно ли к нему подключиться.
    Если по узлу агрегации есть отдельное ТЗ или проект — просим его копию: наш алгоритм возврата пачки
    должен стыковаться именно с ним.'
  basis: 'Модели автоматов, принтера, камеры и поставщик ПО верхнего уровня не названы. Modbus TCP — наименьший
    общий знаменатель, доступный практически в любом ПО маркировки. Собственный источник сигнала выбран
    сознательно: он снимает риск упереться в закрытый протокол чужой системы, но добавляет позицию в состав.'
  impact: источник сигнала «не считан», алгоритм возврата и синхронизация с агрегацией, риск упереться
    в закрытое чужое ПО, состав работ по интеграции
  risk: high
  answer: Принимаем обмен с системой заказчика по Modbus TCP или TCP-сокету с квитированием; источник
    сигнала «не считан» — наша собственная камера и энкодер, без зависимости от чужого ПО.
  confirm_before: договор — предположение обязано дойти до ТКП как оговорка или граница применимости
- id: Q9
  topic: Агрегация и возврат в поток
  q: что технически означает «возврат без нарушения агрегации» и какие есть ограничения по порядку
  need: архитектура агрегации (потоковая или послойная), точка считывания кодов перед коробом, правила
    учёта изъятой и возвращённой пачки
  status: assumed
  answer: 'принимаем, что агрегация на линии потоковая: коды пачек считываются ещё раз непосредственно
    перед укладкой в короб и накапливаются в список, который привязывается к коду короба по достижении
    заданного количества. При такой схеме возврат пачки в любой свободный промежуток потока выше точки
    агрегации агрегацию не нарушает — ни «Честный знак», ни ГИС «Электронный знак» не предъявляют требований
    к порядку следования пачек внутри короба, значение имеет только корректная связь «код пачки → код
    короба» и отсутствие двойного учёта. Поэтому комплекс встраивается строго выше точки агрегации, каждая
    изъятая и каждая возвращённая пачка фиксируется событием в журнале, а пачка с неподтверждённым кодом
    в поток не возвращается никогда — только в тару брака'
  basis: правила агрегации ГИС МТ (объединение единиц в транспортную упаковку с передачей сведений о вложенности;
    требований к порядку пачек в коробе нет) и описания потоковой агрегации у профильных интеграторов
    — РБС Групп, ГК «Честная марка»; косвенно подтверждается тем, что в ТЗ агрегация вынесена отдельным
    ТЗ ниже по линии. Пункт спорный по последствиям — перед ПМИ проверить по первоисточнику (документация
    ЦРПТ и регламент узла агрегации заказчика)
  impact: точка встройки модуля относительно узла агрегации, алгоритм возврата (в свободный промежуток
    против отдельной дорожки), выполнимость критерия «ошибки учёта = 0» на приёмке
  risk: high
- id: Q10
  topic: Приёмка
  q: по какому критерию заказчик примет работу
  need: состав и место испытаний, контрольные показатели, длительность
  status: answered
  answer: 'FAT у поставщика на образцах пачек заказчика (допускается по видеосвязи, с видеозаписью); SAT
    на площадке — 72 часа непрерывной работы на номинальной скорости линии. Показатели: дочитывание ≥95
    % при исправно нанесённом коде, повреждение пачек ≤0,1 %, ошибки возврата и учёта 0, работа на 90
    шт/мин без снижения темпа линии, переналадка на другой SKU ≤15 мин'
  source: ТЗ разд. 9 (FAT/SAT и таблица критериев приёмки)
  impact: программа и методика испытаний, резерв часов на доводку, риск по срокам, состав ЗИП на период
    SAT
  risk: high
- id: Q11
  topic: Критерий «исправно нанесённый код»
  q: как на приёмке отделяются пачки, которые дочитать физически невозможно
  need: измеримое определение «исправно нанесённого кода» и способ его проверки на SAT
  status: assumed
  answer: принимаем, что исправно нанесённым считается код с классом качества не ниже 1,5 (C) по ISO/IEC
    15415, измеренным верификатором на контрольной выборке в момент испытаний; пачки с кодом ниже этого
    класса в расчёт показателя «дочитывание ≥95 %» не входят и штатно уходят в тару для перемаркировки.
    Это предположение войдёт в ТКП оговоркой и в ПМИ — отдельным пунктом
  basis: минимальный класс качества 1,5 (C) для GS1 DataMatrix по GS1 General Specifications и методика
    ISO/IEC 15415, на которую ссылается сам ТЗ в п. 4.3; без такого определения «≥95 %» считается от всего
    потока, включая физически нечитаемые коды, и спор на SAT гарантирован. Класс 1,5 (C) перед включением
    в ПМИ проверить по первоисточнику GS1
  impact: формулировка критерия приёмки, объём ответственности поставщика, содержание ПМИ
  risk: high
- id: Q12
  topic: Исходные данные
  q: что заказчик передаёт для расчёта и испытаний и когда
  need: образцы пачек по крайним форматам, образцы с реально несчитанными кодами, видео участка, ответственный
    и срок
  status: ask
  ask_text: 'Просим направить образцы: по 30–50 пачек каждого крайнего формата (самый лёгкий и самый тяжёлый,
    с газонаполнением и без) и не менее 20 пачек с реально несчитанными кодами в том виде, в каком они
    сошли с линии — именно они нужны для проверки оптики. Дополнительно просим видео участка линии в рабочем
    режиме (10–15 секунд, вид сверху и сбоку) и фамилию ответственного и срок, к которому образцы будут
    отправлены.'
  basis: ТЗ в разд. 2 подтверждает готовность направить образцы, в том числе с плохо читаемыми кодами;
    открытыми остаются количество, состав и срок, а без них нельзя планировать FAT
  impact: испытания захвата и оптики, достоверность обещанного процента дочитывания, срок FAT и дата отгрузки
  risk: mid
- id: Q13
  topic: Нормы
  q: чем регламентировано исполнение комплекса
  need: нормы безопасности, разрешительные документы для ЕАЭС, пищевое исполнение
  status: answered
  answer: 'безопасность — ISO 10218-1/-2, ISO 13849-1 не ниже PL d, ограждение или световые завесы, аварийный
    стоп, блокировки дверей, CE; для ввода в эксплуатацию в ЕАЭС — ТР ТС 010/2011, ТР ТС 004/2011, ТР
    ТС 020/2011 (сертификат или декларация либо содействие в оформлении); исполнение для пищевой зоны
    вторичной упаковки: не ниже IP54, смазки NSF H1, поверхности стойкие к моющим и дезинфицирующим средствам;
    документация на русском языке'
  source: ТЗ пп. 4.1, 4.7 и разд. 10
  impact: состав документации и сертификации, цена ограждения и исполнения, сроки оформления
  risk: mid
- id: Q14
  topic: Санитарное исполнение
  q: на какое исполнение считаем комплекс
  need: степень защиты, материал рамы и обшивки, конструкция под мойку
  status: assumed
  answer: закладываем IP65 на узлы в зоне мойки (IP54 — минимум по ТЗ), раму и обшивку из нержавеющей
    стали AISI 304 с наклонными поверхностями без карманов, пищевые присоски, смазки NSF H1, кабельные
    вводы с уплотнением; мойка участка — без прямой струи на шкаф управления
  basis: ТЗ п. 4.1 прямо указывает «IP65 желательно, зона проходит влажную санобработку» и NSF H1; AISI
    304 и конструкция без карманов — типовое требование к оборудованию зоны вторичной упаковки пищевого
    производства. Удорожание против IP54 будет показано в ТКП отдельной строкой
  impact: цена и срок поставки комплектующих, выбор модели манипулятора (наличие пищевого исполнения),
    конструкция рамы
  risk: mid
- id: Q15
  topic: Источник сигнала «не считан»
  q: кто говорит комплексу, какую именно пачку снимать
  need: собственная камера или сигнал существующей камеры L2, привязка к конкретной пачке, задержка
  status: assumed
  answer: 'принимаем, что комплекс не зависит от чужой камеры: в составе модуля своя камера входного контроля
    со считывателем и трекингом по энкодеру конвейера, которая сама определяет пачку с несчитанным кодом
    и ведёт её координату. Сигнал существующей камеры L2 используем как дублирующий, если заказчик откроет
    интерфейс'
  basis: ТЗ в разд. 1 и п. 4.3 прямо допускает собственную камеру и требует трекинг по энкодеру; собственная
    камера снимает зависимость от стороннего ПО маркировки, от его задержки и от сроков чужого подрядчика
    — иначе пусконаладка упирается в третью сторону
  impact: состав поставки (камера, свет, энкодер), объём интеграционных работ и сроки, цена
  risk: mid
- id: Q16
  topic: Число линий и площадок
  q: на скольких линиях и площадках внедряем и в какой очерёдности
  need: количество линий, их автоматы и скорости, число площадок, очерёдность
  status: ask
  ask_text: Просим указать, на скольких линиях и на скольких площадках планируется внедрение, какие это
    линии (автомат, скорость, основные SKU) и в какой очерёдности они подключаются. Цену мы дадим, как
    просит ТЗ, за комплекс на одну линию и за каждый последующий, но от общего числа зависят тиражная
    цена, объём ЗИП и схема сервиса.
  basis: в ТЗ поле «Количество линий» оставлено незаполненным с пометкой «до 4 на площадке»; базовым принимаем
    один комплекс на одну линию с ценой тиража на 2–4 линии — именно такую структуру цены запрашивает
    разд. 1 ТЗ
  impact: тиражная цена и скидка, объём ЗИП и схема сервиса, стратегия поэтапного внедрения
  risk: mid
- id: Q17
  topic: Объём маркируемой продукции
  q: какая часть выпуска реально маркируется кодами Data Matrix
  need: доля выпуска на рынок РФ по каждой линии, маркируются ли все смены или отдельные партии
  status: ask
  ask_text: 'Просим указать, какая доля выпуска каждой линии маркируется кодами Data Matrix — то есть
    идёт на рынок, где маркировка этой товарной группыой продукции обязательна, — и маркируются ли все
    смены подряд или отдельные партии. Экономика комплекса считается от числа реально маркируемых пачек:
    если маркируется, например, треть выпуска, один комплекс может обслуживать две линии поочерёдно, и
    это заметно меняет стоимость решения.'
  basis: в РФ маркировка этой товарной группы обязательна с 01.05.2025 (постановление Правительства РФ
    № 1682); в перечень товаров, подлежащих маркировке в Республике Беларусь, эта товарная группа, по
    открытым материалам ГИС «Электронный знак», пока не входит — это оценка, требующая проверки по первоисточнику,
    но она прямо влияет на объём и на выбор между стационарным и переносимым исполнением
  impact: загрузка комплекса, число комплексов на площадку, расчёт окупаемости и TCO
  risk: mid
- id: Q18
  topic: Альтернатива манипулятору
  q: допускает ли заказчик решение без робота, если оно даёт лучшую экономику
  need: формальное разрешение на альтернативный вариант и критерий сравнения
  status: answered
  answer: 'да: ТЗ прямо просит предложить альтернативу — многокамерный туннель 360°, доработку освещения
    существующей камеры, стабилизацию положения пачки на ленте — либо совмещение такого узла с роботом,
    со сравнением вариантов. Главный критерий выбора — совокупная стоимость владения за 5 лет и окупаемость,
    а не цена манипулятора; формулировка ТЗ: «нам нужен результат, а не конкретная технология». В Приложении
    2 альтернативный вариант и его экономика вынесены отдельным пунктом 20 ПРИНЯТОЕ РЕШЕНИЕ 08.10.2026:
    идём оптикой. Базовым вариантом предложения ведём многокамерный узел считывания; манипулятор рассматриваем
    только как вторую ступень на остаток, который оптика не взяла. Основание — отраслевой опыт: серийные
    многоракурсные узлы считывания существуют и дают более 99 %, тогда как реализованных аналогов «робот
    снимает пачку, дочитывает и возвращает в поток» не найдено ни в русских, ни в английских, ни в немецких,
    ни в итальянских источниках. По компонентам опираемся на собственную базу поставщиков камер, объективов
    и подсветки, наработанную по текущим проектам.'
  source: ТЗ разд. 1 (абзац «Для Поставщика»), разд. 8, Приложение 2 п. 20
  impact: структура ТКП (два варианта со сравнением TCO вместо одного), объём инженерной работы на пресейл,
    вероятность выигрыша
  risk: high
- id: Q19
  topic: Перемаркировка как допустимый исход
  q: допустимо ли вместо дочитывания отвести пачку и нанести новый код
  need: позиция заказчика по перемаркировке, как она делается сегодня, кто её делает
  status: ask
  ask_text: 'Просим подтвердить, допустима ли на вашем производстве перемаркировка пачки — нанесение нового
    кода взамен нечитаемого с выводом старого кода из оборота — и как это делается сегодня: вручную на
    столе разбора, на отдельной полуавтоматической станции или иначе. Вопрос важен для выбора архитектуры:
    если перемаркировка допустима и уже отлажена, часть потока дешевле отводить и перемаркировывать, чем
    возвращать в поток манипулятором, и это напрямую меняет состав и цену комплекса.'
  basis: 'перемаркировка — штатная процедура ГИС МТ: новый код эмиссии «перемаркировка», документ с основанием
    «испорчено либо утеряно средство идентификации», старый код переходит в статус «выбыл»; срок подачи
    сведений — не позднее 20 рабочих дней. ТЗ сам упоминает перемаркировку как исход для окончательно
    несчитанных пачек (п. 4.5), но не говорит, допустима ли она как основной маршрут'
  impact: архитектура решения (дочитывание против отвода и перемаркировки), численность персонала на разборе,
    CAPEX и TCO
  risk: mid
- id: Q20
  topic: Эксплуатация
  q: кто обслуживает комплекс и что он заменяет сегодня
  need: текущие трудозатраты на ручной разбор, персонал и его квалификация, объём обучения
  status: ask
  ask_text: 'Для расчёта окупаемости просим данные: сколько человек в смену сейчас занято разбором пачек
    с несчитанным кодом и сколько времени это занимает; что сегодня происходит с такой пачкой (отбраковывается,
    вскрывается, перемаркировывается); кто будет обслуживать комплекс (наладчик, электрик КИПиА, их сменность)
    и сколько человек нужно обучить.'
  basis: ТЗ в разд. 8 оставляет расчёт эффекта за заказчиком, но без этих цифр мы не можем ни показать
    окупаемость, ни рассчитать объём обучения и сервисного контракта
  impact: расчёт эффекта и TCO, объём обучения, требования к HMI и к журналу событий
  risk: mid
- id: Q21
  topic: Повреждение пачки захватом
  q: чем берём пачку, чтобы не повредить упаковку и продукт
  need: тип захвата, допустимое усилие, поведение на газонаполненной пачке
  status: assumed
  answer: закладываем мягкий вакуумный захват на сильфонных присосках пищевого исполнения с регулируемым
    разрежением и контролем удержания, подъём за верхнюю плоскость пачки; ускорения ограничиваем так,
    чтобы не сминать газонаполненную пачку и не нагружать продольный шов; целевые ≤0,1 % повреждений и
    прирост лома продукта подтверждаются на образцах при FAT, до этого цифра остаётся расчётной
  basis: 'требование ТЗ п. 4.2 (недопустимы прокол, разрыв, нарушение шва, смятие) и отраслевая практика:
    отбор пакетов-подушек дельта-роботами с вакуумными захватами — серийная задача (JLS Osprey BP, Paxiom
    PKR Delta, кейс ABB с упаковкой кренделей); реальная производительность таких ячеек по отраслевым
    данным 80–110 отборов в минуту на робот, что с запасом перекрывает наш поток изъятий'
  impact: конструкция захвата и быстросъёмного крепления, скорость цикла, риск роста лома продукта, формулировка
    гарантии по повреждениям
  risk: mid
research:
- fact: Маркировка фасованной продукции в гибкой упаковке обязательна в РФ с 01.05.2025
  status: подтверждено
  source: постановление Правительства РФ № 1682 от 30.11.2024; markirovka.ru (сроки по бакалее)
- fact: В перечень товаров, подлежащих маркировке в РБ (ГИС «Электронный знак»), эта товарная группа пока
    не входит
  status: оценка
  source: datamark.by, обзоры перечня по постановлению № 1030 — проверить по первоисточнику
- fact: Требований к порядку следования пачек внутри короба при агрегации нет; значение имеет только корректная
    связь «код пачки → код короба» и передача сведений о вложенности
  status: подтверждено
  source: markirovka.ru (агрегация), документация ГИС МТ; описания потоковой агрегации РБС Групп, ГК «Честная
    марка»
- fact: Перемаркировка — штатная процедура ГИС МТ (эмиссия «перемаркировка», основание «испорчено либо
    утеряно СИ», старый код переходит в статус «выбыл», срок подачи сведений 20 рабочих дней)
  status: подтверждено
  source: docs.crpt.ru, markirovka.ru
- fact: Единого отраслевого норматива доли несчитанных кодов на металлизированной плёнке нет; документированный
    случай — 4,1 % нечитаемых при неверно подобранной ленте TTO, устранено сменой ленты на термостойкую
    резиновую
  status: подтверждено (единичный кейс)
  source: TS Dowren, кейс TTO на ретортной линии; Packaging Strategies, рекомендации по коду на плёнке
- fact: Против бликов на металлизированной плёнке работают купольный рассеянный свет и скрещённая поляризация
    (поляризатор на источнике + анализатор на камере); залом выявляется низкоугловым светом 10–20°, но
    геометрически искажённый в заломе код часто требует именно разглаживания
  status: подтверждено
  source: Lumimax (освещение для считывания и верификации кодов), Roder Vision, Dynamsoft
- fact: Серийные многокамерные туннели считывания существуют и дают >99 % считывания уже на четырёх камерах
    (логистические туннели Cognex на DataMan 380, Multi-Reader Sync; пищевые — Antares Vision, QualiVision,
    SPA TR360); для DMC на плёнке есть профильные применения (Tritecnica)
  status: подтверждено (для логистики и фармы), оценка (для пачек фасованной продукции 50–90 шт/мин)
  source: cognex.com (Modular Vision Tunnels, релиз DM380), antaresvisiongroup.com, qualivision.ch, spa-lab.it,
    tritecnica.it
- fact: Публичных цен на многокамерные туннели нет. Косвенный ориентир интегратора — многоракурсная станция
    16–70 тыс. USD, станция с конвейерами, отбраковкой и ограждением 27–155 тыс. USD
  status: оценка (один источник, другой рынок)
  source: addaScan (ЮАР), прайс-ориентиры систем машинного зрения
- fact: Отбор пакетов-подушек дельта-роботами с вакуумными захватами — серийная задача; реальная производительность
    80–110 отборов в минуту на робот (рекламные 180 — пиковые)
  status: подтверждено
  source: JLS Osprey BP, Paxiom PKR Delta, кейс ABB (упаковка кренделей), RBTX (разбор ограничений)
- fact: Типовая отраслевая реакция на несчитанный код на флоу-пак линии — автоматическая отбраковка пачки
    отбраковщиком по команде L2 и ручной разбор или перемаркировка; дочитывание в потоке применяется редко
  status: подтверждено
  source: РБС Групп (сериализация гибкой упаковки), Atesco (внедрение на линиях фасовки круп), Баланс
    1С (уровни L1–L3)
- fact: Реализованный кейс «робот снимает пачку с несчитанным кодом, дочитывает и возвращает в поток»
    — в открытых источниках (RU, EN, DE, IT) не найден. Q-Robot (СПб) заявляет роботизированные участки
    нанесения, считывания и агрегации, но без описания узла дочитывания
  status: не найдено
  source: поиск Exa по RU/EN/DE/IT, 08.10.2026
authorization: 'Принятые решения 08.10.2026: (1) заказчику по этой сделке НЕ писать — работаем на предположениях;
  (2) базовый вариант — оптика, не манипулятор. Вводные Q1, Q4, Q5, Q7, Q8 переведены из «спросить» в
  «предположение» с обязательным основанием: вопрос к заказчику сохранён в поле q и будет задан, когда
  переписка откроется. Каждое такое предположение обязано дойти до ТКП оговоркой или границей применимости.'
