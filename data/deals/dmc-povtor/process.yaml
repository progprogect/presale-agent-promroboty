# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
title: Путь пачки от нанесения кода до узла агрегации — что происходит с пачкой, код которой не прочитался
  с первого раза
columns:
- n: 1
  label: Маркировка
- n: 2
  label: Входной контроль
- n: 3
  label: Многоракурсное считывание
- n: 4
  label: Вторая ступень
- n: 5
  label: Возврат и учёт
- n: 6
  label: Окончательный брак
lanes:
- id: cl
  name: Оборудование заказчика
  sub: упаковочный автомат
  принтер: null
  конвейер: null
  узел агрегации: null
  kind: client
- id: cell
  name: Комплекс повторного считывания
  sub: наша поставка
  kind: ours
- id: op
  name: Оператор линии
  sub: что делает человек
  kind: human
steps:
- n: 1
  lane: cl
  title: Фасовка и нанесение кода
  desc: вертикальный автомат формирует пачку-подушку, принтер наносит Data Matrix
  time: 0,7 с
  note: при 90 пачках/мин такт линии 0,67 с на пачку
- n: 2
  lane: cell
  title: Трекинг пачки по энкодеру
  desc: комплекс берёт координату каждой пачки по импульсам энкодера конвейера и ведёт её до выхода из
    модуля
  parallel: идёт непрерывно, в такт не добавляет
- n: 2
  lane: cell
  title: Входной контроль кода
  desc: собственная камера комплекса решает, прочитан код или нет; прочитанные пачки идут транзитом и
    дальше в схеме не участвуют
  time: 0,05 с
  note: сигнал от существующей камеры заказчика принимается как дублирующий, если заказчик откроет интерфейс
    — зависимости от него нет
- n: 3
  lane: cell
  title: Стабилизация положения
  desc: сужающиеся направляющие ставят пачку в известное положение относительно ленты
  time: 0,3 с
- n: 3
  lane: cell
  title: Разглаживание зоны кода на ходу
  desc: верхняя прижимная лента с регулируемым усилием разглаживает плёнку на участке 700 мм; усилие ограничено
    по газонаполненной пачке
  time: 1,0 с
  note: снимает часть заломов до считывания и не требует съёма пачки с ленты
- n: 3
  lane: cell
  title: Считывание с пяти ракурсов
  desc: купол сверху, два боковых под 45° с поляризацией, низкоугловой на заломы, нижний через разрыв
    ленты; все по одному импульсу энкодера
  time: 0,15 с
  parallel: пять ракурсов срабатывают одновременно, решение по первому успешному
  note: на этом шаге по принятой гипотезе причин снимается 65–70 % потока несчитанных; такт узла ограничения
    не создаёт ни при 50, ни при 90 пачках/мин
- n: 4
  lane: cell
  title: Отвод остатка на накопитель
  desc: пневматический шлюз уводит непрочитанную пачку на боковую дорожку ёмкостью 8 пачек; основной поток
    не замедляется
  time: 0,2 с
- n: 4
  lane: cell
  title: Съём пачки манипулятором
  desc: мягкий вакуумный захват берёт пачку за верхнюю плоскость с контролем удержания
  time: 0,8 с
- n: 4
  lane: cell
  title: Активное разглаживание и дочитывание
  desc: ролик прокатывает зону кода по плите, считыватель с купольным светом читает в двух положениях
    пачки
  time: 1,7 с
  note: у второй ступени на пачку есть 3,3 с вместо 0,7 с на ленте — отсюда и разница в результате по
    заломам
- n: 4
  lane: op
  title: Контроль по журналу
  desc: оператор видит на панели долю дочитанных и наполнение тары брака, в цикл не вмешивается
- n: 5
  lane: cell
  title: Возврат в свободный промежуток
  desc: манипулятор кладёт дочитанную пачку в промежуток потока выше точки агрегации, система снимает
    отметку «изъята» и подтверждает событие возврата по коду
  time: 0,8 с
- n: 5
  lane: cl
  title: Агрегация в короб
  desc: существующий узел заказчика считывает коды пачек перед укладкой и связывает их с кодом короба
  note: порядок пачек в коробе значения не имеет — требуется только корректная связь «код пачки → код
    короба» и отсутствие двойного учёта
- n: 6
  lane: cell
  title: Вывод в тару брака
  desc: пачка, не дочитанная обеими ступенями, уходит в отдельную тару; записывается событие с временем,
    SKU, линией и фотографией
  time: 0,8 с
  note: пачка с неподтверждённым кодом в поток не возвращается никогда
- n: 6
  lane: cell
  title: Сигнал заполнения тары
  desc: датчик уровня зажигает световую колонну и даёт звуковой сигнал
- n: 6
  lane: op
  title: Разбор и перемаркировка
  desc: оператор забирает тару и перемаркировывает пачки штатной процедурой — так же, как делает это сегодня,
    но объём меньше
  time: по мере заполнения
cycle: шаги 1–3 проходит каждая пачка потока; шаги 4–6 — только пачки с несчитанным кодом, по гипотезе
  около 2 % потока, из них на вторую ступень попадает примерно треть
key_figure: оптическая ступень обрабатывает весь поток без потери такта линии; манипулятор при 2 % несчитанных
  и потоке 70 пачек/мин получает одну пачку раз в 94 секунды — загрузка 4 %
bypass: при отказе или обслуживании комплекса шлюз встаёт в положение прямого прохода, лента работает
  транзитом, несчитанные пачки разбираются вручную; линия не останавливается
