    ISO 13857). Шкаф управления манипулятора входит в его поставку и на схеме не размещён. На схеме показан
    вылет 0,6 м (больший из двух).'
  flag: warn
- pos: 16
  name: Вакуумный захват сильфонный пищевой, быстросъёмный, с датчиком удержания
  note: Мягкий вакуумный захват берёт пачку за верхнюю плоскость с контролем удержания; быстросъёмный,
    замена без инструмента. На схеме условный габарит.
- pos: 17
  name: Портал установки манипулятора
  note: 'Подвесная установка освобождает зону под постом и упрощает мойку. Геометрия портала в листе решения
