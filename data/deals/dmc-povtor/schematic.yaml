    решения задано только «дверь на блокировке».'
- pos: 22
  name: Световая завеса безопасности Type 4 на окно возврата пачки в поток
  note: 'Окно возврата физически открыто — через него пачка уходит обратно на ленту; закрыть дверью нельзя.
    Завеса стоит на окне шириной 0,6 м: через него же заходит участок подхода к дорожке-накопителю. Пачки
    проходят сквозь завесу: как завеса работает при проходе пачек (временное отключение функции — мьютинг
    — или иное решение), в составе не описано; проверить по первоисточнику. Положение и высота завесы
    условные.'
- pos: 23
  name: Выключатель безопасности с блокировкой двери
  note: Два выключателя безопасности на двери (по одному у каждого края). Положение условное.
- pos: 24
  name: 'Шкаф управления нержавеющий: ПЛК, промышленный ПК зрения, коммутатор, ИБП, блоки питания'
  note: 'Шкаф на стороне обслуживания вне зоны прямой мойки (прямая струя на шкаф не допускается). ПЛК
    ведёт цикл, байпас и цепи безопасности; ПК зрения держит зрение, журнал и рецепты. Габарит шкафа условный:
    в листе решения задана только точка установки.'
- pos: 25
  name: Панель оператора 10", русский язык
  note: Панель оператора на русском языке на стойке у шкафа; высота центра 1,45 м. Габарит условный.
- pos: 26
  name: Световая колонна с зуммером
  note: Световая колонна выступает над рамой (до 2,25 м при габаритной высоте рамы 1,9 м). Сигнализирует
    заполнение тары брака; зуммер.
- pos: 27
  name: Конвейер заказчика на выходе к узлу агрегации (вне поставки)
  note: Оборудование заказчика, в поставку не входит. Модуль встраивается в разрыв конвейера выше узла
    агрегации.
notes:
- 'Схема собрана по геометрии листа решения для варианта О+Р (вторая ступень вынесена вбок от основной
  рамы). Планировка участка заказчиком не передана: габарит 3,00 × 2,15 м (рама 2,8 × 1,4 м плюс вынос
  второй ступени) ПРИНЯТ и подлежит уточнению по планировке; он не измерен. Предположение о размерах участка
  — 2,5–3,0 × 1,2–1,5 м (вводная Q7) — по длине принятый габарит на верхней границе (3,00 м), по ширине
  превышает её (2,15 против 1,5 м); компоновка «в линию» (4,2 × 1,4 м) на схеме не показана.'
- 'Соответствие 12 узлам листа решения (по порядку листа): входной участок с энкодером и камерой контроля
  — поз. 3, 4, 5; стабилизация и прижимная лента — 6, 7; узел считывания из пяти ракурсов — 8–12; шлюз
  и дорожка-накопитель — 13, 14; манипулятор — 15 (портал 17); пост активного разглаживания и дочитывания
  — 18, 19; вакуумный захват — 16; узел возврата в поток — окно с завесой 22 и поток возврата; тара окончательного
  брака — 20 (сигнал заполнения — 26); шкаф, ПЛК, ПК зрения и панель оператора — 24, 25; контур безопасности
  — 21, 22, 23, 26; режим байпаса — шлюз 13 в положении «прямой проход» и лента 3 транзитом.'
- Размеры и положения узлов — по листу решения (координаты в мм от угла рамы, пересчитаны в метры схемы).
  Габариты, которых в листе решения нет (корпуса считывателей и камеры, энкодер, шкаф, панель оператора,
  световая колонна, шлюз, направляющие, портал, захват, плита и ролик поста, тара, дверь, стойки завесы,
  толщина ленты), приняты условно и показаны в масштабе только для понимания взаимного положения; высота
  ограждения условная. Высота ленты 0,9 м принята и подлежит сверке с планировкой заказчика.
- 'Показан один момент цикла: пачка на плите поста под считывателем Р6, манипулятор над постом, шлюз в
  положении «прямой проход». Рука манипулятора, положение планки шлюза и наклон боковых считывателей схематичны.'
- 'Стрелки: тёмная — основной поток пачек; синяя сплошная — отвод остатка на вторую ступень; синяя пунктирная
  — возврат дочитанной пачки в поток; красная — окончательный брак в тару. Пути потоков — по листу решения.'
- Светло-оранжевым показан конвейер заказчика (вне поставки), янтарным — узлы в проработке (досягаемость
  манипулятора, положение поста и дорожки, камера входного контроля без строки в составе). В изометрии
  ограждение условной высоты 0,55 м.
