- pos: 20
  name: Тара окончательного брака с датчиком заполнения
  note: 'Лоток для пачек, не дочитанных обеими ступенями; датчик заполнения даёт сигнал на световую колонну.
    Стоит внутри ограждения: выемка тары идёт через дверь на блокировке. Габарит тары и стойка условные.'
- pos: 21
  name: Ограждение зоны манипулятора — сетчатые панели, стойки, дверь
  note: 'Контур ограждения — по листу решения. Высота ограждения в концепте не задана; в изометрии условно
