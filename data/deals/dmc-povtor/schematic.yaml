  title: Изометрия
  file: schematic/iso.svg
- id: plan
  title: Планировка
  file: schematic/plan.svg
- id: side
  title: Вид сбоку
  file: schematic/side.svg
positions:
- pos: 1
  name: Конвейер заказчика на входе в модуль (вне поставки)
  note: 'Оборудование заказчика, в поставку не входит. Модуль встраивается в разрыв конвейера выше узла
    агрегации. Планировка участка и параметры ленты заказчика не получены: высота ленты 0,9 м и ширина
    0,3 м приняты и подлежат сверке.'
- pos: 2
  name: Рама из нержавеющей стали AISI 304 на колёсах с винтовыми опорами, 3400 × 1850 мм
  note: 'Рама 3400 × 1850 × 1900 мм показана каркасом: четыре стойки, верхний и нижний контуры; колёса
    и винтовые опоры на схеме не показаны. Габарит шире допущения по планировке (2,5–3,0 × 1,2–1,5 м)
    по обоим размерам: ячейка манипулятора с вылетом 600 мм требует не менее 1500 мм в поперечнике. Планировка
    участка заказчиком не передана — габарит принят, не замерен.'
- pos: 3
  name: 'Транспортёрный участок 3,4 м: пищевая лента 300 мм, ролики, мотор-редуктор, натяжение'
  note: Лента 0,3 м на высоте 0,9 м (принято, подлежит сверке с планировкой заказчика) во всю длину рамы
    3,4 м; разрыв 60 мм под нижний ракурс — на 1,64 м от входа. Мотор-редуктор и натяжение отдельной геометрии
    не имеют.
- pos: 4
  name: Энкодер инкрементальный 1000 имп/об с муфтой и кронштейном
  note: 'Энкодер на валу ленты у входа: координата каждой пачки ведётся по импульсам до выхода из модуля.
    По нему работают шлюз, укладка манипулятора и выпуск со сводящего модуля.'
- pos: 5
  name: Направляющие стабилизации положения пачки с регулировкой под SKU
  note: Сужающиеся направляющие (участок 400–700 мм от входа) ставят пачку в известное положение перед
    прижимной лентой; ширина прохода регулируется рецептом под формат.
- pos: 6
  name: Кожухи первой ступени с блокировкой и отбойные планки зевов прижимной ленты
  note: 'Показана отбойная планка во входном зеве прижимной ленты (X = 400 мм). Зев в 400 мм от входного
    проёма, а для щели 40–120 мм ГОСТ ISO 13857 (табл. 4) требует 850 мм: планка закрывает сам зев и снимает
    требование, входной туннельный кожух не нужен. Кожухи первой ступени с блокировкой на схеме не показаны,
    чтобы не закрывать оптику. Числа — по внутренней выжимке норм, сверить при выпуске КД.'
- pos: 7
  name: Узел прижимной ленты-разглаживателя с регулировкой усилия и зазора
  note: Верхняя лента с регулируемым усилием прижимает пачку к нижней на участке 700 мм (X 400–1100, центр
    узла 750 мм); зазор 60–110 мм. Усилие ограничивается по газонаполненной пачке, значение подтверждается
    на образцах при заводских испытаниях.
- pos: 8
  name: Р1. Считыватель сверху с купольным рассеянным светом
  note: 'Купольный свет и скрещённая поляризация — приём против блика на металлизированной плёнке. Р1
    выполняет и функцию входного контроля «прочитан код или нет»: отдельной камеры входного контроля на
    входе в модуль нет.'
- pos: 9
  name: Р2. Считыватель сбоку под 45° с поляризованным светом
  note: 'Наклон на схеме не показан (объёмы без поворота по горизонтали): считыватель смотрит на точку
    над лентой под 45°.'
- pos: 10
  name: Р3. Считыватель сбоку под 45° с поляризованным светом
  note: Зеркален Р2 относительно оси ленты.
- pos: 11
  name: Р4. Считыватель сверху с низкоугловым кольцевым светом
  note: Низкоугловой свет выявляет рельеф залома. Кольцо на высоте 0,96 м регулируется по толщине пачки
    (50–90 мм).
- pos: 12
  name: Р5. Считыватель снизу через разрыв ленты 60 мм
  note: 'Нижний ракурс закрывает пачки, легшие кодом вниз. Ось Р5 (X = 1640 мм) — крайняя точка оптики
    первой ступени по ходу ленты: до западной границы круга вылета манипулятора (X = 1800 мм) 160 мм.'
- pos: 13
  name: Шлюз отвода остатка, пневматический поворотный
  note: 'Пневматический поворотный шлюз на X = 2150 мм: положение выбрано так, чтобы круг вылета манипулятора
    (западная граница X = 1800 мм) не накрывал оптику первой ступени (крайняя точка Р5 — X = 1640 мм).
    Показан в рабочем положении: планка поперёк ленты отводит непрочитанную пачку на дорожку-накопитель.
    В обесточенном положении планка лежит вдоль кромки ленты — «прямой проход», режим байпаса: при отказе
    или обслуживании линия не останавливается. Привод и размеры планки схематичны. Шлюз стоит ниже узла
    считывания, поэтому решение «прочитан код или нет» успевает дойти до исполнения.'
- pos: 14
  name: Дорожка-накопитель остатка 650 мм на 3–5 пачек с поперечной подачей от шлюза
  note: Поперечная дорожка от шлюза, Y 850–1500 мм (650 мм по ходу пачки), ёмкость 3–5 пачек в зависимости
    от формата. Отвод остатка идёт по ней; возврат дочитанной пачки — по отдельной дорожке на 450 мм восточнее.
- pos: 15
  name: 'Станция активного разглаживания на конце дорожки-накопителя: плита с вакуумной фиксацией, прокатный
    ролик, привод'
  note: 'Концевая секция дорожки-накопителя (X = 2150, Y = 1500 мм): плита с вакуумной фиксацией пачки,
    обрезиненный ролик (показан в парковочном положении) и привод. Пачка разглаживается до съёма, манипулятор
    берёт уже разглаженную; прокат идёт параллельно предыдущему циклу манипулятора. Размеры плиты, ролика
    и привода условные.'
- pos: 16
  name: Р6. Считыватель станции второй ступени с купольным светом, вне круга вылета
  note: 'Считыватель с купольным осветителем на кронштейне у южной панели (X = 2150, Y = 1800, высота
    1,5 м); смотрит на центр станции под углом около 45°. Вынесен за круг вылета: 743 мм от основания
    при вылете 600 мм — внутри круга кронштейн оказался бы на пути руки. Корпус и кронштейн условные;
    точное положение фиксируется в КД после выбора модели манипулятора.'
- pos: 17
  name: Манипулятор SCARA, 3 кг, вылет 600 мм, пищевое исполнение, со шкафом управления
  note: 'SCARA 3 кг, вылет 600 мм, подвес на портале: основание (X = 2400, Y = 1100), отметка основания
    1500 мм. Три рабочие точки в пределах вылета с запасом 128–139 мм: станция — 472 мм, вход дорожки
    возврата — 461 мм, тара брака — 469 мм. К основной ленте не тянется: пачку на ленту возвращает дорожка
    возврата. Серийное пищевое исполнение SCARA под мойку с вылетом 600 мм у выбранных вендоров не подтверждено
    — запрос поставщикам обязателен; без него класс манипулятора может смениться. Рука на схеме стилизована,
    показан один момент цикла.'
- pos: 18
  name: Вакуумный захват сильфонный пищевой, быстросъёмный, с датчиком удержания
  note: Мягкий вакуумный захват берёт пачку за верхнюю плоскость с контролем удержания (без прокола, разрыва
    и смятия); быстросъёмный, замена без инструмента. На схеме условный габарит над пачкой на станции.
- pos: 19
  name: Портал установки манипулятора
  note: Подвесная установка освобождает зону под станцией и упрощает мойку. Балка на отметке 1900 мм поперёк
    модуля, ноги на Y = 400 и Y = 1750 мм — обе вне круга вылета (700 и 650 мм от основания); у южной
    ноги запас до круга мал (50 мм по оси ноги) — габарит руки и захвата у ноги проверить при выпуске
    КД. Подвес от балки к основанию условный.
- pos: 20
  name: Тара окончательного брака с датчиком заполнения
  note: 'Лоток для пачек, не дочитанных обеими ступенями; датчик заполнения даёт сигнал на световую колонну.
    Выемка — через дверь на блокировке: на время выемки вторая ступень стоит, первая работает. Габарит
    тары и стойка условные.'
- pos: 21
  name: 'Узел возврата пачки в поток: накопительная дорожка на 3 пачки и сводящий модуль с управляемым
    выпуском'
  note: 'В проработке: новый узел, собственная КД. Накопительная дорожка на 3 пачки вдоль основной ленты
    (Y = 1000, X 2750–3250 мм) и сводящий модуль: выпускает пачку на ленту в точке (3250; 700), когда
    трекинг показывает подход свободного промежутка. Рабочая точка манипулятора — вход дорожки (2850;
    1000), 461 мм от основания. Развязывает манипулятор и поток: промежуток образуется раз в 94 с в проектной
    точке, цикл манипулятора — 3,3 с; к основной ленте манипулятор не тянется. Серийный сливной модуль
    для гибкой упаковки пока не искали; выпуск пачки в промежуток проверяется на образцах при заводских
    испытаниях.'
  flag: warn
- pos: 22
  name: 'Шкаф управления нержавеющий: ПЛК, промышленный ПК зрения, коммутатор, ИБП, блоки питания'
  note: 'Шкаф на стороне обслуживания вне зоны прямой мойки (прямая струя на шкаф не допускается). ПЛК
    ведёт цикл, байпас и цепи безопасности; промышленный ПК зрения держит зрение, журнал и рецепты. Габарит
    условный: в листе решения задана только точка установки.'
- pos: 23
  name: Панель оператора 10", русский язык
  note: Панель оператора на русском языке на стойке у шкафа, высота центра 1,45 м. Габарит условный.
- pos: 24
  name: Световая колонна с зуммером
  note: Световая колонна выступает над рамой (до 2,25 м при высоте рамы 1,9 м). Сигнализирует заполнение
    тары брака; зуммер.
- pos: 25
  name: Ограждение модуля — сплошные панели нерж./поликарбонат по периметру рамы, закрытый верх над второй
    ступенью, три двери
  note: 'Весь модуль — один закрытый контур: сплошные панели по периметру рамы высотой 1900 мм; над зоной
    второй ступени (X 1700–3100 мм) верх замкнут сплошной панелью на отметке 1900. Доступ — только через
    три двери на блокировке с удержанием: первая ступень (оптика), станция с дорожкой-накопителем, тара
    брака. Положение дверей на схеме условное: в концепте заданы только их назначения. Продукт входит
    и выходит через два проёма на оси ленты; внутренних окон прохода пачек нет, световой завесы нет. Ограждение
    отнесено от круга вылета на 150 мм (сплошная панель, ГОСТ ISO 13857 табл. 4 дополнительного расстояния
    не требует). Числа — по внутренней выжимке норм, сверить при выпуске КД.'
- pos: 26
  name: Выключатель безопасности с блокировкой двери (удержание, кодированный актуатор)
  note: 'Три выключателя безопасности с блокировкой и удержанием — по одному на дверь: дверь не открыть
    до останова. Положение условное. Требования по ГОСТ ISO 14119 — по внутренней выжимке норм, сверить
    при выпуске КД.'
- pos: 27
  name: Туннельный кожух выходного проёма продукта, 450 мм
  note: 'Кожух выносит проём продукта на 450 мм по ходу ленты и монтируется на конвейер заказчика, пола
    не занимает. До круга вылета манипулятора (X = 3000 мм) от проёма 3850 − 3000 = 850 мм: ГОСТ ISO 13857
    табл. 4 для щели 40–120 мм требует не менее 850 мм. Числа — по внутренней выжимке норм, сверить при
    выпуске КД.'
- pos: 28
  name: Конвейер заказчика на выходе к узлу агрегации (вне поставки)
  note: Оборудование заказчика, в поставку не входит; далее по ходу ленты — узел агрегации. Туннельный
    кожух монтируется на этот конвейер.
notes:
- 'Схема собрана по листу решения (блоки геометрии и расчёта досягаемости) для варианта О+Р. Координаты
  листа — в миллиметрах от левого нижнего угла рамы: X по ходу ленты, Y поперёк, Z вверх. Поток идёт слева
  направо; сторона обслуживания (шкаф, панель оператора, колонна) — сверху на плане, вторая ступень —
  снизу.'
- 'ГАБАРИТ УЧАСТКА — ПРЕДПОЛОЖЕНИЕ. Планировка участка заказчиком не передана. Модуль 3400 × 1850 мм (3850
  мм по ходу ленты с туннельным кожухом) шире допущения 2,5–3,0 × 1,2–1,5 м по обоим размерам: ячейка
  манипулятора с вылетом 600 мм требует не менее 1500 мм в поперечнике. Это риск, его сверяют с планировкой
  первым. Если ширины на участке нет, вторая ступень делается на двухосевом линейном посту с прямоугольной
  рабочей зоной — это другая цена и другая гибкость по номенклатуре.'
- 'Досягаемость манипулятора проверена расчётом по координатам: основание (2400; 1100), вылет 600 мм;
  станция разглаживания — 472 мм, вход дорожки возврата — 461 мм, тара брака — 469 мм от основания, запас
  128–139 мм. Считыватель Р6 вынесен за круг вылета (743 мм). Круг вылета не задевает оптику первой ступени
  (ось Р5 на X = 1640 мм, до западной границы круга 160 мм) и не выходит за ограждение (до южной панели
  150 мм). Проверка в цифровой модели на реальной номенклатуре не выполнена: матрицы форматов и образцов
  пока нет, до неё компоновка остаётся рабочей гипотезой.'
- 'Безопасность обеспечена геометрией, а не программой: сплошные панели по периметру рамы высотой 1900
  мм, верх над второй ступенью (X 1700–3100 мм) замкнут панелью на отметке 1900, три двери на блокировке
  с удержанием, туннельный кожух выходного проёма 450 мм; световой завесы и внутренних окон прохода пачек
  нет. Расстояния 150 мм (до ограждения) и 850 мм (от проёма до круга вылета, ГОСТ ISO 13857, табл. 4)
  взяты из внутренней выжимки норм, а не из первоисточника: сверить при выпуске конструкторской документации.
  Программное ограничение рабочей зоны как мера безопасности не применяется.'
- 'Потоки разведены: отвод остатка идёт по поперечной дорожке (X = 2150 мм, Y 850–1500), возврат дочитанной
  пачки — по отдельной дорожке возврата (Y = 1000 мм, X 2750–3250) на 450 мм восточнее. Манипулятор к
  основной ленте не тянется: пачку на ленту выпускает сводящий модуль в точке (3250; 700), когда трекинг
  показывает подход свободного промежутка.'
- Габариты, которых в листе решения нет (корпуса считывателей, шкаф, панель оператора, захват, плита,
  ролик и привод станции, тара, привод шлюза, толкатель, выключатели, сечения портала и туннеля), приняты
  условно и показаны в масштабе только для взаимного положения. Положение трёх дверей в листе решения
  не задано (только назначение) — на схеме условное. Высота ленты 0,9 м и ширина 0,3 м приняты.
- 'Показан один момент цикла: манипулятор над станцией, шлюз в рабочем положении. Рука стилизована, наклон
  боковых считывателей не показан. В изометрии ближние к зрителю панели ограждения показаны условной высотой
  0,9 м («вырез»), чтобы было видно оборудование, дальние — полной высотой 1,9 м; замкнутый верх над второй
  ступенью — полупрозрачная плита. На плане контур ограждения замкнут.'
- 'Стрелки: тёмная — основной поток пачек (продлён до конца туннельного кожуха); синяя сплошная — отвод
  остатка на вторую ступень; синяя пунктирная — возврат дочитанной пачки в поток; красная — окончательный
  брак в тару. Пути потоков — по листу решения. Светло-оранжевым показан конвейер заказчика (вне поставки),
  янтарным — узел возврата пачки в поток (в проработке).'
- 'Соответствие 12 узлам листа решения (по порядку листа): входной участок с энкодером — поз. 3, 4; стабилизация
  и прижимная лента — 5, 6, 7; узел считывания из пяти ракурсов — 8–12; шлюз и дорожка-накопитель — 13,
  14; манипулятор — 17 (портал 19); станция разглаживания и дочитывания — 15 (считыватель Р6 — 16); вакуумный
  захват — 18; узел возврата пачки в поток — 21; тара окончательного брака — 20 (сигнал заполнения — 24);
  шкаф, ПЛК, ПК зрения и панель оператора — 22, 23; контур безопасности — 25, 26, 27 (отбойная планка
  зева — 6); режим байпаса — шлюз 13 в обесточенном положении «прямой проход» и лента 3 транзитом.'
off_scheme:
- ref: A6
  name: Контроллер стробирования осветителей, 8 каналов
  why: устанавливается в шкафу управления или рядом с оптикой; место в листе решения не задано
