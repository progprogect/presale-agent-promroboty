    в листе решения задана только точка. Пачка на плите — под считывателем Р6.'
  flag: warn
- pos: 19
  name: Р6. Считыватель над постом второй ступени с купольным светом
  note: Дочитывание в двух положениях пачки, поданной манипулятором; купольный свет и поляризация, как
