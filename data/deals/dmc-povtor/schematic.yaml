  title: Изометрия
  file: schematic/iso.svg
- id: plan
  title: Планировка
  file: schematic/plan.svg
- id: side
  title: Вид сбоку
  file: schematic/side.svg
positions:
- pos: 1
  name: Конвейер заказчика на входе в модуль (вне поставки)
  note: 'Оборудование заказчика, в поставку не входит. Планировка участка и параметры его ленты не получены:
    высота ленты 0,9 м и ширина 0,3 м приняты по модулю и подлежат сверке.'
- pos: 2
  name: Рама из нержавеющей стали AISI 304 на колёсах с винтовыми опорами
  note: 'Рама 2,8 × 1,4 × 1,9 м показана каркасом: четыре стойки, верхний и нижний контуры. Колёса, винтовые
    опоры и кожухи первой ступени на схеме не показаны; оборудование стоит внутри габарита рамы.'
- pos: 3
  name: 'Транспортёрный участок 2,8 м: пищевая лента 300 мм, ролики, мотор-редуктор, натяжение'
  note: Лента 0,3 м на высоте 0,9 м (принято, подлежит сверке с планировкой заказчика) во всю длину рамы
    2,8 м; разрыв 60 мм под нижний ракурс — на 1,64 м от входа. Мотор-редуктор и натяжение отдельной геометрии
    не имеют.
- pos: 4
  name: Энкодер инкрементальный 1000 имп/об с муфтой и кронштейном
  note: 'Энкодер на валу ленты у входа: координата каждой пачки ведётся по импульсам.'
- pos: 5
  name: Камера входного контроля (по листу решения и схеме процесса)
  note: 'В проработке: в листе решения и схеме процесса у входа в модуль стоит собственная камера входного
    контроля, а в составе отдельной строки на неё нет: по строке считывателей функцию входного контроля
    выполняет верхний считыватель Р1 («отдельная камера не нужна»). Нужно решение: оставить камеру и добавить
    строку в состав либо убрать её из листа решения и со схемы.'
  flag: warn
- pos: 6
  name: Направляющие стабилизации положения пачки с регулировкой под SKU
  note: Сужающиеся направляющие ставят пачку в известное положение перед прижимной лентой; ширина прохода
    регулируется рецептом под SKU.
- pos: 7
  name: Узел прижимной ленты-разглаживателя с регулировкой усилия и зазора
  note: 'Верхняя лента с регулируемым усилием прижимает пачку к нижней на участке 700 мм; зазор 60–110
    мм. Центр узла: по зоне Z2 листа решения 0,75 м от входа рамы, по точке в перечне позиций — 0,85 м
    (принята зона).'
- pos: 8
  name: Р1. Считыватель сверху с купольным рассеянным светом
  note: Купольный свет и скрещённая поляризация — приём против блика на металлизированной плёнке. Р1 выполняет
    и функцию входного контроля «прочитан или нет».
- pos: 9
  name: Р2. Считыватель сбоку под 45° с поляризованным светом
  note: 'Наклон на схеме не показан (объёмы без поворота по горизонтали): считыватель смотрит на точку
    над лентой под 45°.'
- pos: 10
  name: Р3. Считыватель сбоку под 45° с поляризованным светом
- pos: 11
  name: Р4. Считыватель сверху с низкоугловым кольцевым светом
  note: Низкоугловой свет выявляет рельеф залома. Кольцо на высоте 0,96 м регулируется по толщине пачки
    (50–90 мм).
- pos: 12
  name: Р5. Считыватель снизу через разрыв ленты 60 мм
  note: 'Нижний ракурс закрывает пачки, легшие кодом вниз: ориентация пачки на ленте — незакрытая вводная,
    нижний ракурс снимает этот риск.'
- pos: 13
  name: Шлюз отвода остатка, пневматический поворотный
  note: 'Показан в обесточенном положении «прямой проход»: по умолчанию пачки идут транзитом, а при отказе
    или обслуживании комплекса линия не останавливается (режим байпаса). Пневмопривод и положение планки
    схематичны.'
- pos: 14
  name: Дорожка-накопитель 1,2 м на 8 пачек
  note: 'В проработке: положение. По принятой геометрии пост разглаживания и считыватель Р6 стоят внутри
    габарита дорожки (1,2 × 0,3 м), а линия возврата идёт по самой дорожке. Участок подхода от шлюза до
    дорожки (0,3 × 0,55 м) в составе отдельной строкой не выделен и показан как часть дорожки. Высота
    дорожки принята равной высоте ленты 0,9 м. Ёмкость 8 пачек на 1,2 м верна при шаге до 150 мм (пачки
    шириной до 140 мм поперёк дорожки); для пачек шириной 200 мм поместится около 5 (оценка по принятому
    диапазону форматов).'
  flag: warn
- pos: 15
  name: Манипулятор SCARA, 3 кг, вылет 500–600 мм, пищевое исполнение, со шкафом управления
  note: 'В проработке: досягаемость. Основание манипулятора (2,25; 1,75 м от угла рамы) удалено от точки
    возврата на ленту (2,10; 0,70 м) на 1,06 м при вылете 0,5–0,6 м: до ленты манипулятор не достаёт.
    Конец дорожки-накопителя (2,90; 1,55 м) — в 0,68 м, за пределом вылета 0,6 м; тара (2,75; 2,00 м)
