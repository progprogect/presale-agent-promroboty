# Карточка сделки для портала (конечный заказчик НЕ указывается — только кодовое имя)
slug: dmc-povtor
code: ДМК-ПОВТОР
title: Узел повторного считывания кодов маркировки
version: концепция v1
updated: "2026-10-08"
status: черновик
note: >-
  Встраиваемый модуль повторного считывания кодов Data Matrix на пачках фасованной продукции
  в гибкой упаковке, с возвратом пачки в поток.
context: >-
  На линии фасовки часть кодов Data Matrix не читается с первого раза: блик на металлизированной
  плёнке, залом или складка, неудачная ориентация пачки, дефект печати. Поток 50–90 пачек в минуту,
  режим 24 часа в сутки. Нужен модуль, который дочитывает такие пачки и возвращает их в поток
  без нарушения учёта, а окончательно нечитаемые выводит в тару с записью события.
  Проработаны три варианта. Рекомендуемый — двухступенчатый: неподвижный узел считывания из пяти
  ракурсов (купольный свет, скрещённая поляризация, низкоугловой свет, нижний ракурс через разрыв
  ленты) плюс прижимная лента, разглаживающая плёнку на ходу; и компактный манипулятор второй
  ступени, который работает только с остатком — снимает пачку, прокатывает зону кода роликом,
  дочитывает и возвращает в поток. Манипулятор загружен на единицы процентов: он стоит
  в комплексе ради процента дочитывания, а не ради производительности.
  Главный критерий выбора по заданию — совокупная стоимость владения за 5 лет.
questions:
  questions:
    - Предположения — какое из них вы считаете неверным? Жёлтые строки проверяйте первыми.
    - Распределение причин несчитывания (блик, залом, дефект печати) принято гипотезой, заказчик
      его не подтверждал. Насколько такая пропорция правдоподобна по вашему опыту?
    - Цена ошибки — где мы занизили риск, а где перестраховались?
  process:
    - Последовательность — что идёт не в том месте потока, где происходит на самом деле.
    - Параллельность — что мы считаем одновременным зря, а что можно совместить.
    - Граница поставки — верно ли показано, что делает оборудование заказчика и что человек.
  solution:
    - Узлы — что лишнее, чего не хватает, что решается проще.
    - Пять ракурсов считывания — достаточно ли их и правильно ли подобраны схемы освещения?
    - Разглаживание плёнки прижимной лентой на ходу — рабочая ли идея, не помнёт ли пачку?
    - Отклонённые варианты — какой отбросили зря и почему.
    - Границы применимости — что ещё всплывёт на приёмке и здесь не названо.
  wbs:
    - Полнота — какие работы, этапы или зависимости пропущены?
    - Часы — где оценка нереалистична (мало или много)? Поправьте кнопками и коротко напишите почему.
    - Этап 1 (испытания оптики на образцах) и этап 4 (зрение и прикладное ПО) — это половина
      проекта по часам. Хватит ли заложенного, чтобы подтвердить обещанный процент дочитывания?
    - Риски — что может сорвать сроки или объём и не отражено в пакетах?
  bom:
    - Состав — чего не хватает, что лишнее?
    - Считыватели Data Matrix — главная неопределённость спецификации. Какой класс прибора нужен,
      чтобы читать повреждённые коды на металлизированной плёнке на скорости 450 мм/с?
    - Выбор — надёжны ли предложенные каналы поставки и альтернативы по вендору?
    - Цена и срок — где дешевле или быстрее? Впишите в правую колонку.
    - Риски — поставки, совместимость, ресурс.
notes:
  questions: >-
    Жёлтое — принятые нами предположения с основанием; красное — вопросы заказчику.
    Заказчик на эти вопросы пока не отвечал: работа ведётся на предположениях, и каждое из них
    дойдёт до предложения оговоркой или границей применимости.
  process: >-
    Времена — на одну пачку. Шаги первой ступени проходит весь поток, шаги второй ступени —
    только пачки с несчитанным кодом, по гипотезе около 2 % потока, из них на манипулятор
    попадает примерно треть.
  solution: >-
    Это черновик раздела предложения «Почему именно такая компоновка». Габарит модуля шире
    принятого допущения по планировке участка — расхождение зафиксировано в границах применимости
    и сверяется с планировкой заказчика при первой возможности.
  wbs: >-
    Основания часов: 14 пакетов по аналогу со ссылкой на прошлый проект, 12 по нормативу,
    40 экспертно с трёхточечной оценкой. Доля экспертных высока — сопоставимого закрытого
    проекта по машинному зрению в базе норм времени пока нет. Резерв 12 % применён к итогу,
    а не к каждой строке.
  bom: >-
    Цены — закупка в BYN без наценки, по большей части оценки до ответов поставщиков.
    Крупнейшая неопределённость — класс считывателя Data Matrix: разброс по шести позициям
    даёт около четверти стоимости проекта. Позиции «собственная КД» — только материалы
    и покупные детали, без работ.
