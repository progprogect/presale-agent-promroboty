# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
deal: повторное считывание кодов Data Matrix на пачках фасованной продукции
variant: О+Р — многоракурсный оптический узел плюс манипулятор второй ступени
stage: concept
author: layout
updated: '2026-10-08'
summary: 'Комплекс встраивается в разрыв конвейера выше узла агрегации и работает в две ступени. Весь
  модуль — один закрытый агрегат: ограждение по периметру рамы, продукт входит и выходит через проёмы,
  людям внутрь хода нет. Первая ступень неподвижна и обрабатывает весь поток на полной скорости линии
  — пачка выравнивается направляющими, проходит под прижимной лентой, которая разглаживает плёнку в зоне
  кода, и попадает в узел считывания из пяти ракурсов: купольный рассеянный свет сверху, два боковых под
  45° со скрещённой поляризацией, низкоугловой свет на заломы и нижний ракурс через разрыв ленты для пачек,
  легших кодом вниз. Все пять срабатывают по одному импульсу энкодера, решение по пачке принимается по
  первому успешному декодированию. Этот же узел служит входным контролем «прочитан код или нет» — отдельной
  камеры на входе в модуль нет. Вторая ступень работает только с остатком — теми пачками, которые не взяла
  оптика: шлюз уводит их на короткую поперечную дорожку-накопитель, концевая секция которой и есть станция
  активного разглаживания: пачка фиксируется вакуумом, ролик прокатывает зону кода, считыватель Р6 делает
  первую попытку. Манипулятор берёт уже разглаженную пачку, подаёт её под считыватель ещё в двух положениях
  и кладёт либо на дорожку возврата, либо в тару. Дорожка возврата — накопительная, на три пачки: сводящий
  модуль выпускает пачку на основную ленту тогда, когда к точке слияния подходит свободный промежуток,
  и манипулятор не ждёт этого момента с пачкой в захвате. Слияние идёт выше точки агрегации; недочитанная
  пачка уходит в тару с записью события и фотографией. Манипулятор по такту не нагружен практически никогда
  — при проектной точке 2 % несчитанных и потоке 70 пачек/мин на него приходит одна пачка примерно раз
  в полторы минуты. Он стоит в комплексе не ради производительности, а ради процента дочитывания.'
key_figures:
  takt_line: 90 пачек/мин — максимальная скорость линии по заданию
  takt_optics: оптический узел не является ограничением по такту ни при какой скорости линии из задания
  takt_robot: 3,3 с на пачку, практическая производительность одного манипулятора 15,5 пачек/мин
  robot_load_design_point: 0,64 пачки/мин при 2 % несчитанных и потоке 70/мин — загрузка 4 %
  expected_read_rate: 88–93 % от потока несчитанных с исправно нанесённым кодом (оценка, гипотеза Q5)
  module_footprint: рама 3400 × 1850 мм, высота 1900 мм; занимаемая по ходу ленты длина 3850 мм (рама
    плюс выходной туннельный кожух 450 мм на конвейере заказчика)
nodes:
- name: Входной участок с энкодером
  what: принимает пачки с конвейера заказчика и ведёт координату каждой пачки по импульсам энкодера до
    выхода из модуля
  why: 'трекинг по энкодеру — требование п. 4.3 задания и основа всей логики: по нему работают шлюз, укладка
    манипулятора и выпуск со сводящего модуля. Отдельной камеры входного контроля на этом участке НЕТ:
    решение «прочитан код или нет» принимает сам узел считывания из пяти ракурсов ниже по потоку, и принимает
    его на уже стабилизированной и разглаженной пачке — то есть точнее, чем камера до стабилизации. Независимость
    от чужого ПО маркировки (вводная Q15) при этом сохраняется полностью: источник сигнала «не считан»
    — наш'
- name: Узел стабилизации и прижимная лента-разглаживатель (собственная КД)
  what: сужающиеся направляющие ставят пачку в известное положение, верхняя лента с регулируемым усилием
    прижимает пачку к нижней на участке 700 мм и разглаживает плёнку перед считыванием
  why: это единственный узел, который лечит заломы без манипулятора и на полной скорости линии. Покупного
    серийного «разглаживателя пачки-подушки» не найдено — делаем свою КД. Усилие ограничивается по газонаполненной
    пачке, значение подтверждается на образцах при FAT
- name: Узел считывания из пяти ракурсов
  what: 'Р1 сверху с купольным рассеянным светом, Р2 и Р3 сбоку под 45° со скрещённой поляризацией, Р4
    сверху с низкоугловым светом, Р5 снизу через разрыв ленты 60 мм; все по общему триггеру. Этот же узел
    выполняет функцию входного контроля: прочиталось — пачка идёт транзитом, не прочиталось — шлюз ниже
    по потоку уводит её на вторую ступень'
  why: купольный свет и скрещённая поляризация — отраслевой приём против блика на металлизированной плёнке
    (подтверждено — Lumimax, Roder Vision); низкоугловой свет выявляет рельеф залома; нижний ракурс закрывает
    пачки, легшие кодом вниз, — без него теряется половина потока при неопределённой ориентации. Пять
    ракурсов — минимум, покрывающий все четыре названные в задании причины, кроме дефекта печати
- name: Шлюз отвода остатка и дорожка-накопитель (собственная КД)
  what: пневматический поворотный шлюз на X = 2150 уводит непрочитанную пачку на поперечную дорожку длиной
    650 мм, которая держит 3–5 пачек в зависимости от формата
  why: 'развязывает первую и вторую ступени — манипулятор работает в своём темпе и не держит линию. Глубина
    накопителя сокращена с 1,2 м до 650 мм осознанно: во всех рабочих точках матрицы производительность
    манипулятора (15,5 пачек/мин) выше притока на вторую ступень (максимум 8,3 пачки/мин при 20 % несчитанных
    и 90 пачках/мин), поэтому накопитель в установившемся режиме не заполняется и нужен только на всплеск.
    Положение шлюза определено геометрией: западная граница круга вылета манипулятора проходит по X =
    1800, а крайняя точка оптики первой ступени — X = 1640'
- name: Компактный манипулятор, 3 кг, вылет 600 мм, пищевое исполнение
  what: снимает разглаженную пачку со станции мягким вакуумным захватом, подаёт её под считыватель Р6
    ещё в двух положениях и кладёт либо на дорожку возврата, либо в тару окончательного брака. Основание
    на портале в точке 2400/1100/1500; все три рабочие точки лежат в пределах 472 мм при вылете 600 мм
    — запас не менее 128 мм
  why: 'класс выбран по нагрузке, а не по скорости — пачка 150 г плюс захват 0,8 кг это 1 кг, берём 3
    кг с троекратным запасом по заданию. Загрузка узла единицы процентов, поэтому дорогая дельта избыточна;
    SCARA дешевле и достаточен. Вылет зафиксирован 600 мм, а не «500–600»: при 500 мм запас до рабочих
    точек падает до 28 мм, что для концепта недопустимо. Альтернатива — собственный двухосевой линейный
    пост вместо робота: он дешевле и, что важнее после пересчёта компоновки, требует вдвое меньшей ячейки,
    потому что его рабочая зона прямоугольная, а не круговая (см. variants.md, разд. 9)'
- name: Станция активного разглаживания и дочитывания на конце дорожки-накопителя (собственная КД)
  what: 'концевая секция дорожки: плита с вакуумной фиксацией пачки и обрезиненный ролик, который прокатывает
    зону кода; считыватель Р6 на кронштейне южнее станции смотрит на неё под 45° и делает первую попытку
    дочитывания ещё до съёма'
  why: 'прокат по плите восстанавливает геометрию символа там, где прижимная лента не справилась — у второй
    ступени на одну пачку есть 3,3 с вместо 0,7 с на ленте. Станция совмещена с концом дорожки, а не вынесена
    отдельной точкой: так манипулятор берёт уже разглаженную пачку (её проще и безопаснее держать вакуумом),
    из цикла уходит лишняя пара «положил — взял», а прокат идёт параллельно предыдущему циклу манипулятора.
    Р6 вынесен за круг вылета: внутри круга кронштейн считывателя оказывается на пути руки. Серийного
    изделия с такой функцией не найдено, это собственная КД'
- name: Вакуумный захват сильфонный, пищевое исполнение, быстросъём (собственная КД)
  what: берёт пачку за верхнюю плоскость сильфонными присосками с регулируемым разрежением и контролем
    удержания, снимается без инструмента
  why: требование задания п. 4.2 — ни прокола, ни разрыва, ни нарушения шва, ни смятия; сильфон компенсирует
    неровность газонаполненной пачки. Покупные присоски, оснастка своя
- name: Узел возврата пачки в поток — дорожка возврата на 3 пачки со сводящим модулем (собственная КД)
  what: манипулятор кладёт дочитанную пачку на короткую накопительную дорожку вдоль основной ленты; сводящий
    модуль выпускает её на ленту в точке 3250/700, когда трекинг показывает подход свободного промежутка.
    Система подтверждает событие возврата по коду и снимает отметку «изъята»
  why: 'прямого требования к порядку пачек в коробе НЕ НАЙДЕНО (вводная Q9; формулировка ослаблена нормоконтролем
    08.10.2026, находка Н5 — раньше здесь стояло «подтверждено»). Значение имеет связь «код пачки → код
    короба» и отсутствие двойного учёта, поэтому возврат в любой свободный промежуток выше точки агрегации
    принимается корректным. Но промежуток появляется только тогда, когда шлюз изымает очередную пачку,
    а это в проектной точке раз в 94 секунды, тогда как цикл манипулятора — 3,3 с. Без буфера манипулятор
    держал бы пачку в захвате до полутора минут: вакуум подтекает, газонаполненная пачка мнётся, вторая
    ступень стоит. Дорожка возврата развязывает эти два темпа. Промежутков по счёту всегда не меньше,
    чем возвратов, поэтому дорожка на три пачки не переполняется; если переполнится — шлюз перестаёт отводить
    и комплекс деградирует к варианту О'
- name: Тара окончательного брака с датчиком заполнения
  what: лоток для пачек, не дочитанных обеими ступенями; датчик уровня, световой и звуковой сигнал, запись
    события с фотографией
  why: требование задания п. 4.5. Пачка с неподтверждённым кодом в поток не возвращается никогда — это
    условие критерия «ошибки учёта равны нулю»
- name: Шкаф управления, ПЛК, HMI и промышленный ПК зрения
  what: ПЛК ведёт цикл, байпас и цепи безопасности; промышленный ПК держит зрение, журнал и рецепты; HMI
    10 дюймов на русском языке
  why: разделение обязательно — зрение и журнал на год требуют вычислителя и диска, логика линии и безопасность
    требуют детерминированного ПЛК. Обмен с системой заказчика по Modbus TCP с квитированием (вводная
    Q8)
- name: Контур безопасности
  what: 'модуль закрыт целиком: сплошное ограждение по периметру рамы, над зоной второй ступени верх замкнут
    панелью на отметке 1900. Доступ — только через три двери на блокировке с удержанием (оптика первой
    ступени, станция с дорожкой-накопителем, тара брака). Продукт входит и выходит через два проёма; на
    выходном стоит туннельный кожух 450 мм, на входном — отбойная планка в зеве прижимной ленты. Аварийный
    стоп, световая колонна'
  why: 'манипулятор — единственный источник опасности, требующий PL d, но безопасность у него обеспечена
    ГЕОМЕТРИЕЙ, а не программой: ограждение отнесено от круга вылета на 150 мм, верх замкнут, и расстояние
    от любого проёма до круга вылета не меньше 850 мм — требование ISO 13857 табл. 4 для щели 40–120 мм.
    Световой завесы в составе НЕТ: при прежней компоновке через одно окно шли и подача, и возврат, пачки
    проходили сквозь завесу, и это потребовало бы шунтирования (мьютинга) — то есть штатного отключения
    защиты много раз в смену. Закрытый контур снимает вопрос целиком. Программное ограничение рабочей
    зоны манипулятора как мера безопасности НЕ применяется: сертифицированная функция ограничения зоны
    у Inovance и ESTUN не подтверждена, и опираться на неподтверждённую функцию в контуре PL d нельзя.
    Этим закрыты оба несоответствия, найденные нормоконтролем 08.10.2026: выход рабочей зоны манипулятора
    за ограждение и нерабочая световая завеса на окне, через которое непрерывно идут пачки'
- name: Режим байпаса
  what: при отказе или обслуживании комплекса шлюз встаёт в положение «прямой проход», лента работает
    транзитом, несчитанные пачки разбираются вручную как сегодня
  why: требование задания п. 4.8. Байпас механический и обесточенный по умолчанию — линия не останавливается
    ни при отказе комплекса, ни при потере питания шкафа
rejected:
- option: Манипулятор на весь поток несчитанных, без оптической ступени (вариант Р из задания)
  why: реализованных аналогов узла «робот снимает пачку, дочитывает и возвращает в поток» не найдено ни
    в русских, ни в английских, ни в немецких, ни в итальянских источниках (поиск 08.10.2026) — тогда
    как многоракурсные узлы считывания серийны. Манипулятор не даёт более высокого процента дочитывания,
    чем оптика плюс манипулятор, но стоит дороже и приносит с собой контур безопасности, риск повреждения
    пачки и обслуживаемый механический узел в пищевой зоне
- option: Только оптика, без второй ступени (вариант О)
  why: по принятой гипотезе причин несчитывания оптика снимает 65–70 % потока несчитанных, а критерий
    задания — не менее 95 % от исправно нанесённых. Разрыв закрывается только активным разглаживанием,
    которого на полной скорости ленты не сделать
- option: Дельта-робот вместо SCARA во второй ступени
  why: загрузка второй ступени единицы процентов; скорость дельты в этой задаче не востребована, а цена
    и сложность пищевого исполнения выше
- option: Увеличение числа ракурсов с пяти до восьми
  why: шестой и последующие ракурсы добавляют уже менее процента считывания — причины, которые лечатся
    ракурсом, закрываются первыми пятью. Дешевле и результативнее вложить те же деньги в разглаживание
- option: Отказаться от нижнего ракурса, предполагая постоянную ориентацию пачки кодом вверх
  why: ориентация пачки на ленте — незакрытая вводная Q1 со статусом «предположение». Нижний ракурс стоит
    около одной двадцатой стоимости комплекса и снимает риск, который иначе обнаружится только на SAT
- option: Манипулятор с увеличенным вылетом (1000–1200 мм) вместо перекомпоновки зоны
  why: 'прямой способ закрыть недостачу вылета — взять руку длиннее. Отклонён: SCARA с вылетом 1000–1200
    мм это другой класс по массе и цене (оценка плюс 15–25 тыс. BYN и втрое большая масса на портале),
    а главное — круг вылета растёт квадратично, и ячейка вокруг него выросла бы с 1,5 м до 2,8 м в поперечнике.
    Платить больше за то, чтобы занять больше места, при загрузке узла 4 % смысла нет'
- option: Перенос основания манипулятора ближе к ленте, чтобы он клал пачку прямо в поток
  why: 'геометрически работает, но тогда круг вылета накрывает участок основной ленты, по которому идёт
    весь поток, и этот участок становится опасной зоной: рука выходит за линию ограждения в окно возврата.
    Закрыть окно нечем — через него идёт продукт; световая завеса потребовала бы шунтирования на каждой
    пачке. Отклонено в пользу дорожки возврата со сводящим модулем: манипулятор остаётся целиком внутри
    закрытого контура'
- option: Компоновка «в линию», 4200 × 1400 мм (фигурировала в концепте как альтернатива)
  why: ОТОЗВАНА как неосуществимая. Ячейка манипулятора с вылетом 600 мм требует не менее 1500 мм в поперечнике
    (круг вылета 1200 мм плюс по 150 мм до ограждения с каждой стороны), поэтому в ширину 1400 мм вторая
    ступень не помещается ни при каком расположении. Узкая компоновка возможна только с двухосевым линейным
    постом вместо SCARA — у него рабочая зона прямоугольная (см. variants.md, разд. 9)
- option: Замена промышленных считывателей на собственный декодер на обычных камерах
  why: алгоритмы декодирования повреждённых символов — это как раз то, за что платят в серийном считывателе,
    и своя разработка здесь уступит. Собственный декодер остаётся как альтернатива по цене и доступности
    (см. variants.md, разд. 10), но базовым не предлагается
proof:
- расчёт по разделу 3 задания выполнен на всю матрицу 50/70/90 пачек/мин и 2/5/10/20/100 % несчитанных
  — таблица в variants.md, разд. 6
- такт оптического узла проверен расчётом — при 90 пачках/мин и шаге 300 мм лента идёт 450 мм/с; бюджет
  смаза в один пиксель при разрешении 0,04 мм/пиксель даёт выдержку до 89 мкс, что лежит в рабочем диапазоне
  стробируемых осветителей
- загрузка манипулятора посчитана на всех точках матрицы; ни в одной рабочей точке (до 20 % несчитанных
  при 90 пачках/мин) второй манипулятор не требуется
- 'досягаемость манипулятора проверена расчётом по координатам (блок reach_check): от основания 2400/1100
  до станции разглаживания 472 мм, до дорожки возврата 461 мм, до тары 469 мм при вылете 600 мм — запас
  не менее 128 мм на каждой точке. Прежняя геометрия проверки не проходила: две рабочие точки из трёх
  лежали за пределом вылета (1061 и 680 мм)'
- 'безопасные расстояния проверены по ГОСТ ISO 13857-2012: ограждение отнесено от круга вылета на 150
  мм (сплошная панель, табл. 4 дополнительного расстояния не требует), выходной проём продукта отнесён
  от круга вылета на 850 мм туннельным кожухом 450 мм (табл. 4, щель 40–120 мм), перегиб через верх исключён
  замкнутой панелью над второй ступенью (табл. 2 не применяется). Числа взяты из внутренней выжимки норм
  — при выпуске КД сверить по первоисточнику'
- габарит модуля сведён с принятым допущением по планировке (вводная Q7) — расхождение зафиксировано в
  разделе границ применимости
- детальная проверка досягаемости, коллизий и такта второй ступени на реальной номенклатуре (правило 7
  CLAUDE.md) НЕ ВЫПОЛНЕНА — нет матрицы SKU и образцов. Выполняется после их получения, до сборки ТКП
limits:
- Доля несчитанных кодов принята 2 % расчётной точкой (вводная Q4, предположение). Фактическая статистика
  заказчиком не предоставлена. При доле выше 20 % при потоке 90 пачек/мин требуется второй манипулятор;
  при доле 100 % задача решается не комплексом, а остановкой линии и ремонтом принтера маркировки
- Распределение причин несчитывания принято 40 % блик и ориентация, 40 % залом и складка, 20 % дефект
  печати (вводная Q5, предположение). Это ГИПОТЕЗА, а не измеренная величина, и именно она определяет
  обещанный процент дочитывания. При доле заломов выше 60 % результат падает на 3–5 процентных пунктов,
  при доле ниже 20 % вторая ступень экономически не нужна вовсе
- Код, у которого краска осыпалась на сгибе, разглаживанием не восстанавливается — разглаживание возвращает
  геометрию символа, но не утраченные модули. Избыточность ECC200 терпит примерно четверть повреждённых
  модулей, дальше символ не декодируется ничем. Поэтому критерий «не менее 95 % дочитывания при исправно
  нанесённом коде» выполним только при определении «исправно нанесённого» через сохранность символа, а
  не через факт нанесения — формулировка для ПМИ в variants.md, разд. 7
- Пачки с дефектом печати (по гипотезе 20 % потока несчитанных) не дочитываются ни одним вариантом и штатно
  уходят в тару на перемаркировку
- Номенклатура принята по крайним форматам из текста задания — пачка-подушка 60–150 г, габариты ориентировочно
  от 160×110×50 до 300×200×90 мм (вводная Q1, предположение). Матрица SKU не получена. Форматы вне этого
  диапазона требуют пересчёта оснастки и поля зрения
- 'Планировка участка не получена (вводная Q7, предположение). После пересчёта компоновки вариант О+Р
  занимает 3400 × 1850 мм по раме и 3850 мм по ходу ленты с учётом выходного туннельного кожуха. Это шире
  принятого допущения 1,2–1,5 м на 2,5–3,0 м по обоим размерам. Узкой компоновки «в линию» 4200 × 1400
  мм, которая раньше предлагалась как альтернатива, НЕ СУЩЕСТВУЕТ: ячейка манипулятора с вылетом 600 мм
  требует не менее 1500 мм в поперечнике. Если по планировке ширины нет, вторая ступень делается на двухосевом
  линейном посту с прямоугольной рабочей зоной — это другая цена и другая гибкость по номенклатуре. Это
  первое, что надо сверить с планировкой'
- Высота опасной зоны манипулятора принята не выше 1600 мм (подвес на портале, отметка основания 1500).
  Если выбранная модель окажется выше, при вскрытом на мойку верхе ограждения потребуется высота панелей
  2200 мм вместо 1900 — это уточняется после выбора модели
- 'Возврат пачки в поток идёт через накопительную дорожку на 3 пачки со сводящим модулем, который ждёт
  свободного промежутка в потоке. Промежуток образуется изъятием пачки шлюзом, поэтому промежутков по
  счёту всегда не меньше, чем возвратов. Предположение: порядок пачек в коробе значения не имеет — прямого
  требования не найдено, подтверждения тоже (вводная Q9, находка нормоконтроля Н5). При послойной или
  позиционной агрегации и при требовании вернуть пачку на её собственное место схема возврата не работает'
- Ёмкость дорожки-накопителя 3–5 пачек зависит от формата (шаг по дорожке равен размеру пачки по ходу).
  Расчёт показывает, что в установившемся режиме она не заполняется ни в одной точке матрицы, но на всплеск
  несчитанных глубины хватает примерно на 10 секунд, после чего комплекс штатно деградирует к режиму варианта
  О. Матрица SKU не получена, шаг по дорожке — оценка
- 'Манипулятор работает над участком движущейся ленты (x 1800–3000): столкновение с проходящей пачкой
  исключается трекингом по энкодеру, а не механически. Это функциональная, а не защитная мера — она защищает
  продукт, а не человека; человек в зону не попадает, контур закрыт'
- Обмен с системой заказчика принят по Modbus TCP или TCP-сокету с квитированием (вводная Q8, предположение).
  Модели автоматов, принтера, камеры и поставщик ПО верхнего уровня не названы
- Схема агрегации принята потоковой (вводная Q9). При послойной или позиционной агрегации алгоритм возврата
  требует пересмотра
- Санитарное исполнение заложено IP65 на узлы в зоне мойки при минимуме IP54 по заданию (вводная Q14).
  Прямая струя на шкаф управления не допускается
- Проверка компоновки в цифровой модели на реальной номенклатуре (правило 7) не выполнена — нет матрицы
  SKU и образцов пачек. До её выполнения компоновка остаётся рабочей гипотезой
