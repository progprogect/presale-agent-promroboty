# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
roles:
- КД
- АСУ
- ПО
- ЭЛ
- МЕХ
- ГИП
role_names:
  КД: чертежи, расчёты, документация
  АСУ: ПЛК, HMI, программирование робота, безопасность
  ПО: алгоритмы, зрение, прикладные программы, интеграция
  ЭЛ: шкаф, электропроект, электромонтаж
  МЕХ: изготовление, сборка, монтаж
  ГИП: план, закупка, согласования, сертификация, сдача
stages:
- name: 1. Инженерная проработка оптики и испытания на образцах
  note: Этап, которого нет в классической ячейке и без которого обещанный процент дочитывания — пустое
    число. Именно здесь гипотеза Q5 превращается в измеренную величину.
  tasks:
  - id: '1.1'
    name: Приёмка образцов и построение эталонной выборки
    result: размеченная выборка не менее 200 изображений несчитанных пачек с разбивкой по четырём причинам
    basis:
      type: expert
      est: 10/16/24
    hours:
      ПО: 16
  - id: '1.2'
    name: Лабораторный стенд оптики, подбор света и поляризации
    result: протокол подбора схемы освещения с замерами класса кода по ISO/IEC 15415 на каждой схеме
    basis:
      type: expert
      est: 20/32/48
    hours:
      ПО: 32
  - id: '1.3'
    name: Сравнительное испытание считывателей-кандидатов
    result: протокол сравнения 2–3 моделей на образцах, выбранная модель и доля дочитывания по группам
      причин
    basis:
      type: expert
      est: 16/24/36
    hours:
      ПО: 24
  - id: '1.4'
    name: Расчёт оптической схемы под скорость ленты
    result: расчётная записка — поле зрения, разрешение на модуль, выдержка, мощность строба, глубина
      резкости
    basis:
      type: norm
      ref: ISO/IEC 15415 и ISO/IEC 29158 (AIM DPM); бюджет смаза ≤1 пикселя
    hours:
      ПО: 16
  - id: '1.5'
    name: Испытание узла разглаживания на образцах
    result: протокол испытаний прижимной ленты — допустимое усилие, влияние на газонаполненную пачку и
      шов
    basis:
      type: expert
      est: 14/24/38
    hours:
      КД: 16
      ПО: 8
  - id: '1.6'
    name: Формулировка гарантируемого процента дочитывания для ПМИ и договора
    result: выпущена одностраничная справка — гарантируемая цифра, знаменатель, метод подсчёта и условия
      её действия; текст готов к переносу в ПМИ и в раздел гарантий договора
    basis:
      type: expert
      est: 6/8/12
    hours:
      ПО: 8
    note: Измерение доли дочитывания по группам причин делается в 1.3 и здесь не повторяется — пакет только
      переводит измеренное в договорную формулировку (З-5 аудита 09.10)
  - id: '1.7'
    name: Разбор матрицы SKU и проверка решения на всей номенклатуре
    result: таблица проверки по каждому формату — поле зрения, зона кода, параметры захвата, рецепт; форматы
      вне границ применимости выделены отдельно
    basis:
      type: expert
      est: 14/24/34
    hours:
      КД: 8
      ПО: 16
  - id: '1.8'
    name: 'Проверка компоновки расчётом: досягаемость, коллизии, цикл'
    result: протокол проверки — три рабочие точки второй ступени в пределах вылета с запасом, коллизий
      нет, цикл 3,3 с подтверждён на крайних форматах
    basis:
      type: expert
      est: 16/24/32
    hours:
      КД: 16
      АСУ: 8
    note: 'Правило 7 CLAUDE.md: компоновка подтверждается расчётом, а не мнением. В прежней редакции сметы
      часов на эту проверку не было.'
  - id: '1.9'
    name: Получение демо-образцов считывателей и осветителей под возврат
    result: на руках 2–3 считывателя-кандидата и комплект осветителей с письменно согласованным сроком
      возврата и условиями; приборы оприходованы и застрахованы на время испытаний
    basis:
      type: expert
      est: 4/8/14
    hours:
      ГИП: 8
    note: 'Пакеты 1.2 и 1.3 испытывают приборы, которых нет ни в составе, ни в часах. Базово берём демо
      под возврат — у Hikrobot и Keyence это штатная практика. Если ни один поставщик демо не даст, приборы
      придётся купить: риск 0…15 000 BYN, показан отдельной строкой в смете (З-4 аудита 09.10)'
- name: 2. Конструкторская документация
  tasks:
  - id: '2.1'
    name: Компоновка модуля и увязка с линией
    result: чертёж общего вида, план встройки в разрыв конвейера, схема подводов
    basis:
      type: analog
      ref: 'П1, wbs_portal.yaml: Э3-35 «Общий сборочный чертёж ячейки» (КД 12) + Э3-36 «Монтажный чертёж
        на площадке: привязка к станку, трассы, анкеры» (КД 14) = 26 ч; у Онеги модуль врезается в действующий
        конвейер, добавлена схема подводов — 32 ч'
    hours:
      КД: 32
  - id: '2.2'
    name: Рама из нержавеющей стали на колёсах с винтовыми опорами
    result: выпущен сборочный чертёж рамы со спецификацией, конструкция без карманов под мойку
    basis:
      type: analog
      ref: 'П1: Э3-20 «Рама подающей секции 3,6 × 1,0 м: сварной узел, деталировка, регулируемые опоры»
        (КД 16) + Э3-23 «Сборочный чертёж секции, спецификация» (КД 8) = 24 ч; у Онеги добавлены обшивка,
        колёса и гигиеническое исполнение без карманов — 36 ч'
    hours:
      КД: 36
  - id: '2.3'
    name: Транспортёрный участок с энкодером
    result: выпущен сборочный чертёж транспортёра — привод, натяжение, установка энкодера, разрыв под
      нижний ракурс
    basis:
      type: expert
      est: 24/36/52
    hours:
      КД: 36
  - id: '2.4'
    name: Узел прижимной ленты-разглаживателя (собственная КД)
    result: выпущен сборочный чертёж узла с регулировкой усилия и зазора, расчёт привода
    basis:
      type: expert
      est: 20/32/48
    hours:
      КД: 32
  - id: '2.5'
    name: Крепление и юстировка пяти считывателей
    result: выпущены чертежи регулируемых кронштейнов и кожухов оптики с защитой от пыли
    basis:
      type: expert
      est: 16/24/36
    hours:
      КД: 24
  - id: '2.6'
    name: Нижний ракурс — разрыв ленты со смотровым окном и обдувом
    result: выпущен чертёж узла нижнего ракурса с обдувом окна от крахмальной пыли
    basis:
      type: expert
      est: 14/20/28
    hours:
      КД: 20
  - id: '2.7'
    name: Шлюз отвода остатка и дорожка-накопитель
    result: выпущен сборочный чертёж шлюза и накопителя на 8 пачек со спецификацией
    basis:
      type: expert
      est: 16/24/36
    hours:
      КД: 24
  - id: '2.8'
    name: Пост активного разглаживания и дочитывания (собственная КД)
    result: выпущен сборочный чертёж поста — плита с вакуумной фиксацией, прокатный ролик, привод
    basis:
      type: expert
      est: 20/28/40
    hours:
      КД: 28
  - id: '2.9'
    name: Вакуумный захват сильфонный пищевой, быстросъём (собственная КД)
    result: выпущен чертёж захвата со спецификацией присосок и расчётом удерживающего усилия
    basis:
      type: analog
      ref: 'П1: Э3-01 «Корпус и фланец захвата, деталировка» (КД 10) + Э3-06 «Сборочный чертёж захвата,
        спецификация, ведомость покупных» (КД 12) + Э3-07 «Расчёт грузоподъёмности и моментов на фланце»
        (КД 8) = 30 ч; у Онеги иной принцип (вакуум вместо пальцев), глубина та же — 32 ч'
    hours:
      КД: 32
  - id: '2.10'
    name: Тара брака, кожухи, ограждение зоны манипулятора
    result: выпущены чертежи тары с датчиком заполнения, кожухов первой ступени и ограждения
    basis:
      type: expert
      est: 16/24/34
    hours:
      КД: 24
  - id: '2.11'
    name: Пневматическая схема и спецификация пневматики
    result: выпущена пневмосхема, подобраны вакуумные генераторы, фильтры, расчёт расхода воздуха
    basis:
      type: norm
      ref: ГОСТ 2.704 (правила выполнения гидравлических и пневматических схем)
    hours:
      КД: 16
  - id: '2.12'
    name: Выпуск комплекта КД и нормоконтроль
    result: комплект КД подписан, спецификации сведены, замечания нормоконтроля закрыты
    basis:
      type: analog
      ref: 'П1: Э3-37 «Сводная спецификация и ведомость покупных изделий» (КД 8) + Э3-38 «Нормоконтроль
        комплекта КД» (КД 16) = 24 ч — у Онеги принято столько же'
    hours:
      КД: 24
  - id: '2.13'
    name: Узел возврата пачки в поток (собственная КД)
    result: выпущен сборочный чертёж накопительной дорожки на 3 пачки и сводящего модуля со спецификацией
    basis:
      type: expert
      est: 14/20/28
    hours:
      КД: 20
    note: Узел появился в составе 08.10.2026 при пересчёте компоновки, в смете работ учтён не был.
  - id: '2.14'
    name: Направляющие стабилизации пачки и туннельные кожухи проёмов
    result: выпущены чертежи направляющих с регулировкой под SKU и туннельного кожуха выходного проёма
      450 мм
    basis:
      type: expert
      est: 10/16/22
    hours:
      КД: 16
  - id: '2.15'
    name: Задание заказчику на подготовку площадки
    result: выпущено задание на подводы 380 В и сжатого воздуха, кабельные трассы, нагрузку на пол и точки
      врезки в конвейер
    basis:
      type: expert
      est: 8/12/16
    hours:
      КД: 8
      ЭЛ: 4
  - id: '2.16'
    name: Актуализация КД по факту изготовления и монтажа
    result: выпущены извещения об изменении и комплект КД «как построено» — чертежи и спецификации приведены
      к фактическому исполнению, передан заказчику
    note: Решения по отступлениям принимаются в 6.6 на сборке; здесь они только оформляются извещениями
      и сводятся в комплект — разведено по З-5 аудита 09.10
    basis:
      type: expert
      est: 12/20/28
    hours:
      КД: 20
- name: 3. Электропроект и шкаф управления
  tasks:
  - id: '3.1'
    name: Принципиальная электрическая схема комплекса
    result: выпущена принципиальная схема силовых и сигнальных цепей со спецификацией аппаратов
    basis:
      type: analog
      ref: 'П1: Э3-43 «Однолинейная схема питания, расчёт нагрузок, выбор аппаратов» (ЭЛ 12) + Э3-44 «Принципиальные
        схемы силовых цепей» (ЭЛ 16) + Э3-46 «Схемы цепей управления и датчиков» (ЭЛ 14) = 42 ч; у Онеги
        приводов вдвое меньше (транспортёр и станция против робота и четырёх серво) — 32 ч'
    hours:
      ЭЛ: 32
  - id: '3.2'
    name: Цепи безопасности и расчёт по ISO 13849-1
    result: выпущена схема цепей безопасности и расчёт достигнутого PL по каждой функции (целевой PL d)
    basis:
      type: norm
      ref: ISO 13849-1, методика расчёта PL; ISO 10218-2
    hours:
      ЭЛ: 24
  - id: '3.3'
    name: Компоновка шкафа управления
    result: выпущен сборочный чертёж шкафа со спецификацией, тепловой расчёт
    basis:
      type: analog
      ref: 'П1: Э3-47 «КД шкафа управления: компоновка, тепловой расчёт, IP в мокрой зоне» (ЭЛ 16) + Э3-50
        «Нормоконтроль электропроекта, ведомость покупных электрики» (ЭЛ 8) = 24 ч — у Онеги столько же:
        приводов меньше, но добавлены ПК зрения и питание шести считывателей'
    hours:
      ЭЛ: 24
  - id: '3.4'
    name: Схема внешних подключений и кабельный журнал
    result: выпущены схема подключений и кабельный журнал со спецификацией кабеля
    basis:
      type: norm
      ref: ПУЭ; внутренний чек-лист ЭМ-01
    hours:
      ЭЛ: 20
  - id: '3.5'
    name: Сборка и прозвонка шкафа
    result: шкаф собран, прозвонен, протокол проверки подписан
    basis:
      type: analog
      ref: 'П1: Э5-25 «Компоновка и монтаж аппаратов в шкафу» (ЭЛ 24) + Э5-26 «Разводка силовых цепей
        и цепей безопасности» (ЭЛ 24) + Э5-27 «Разводка цепей управления, маркировка» (ЭЛ 14) + Э5-28
        «Прозвонка, проверка по схеме» (ЭЛ 10) = ЭЛ 72 на шкаф ячейки с роботом, четырьмя серво и семью
        функциями безопасности. У Онеги один шкаф с ПЛК, ПК зрения и двумя приводами — принято 44 % этого
        объёма: ЭЛ 32 плюс МЕХ 16 на механическую часть панели. Масштаб различается вдвое, и это сознательно
        принятая, а не замеченная задним числом цифра'
    hours:
      ЭЛ: 32
      МЕХ: 16
  - id: '3.6'
    name: Электромонтаж на раме модуля
    result: модуль смонтирован электрически, кабельные трассы уложены, вводы уплотнены по IP65
    basis:
      type: expert
      est: 34/48/66
    hours:
      ЭЛ: 24
      МЕХ: 24
  - id: '3.7'
    name: Расчёт B10d и MTTFd в SISTEMA, протокол верификации PL
    result: файл SISTEMA по всем функциям безопасности и подписанный протокол верификации достигнутого
      PL
    basis:
      type: analog
      ref: П1, Э7-08…Э7-10 (SISTEMA, расчёт PL по семи функциям, протокол верификации) — 28 ч; у Онеги
        функций меньше
    hours:
      АСУ: 16
  - id: '3.8'
    name: Методика и протокол валидации функций безопасности
    result: выпущены методика валидации по ГОСТ ISO 13849-2 и заполненный протокол по каждой функции
    basis:
      type: analog
      ref: П1, Э7-18 «Методика валидации функций безопасности по ГОСТ ISO 13849-2» (КД 8, ГИП 10)
    hours:
      КД: 8
      АСУ: 8
  - id: '3.9'
    name: Параметрирование приводов транспортёра и станции разглаживания
    result: приводы настроены, параметры записаны в карту наладки, разгон и торможение согласованы с тактом
    basis:
      type: analog
      ref: П1, Э6-03 (ПНР двух приводов агрегата, АСУ 20 ЭЛ 8) и Э6-05 (сервоприводы захвата, АСУ 8 ЭЛ
        6)
    hours:
      АСУ: 16
      ЭЛ: 8
  - id: '3.10'
    name: Первичный пуск шкафа под напряжением
    result: протокол первичного пуска — питание подано, защиты и вторичные цепи проверены
    basis:
      type: analog
      ref: П1, Э6-01 «Первичный пуск шкафа, проверка питания и защит» (АСУ 6, ЭЛ 10)
    hours:
      АСУ: 6
      ЭЛ: 10
- name: 4. Программное обеспечение, зрение и алгоритмы
  note: Оценки по зрению и прикладному ПО поставлены здесь полностью (правило от 08.10.2026). Это самый
    тяжёлый по часам этап проекта и главный носитель риска по сроку.
  tasks:
  - id: '4.1'
    name: Архитектура ПО и протокол обмена с системой заказчика
    result: описание архитектуры и карта регистров Modbus TCP со схемой квитирования
    basis:
      type: expert
      est: 16/24/36
    hours:
      ПО: 24
  - id: '4.2'
    name: Модуль трекинга пачки по энкодеру
    result: работающий трекинг с подтверждённой на стенде точностью привязки кадра к координате
    basis:
      type: expert
      est: 22/32/46
    hours:
      ПО: 32
  - id: '4.3'
    name: Драйверы считывателей и арбитраж пяти ракурсов
    result: модуль многоракурсного считывания — одно решение на пачку из пяти параллельных попыток
    basis:
      type: expert
      est: 22/32/46
    hours:
      ПО: 32
  - id: '4.4'
    name: Предобработка изображения под металлизированную плёнку
    result: модуль подавления блика и нормализации с замеренным приростом доли декодирования на выборке
    basis:
      type: expert
      est: 20/32/48
    hours:
      ПО: 32
  - id: '4.5'
    name: Алгоритм локализации символа на мятой пачке
    result: детектор зоны кода с метрикой на отложенной выборке
    basis:
      type: expert
      est: 24/36/52
    hours:
      ПО: 36
  - id: '4.6'
    name: Дообучение и валидация модели локализации
    result: обученная модель с протоколом валидации и порогами срабатывания
    basis:
      type: expert
      est: 22/32/46
    hours:
      ПО: 32
  - id: '4.7'
    name: Оценка качества кода по ISO/IEC 15415 и запись в журнал
    result: модуль оценки класса кода, цифра пишется по каждой пачке и уходит в журнал
    basis:
      type: norm
      ref: ISO/IEC 15415; ТЗ п. 4.3
    hours:
      ПО: 24
  - id: '4.8'
    name: Логика ПЛК — цикл комплекса, байпас, отбраковка, блокировки
    result: программа ПЛК, отработанная на стенде, с проверенным переходом в байпас при отказе и при потере
      питания
    basis:
      type: expert
      est: 24/36/52
    hours:
      АСУ: 36
