# Сгенерировано generators/from_lead.py из сметы сделки. Правка = правка источника + пересборка.
# Деньги (ставки, себестоимость, маржа) сюда не попадают: только часы и цены закупки.
roles:
- А
- К
- Э
- М
role_names:
  А: АСУ ТП, программист, зрение, ПНР, управление проектом
  К: инженер-конструктор (КД, расчёты, документация)
  Э: инженер-электронщик (шкаф, электромонтаж, электропроект)
  М: слесарь-сборщик-монтажник
stages:
- name: 1. Инженерная проработка оптики и испытания на образцах
  note: Этап, которого нет в классической ячейке и без которого обещанный процент дочитывания — пустое
    число. Именно здесь гипотеза Q5 превращается в измеренную величину.
  tasks:
  - id: '1.1'
    name: Приёмка образцов и построение эталонной выборки
    result: размеченная выборка не менее 200 изображений несчитанных пачек с разбивкой по четырём причинам
    basis:
      type: expert
      est: 10/16/24
    hours:
      А: 16
  - id: '1.2'
    name: Лабораторный стенд оптики, подбор света и поляризации
    result: протокол подбора схемы освещения с замерами класса кода по ISO/IEC 15415 на каждой схеме
    basis:
      type: expert
      est: 20/32/48
    hours:
      А: 32
  - id: '1.3'
    name: Сравнительное испытание считывателей-кандидатов
    result: протокол сравнения 2–3 моделей на образцах, выбранная модель и доля дочитывания по группам
      причин
    basis:
      type: expert
      est: 16/24/36
    hours:
      А: 24
  - id: '1.4'
    name: Расчёт оптической схемы под скорость ленты
    result: расчётная записка — поле зрения, разрешение на модуль, выдержка, мощность строба, глубина
      резкости
    basis:
      type: norm
      ref: ISO/IEC 15415 и ISO/IEC 29158 (AIM DPM); бюджет смаза ≤1 пикселя
    hours:
      А: 16
  - id: '1.5'
    name: Испытание узла разглаживания на образцах
    result: протокол испытаний прижимной ленты — допустимое усилие, влияние на газонаполненную пачку и
      шов
    basis:
      type: expert
      est: 14/24/38
    hours:
      К: 16
      А: 8
  - id: '1.6'
    name: Отчёт по достижимому проценту дочитывания
    result: отчёт с подтверждённой на образцах цифрой, которая идёт в ПМИ и в гарантию
    basis:
      type: expert
      est: 10/16/24
    hours:
      А: 16
- name: 2. Конструкторская документация
  tasks:
  - id: '2.1'
    name: Компоновка модуля и увязка с линией
    result: чертёж общего вида, план встройки в разрыв конвейера, схема подводов
    basis:
      type: analog
      ref: П1, 07_estimate/wbs.yaml, пакет «Компоновка ячейки»
    hours:
      К: 32
  - id: '2.2'
    name: Рама из нержавеющей стали на колёсах с винтовыми опорами
    result: выпущен сборочный чертёж рамы со спецификацией, конструкция без карманов под мойку
    basis:
      type: analog
      ref: П1, пакет «Сборочный чертёж поста» — тот же класс сварной конструкции
    hours:
      К: 36
  - id: '2.3'
    name: Транспортёрный участок с энкодером
    result: выпущен сборочный чертёж транспортёра — привод, натяжение, установка энкодера, разрыв под
      нижний ракурс
    basis:
      type: expert
      est: 24/36/52
    hours:
      К: 36
  - id: '2.4'
    name: Узел прижимной ленты-разглаживателя (собственная КД)
    result: выпущен сборочный чертёж узла с регулировкой усилия и зазора, расчёт привода
    basis:
      type: expert
      est: 20/32/48
    hours:
      К: 32
  - id: '2.5'
    name: Крепление и юстировка пяти считывателей
    result: выпущены чертежи регулируемых кронштейнов и кожухов оптики с защитой от пыли
    basis:
      type: expert
      est: 16/24/36
    hours:
      К: 24
  - id: '2.6'
    name: Нижний ракурс — разрыв ленты со смотровым окном и обдувом
    result: выпущен чертёж узла нижнего ракурса с обдувом окна от крахмальной пыли
    basis:
      type: expert
      est: 14/20/28
    hours:
      К: 20
  - id: '2.7'
    name: Шлюз отвода остатка и дорожка-накопитель
    result: выпущен сборочный чертёж шлюза и накопителя на 8 пачек со спецификацией
    basis:
      type: expert
      est: 16/24/36
    hours:
      К: 24
  - id: '2.8'
    name: Пост активного разглаживания и дочитывания (собственная КД)
    result: выпущен сборочный чертёж поста — плита с вакуумной фиксацией, прокатный ролик, привод
    basis:
      type: expert
      est: 20/28/40
    hours:
      К: 28
  - id: '2.9'
    name: Вакуумный захват сильфонный пищевой, быстросъём (собственная КД)
    result: выпущен чертёж захвата со спецификацией присосок и расчётом удерживающего усилия
    basis:
      type: analog
      ref: П1, пакет «Захват» — та же глубина проработки, иной принцип
    hours:
      К: 32
  - id: '2.10'
    name: Тара брака, кожухи, ограждение зоны манипулятора
    result: выпущены чертежи тары с датчиком заполнения, кожухов первой ступени и ограждения
    basis:
      type: expert
      est: 16/24/34
    hours:
      К: 24
  - id: '2.11'
    name: Пневматическая схема и спецификация пневматики
    result: выпущена пневмосхема, подобраны вакуумные генераторы, фильтры, расчёт расхода воздуха
    basis:
      type: norm
      ref: ГОСТ 2.704 (правила выполнения гидравлических и пневматических схем)
    hours:
      К: 16
  - id: '2.12'
    name: Выпуск комплекта КД и нормоконтроль
    result: комплект КД подписан, спецификации сведены, замечания нормоконтроля закрыты
    basis:
      type: analog
      ref: П1, пакет «Выпуск КД»
    hours:
      К: 24
- name: 3. Электропроект и шкаф управления
  tasks:
  - id: '3.1'
    name: Принципиальная электрическая схема комплекса
    result: выпущена принципиальная схема силовых и сигнальных цепей со спецификацией аппаратов
    basis:
      type: analog
      ref: П1, пакет «Схема электрики»
    hours:
      Э: 32
  - id: '3.2'
    name: Цепи безопасности и расчёт по ISO 13849-1
    result: выпущена схема цепей безопасности и расчёт достигнутого PL по каждой функции (целевой PL d)
    basis:
      type: norm
      ref: ISO 13849-1, методика расчёта PL; ISO 10218-2
    hours:
      Э: 24
  - id: '3.3'
    name: Компоновка шкафа управления
    result: выпущен сборочный чертёж шкафа со спецификацией, тепловой расчёт
    basis:
      type: analog
      ref: П1, пакет «Компоновка щита»
    hours:
      Э: 24
  - id: '3.4'
    name: Схема внешних подключений и кабельный журнал
    result: выпущены схема подключений и кабельный журнал со спецификацией кабеля
    basis:
      type: norm
      ref: ПУЭ; внутренний чек-лист ЭМ-01
    hours:
      Э: 20
  - id: '3.5'
    name: Сборка и прозвонка шкафа
    result: шкаф собран, прозвонен, протокол проверки подписан
    basis:
      type: analog
      ref: П1, пакет «Сборка щита»
    hours:
      Э: 32
      М: 16
  - id: '3.6'
    name: Электромонтаж на раме модуля
    result: модуль смонтирован электрически, кабельные трассы уложены, вводы уплотнены по IP65
    basis:
      type: expert
      est: 34/48/66
    hours:
      Э: 24
      М: 24
- name: 4. Программное обеспечение, зрение и алгоритмы
  note: Оценки по зрению и прикладному ПО поставлены здесь полностью (правило от 08.10.2026). Это самый
    тяжёлый по часам этап проекта и главный носитель риска по сроку.
  tasks:
  - id: '4.1'
    name: Архитектура ПО и протокол обмена с системой заказчика
    result: описание архитектуры и карта регистров Modbus TCP со схемой квитирования
    basis:
      type: expert
      est: 16/24/36
    hours:
      А: 24
  - id: '4.2'
    name: Модуль трекинга пачки по энкодеру
    result: работающий трекинг с подтверждённой на стенде точностью привязки кадра к координате
    basis:
      type: expert
      est: 22/32/46
    hours:
      А: 32
  - id: '4.3'
    name: Драйверы считывателей и арбитраж пяти ракурсов
    result: модуль многоракурсного считывания — одно решение на пачку из пяти параллельных попыток
    basis:
      type: expert
      est: 22/32/46
    hours:
      А: 32
  - id: '4.4'
    name: Предобработка изображения под металлизированную плёнку
    result: модуль подавления блика и нормализации с замеренным приростом доли декодирования на выборке
    basis:
      type: expert
      est: 20/32/48
    hours:
      А: 32
  - id: '4.5'
    name: Алгоритм локализации символа на мятой пачке
    result: детектор зоны кода с метрикой на отложенной выборке
    basis:
      type: expert
      est: 24/36/52
    hours:
      А: 36
  - id: '4.6'
    name: Дообучение и валидация модели локализации
    result: обученная модель с протоколом валидации и порогами срабатывания
    basis:
      type: expert
      est: 22/32/46
    hours:
      А: 32
  - id: '4.7'
    name: Оценка качества кода по ISO/IEC 15415 и запись в журнал
    result: модуль оценки класса кода, цифра пишется по каждой пачке и уходит в журнал
    basis:
      type: norm
      ref: ISO/IEC 15415; ТЗ п. 4.3
    hours:
      А: 24
  - id: '4.8'
    name: Логика ПЛК — цикл комплекса, байпас, отбраковка, блокировки
    result: программа ПЛК, отработанная на стенде, с проверенным переходом в байпас при отказе и при потере
      питания
    basis:
      type: expert
      est: 24/36/52
    hours:
      А: 36
  - id: '4.9'
    name: Рецепты SKU и переналадка
    result: механизм рецептов и протокол замера переналадки на другой SKU (целевое ≤15 мин по ТЗ)
    basis:
      type: expert
      est: 16/24/36
    hours:
      А: 24
  - id: '4.10'
    name: HMI на русском языке
    result: экраны оператора, диагностика, журнал, права доступа — принято по чек-листу
    basis:
      type: analog
      ref: П1, пакет «HMI» — тот же объём экранов
    hours:
      А: 32
  - id: '4.11'
    name: Журнал событий на год с экспортом и хранением фото брака
    result: журнал с глубиной не менее 12 месяцев, экспорт, расчёт объёма хранилища под фото
    basis:
      type: expert
      est: 16/24/36
    hours:
      А: 24
  - id: '4.12'
    name: Алгоритм возврата пачки без двойного учёта
    result: алгоритм возврата в свободный промежуток с протоколом проверки «ошибок учёта 0» на стенде
    basis:
      type: expert
      est: 22/32/46
    hours:
      А: 32
  - id: '4.13'
    name: Программирование манипулятора второй ступени
    result: траектории съёма, разглаживания, подачи под считыватель и возврата, отработанные на стенде
    basis:
      type: analog
      ref: П1, пакет «Программирование и отладка цикла»
    hours:
      А: 32
  - id: '4.14'
    name: Интеграционное тестирование ПО на стенде
    result: протокол интеграционного прогона всех модулей вместе с имитацией системы заказчика
    basis:
      type: expert
      est: 22/32/46
    hours:
      А: 32
- name: 5. Закупка и поставка
  tasks:
  - id: '5.1'
    name: RFQ и размещение заказов по BOM
    result: размещены заказы по всем позициям спецификации, подтверждены сроки
    basis:
      type: analog
      ref: П1, пакет «RFQ и договоры с поставщиками»
    hours:
      А: 24
  - id: '5.2'
    name: Контроль графика поставки
    result: еженедельный статус по позициям, риски по срокам эскалированы вовремя
    basis:
      type: expert
      est: 10/16/24
    hours:
      А: 16
  - id: '5.3'
    name: Входной контроль оборудования
    result: акты входного контроля по всем позициям
    basis:
      type: norm
      ref: внутренний чек-лист ВК-02
    hours:
      А: 8
      Э: 8
- name: 6. Изготовление и сборка
  tasks:
  - id: '6.1'
    name: Изготовление рамы и обшивки из нержавеющей стали
    result: рама изготовлена, геометрия проверена, поверхности подготовлены под санобработку
    basis:
      type: expert
      est: 28/40/56
    hours:
      М: 40
  - id: '6.2'
    name: Изготовление транспортёрного участка и прижимной ленты
    result: транспортёр и узел разглаживания изготовлены и обкатаны вхолостую
    basis:
      type: expert
      est: 28/40/56
    hours:
      М: 40
  - id: '6.3'
    name: Изготовление поста разглаживания и захвата
    result: пост второй ступени и вакуумный захват изготовлены, проверено быстросъёмное крепление
    basis:
      type: expert
      est: 22/32/44
    hours:
      М: 32
  - id: '6.4'
    name: Сборка модуля, установка и юстировка считывателей
    result: модуль собран, пять ракурсов отъюстированы по эталонной пачке, зафиксированы
    basis:
      type: expert
      est: 34/48/66
    hours:
      М: 32
      К: 16
  - id: '6.5'
    name: Пневмомонтаж
    result: пневмосистема смонтирована, опрессована, расход воздуха замерен
    basis:
      type: expert
      est: 16/24/34
    hours:
      М: 24
  - id: '6.6'
    name: Авторский надзор конструктора на сборке
    result: отклонения от КД зафиксированы и закрыты изменениями
    basis:
      type: analog
      ref: П1, пакет «Авторский надзор»
    hours:
      К: 16
- name: 7. Заводские испытания (FAT)
  tasks:
  - id: '7.1'
    name: Программа и методика FAT
    result: согласованная ПМИ с измеримыми критериями и порядком подсчёта процента дочитывания
    basis:
      type: norm
      ref: внутренний шаблон ПМИ; ТЗ разд. 9
    hours:
      А: 16
  - id: '7.2'
    name: Прогон FAT на образцах заказчика с видеозаписью
    result: протокол FAT с замеренными долей дочитывания, повреждением пачек и временем переналадки
    basis:
      type: expert
      est: 28/40/52
    hours:
      А: 32
      К: 8
  - id: '7.3'
    name: Доводка по результатам FAT
    result: замечания FAT закрыты, повторный прогон по спорным пунктам пройден
    basis:
      type: expert
      est: 20/32/48
    hours:
      А: 32
- name: 8. Монтаж, пусконаладка и приёмка на площадке
  tasks:
  - id: '8.1'
    name: Подготовка к монтажу, логистика, такелаж
    result: модуль доставлен на площадку, подготовлено место, согласовано окно работ
    basis:
      type: expert
      est: 10/16/24
    hours:
      М: 16
  - id: '8.2'
    name: Механомонтаж и врезка в конвейер
    result: модуль установлен и выставлен, врезка выполнена в непроизводственное окно, байпас проверен
    basis:
      type: analog
      ref: П1, пакет «Монтаж» — сопоставимый объём механомонтажа
    hours:
      М: 32
      К: 8
  - id: '8.3'
    name: Электроподключение и проверка цепей безопасности
    result: комплекс запитан, функции безопасности проверены по протоколу, аварийный стоп испытан
    basis:
      type: norm
      ref: ПУЭ; ISO 13849-1, проверка достигнутого PL
    hours:
      Э: 24
  - id: '8.4'
    name: Пусконаладка зрения на реальной продукции
    result: пять ракурсов настроены по продукции заказчика, доля дочитывания замерена на линии
    basis:
      type: expert
      est: 28/40/56
    hours:
      А: 40
  - id: '8.5'
    name: Интеграция с системой заказчика и узлом агрегации
    result: обмен работает, двойной учёт исключён, проверено на партии не менее 2000 пачек
    basis:
      type: expert
      est: 22/32/46
    hours:
      А: 32
  - id: '8.6'
    name: Обучение персонала заказчика
    result: обучены наладчик и электрик КИПиА, протокол обучения подписан
    basis:
      type: analog
      ref: П1, пакет «Обучение»
    hours:
      А: 16
  - id: '8.7'
    name: Сопровождение SAT, 72 часа непрерывной работы
    result: протокол SAT с замерами по всем пяти критериям приёмки из раздела 9 ТЗ
    basis:
      type: norm
      ref: ТЗ разд. 9 — 72 ч на номинальной скорости
    hours:
      А: 32
  - id: '8.8'
    name: Устранение замечаний SAT
    result: замечания закрыты, акт пусконаладки подписан
    basis:
      type: expert
      est: 12/24/40
    hours:
      А: 24
- name: 9. Сертификация, подтверждение соответствия и документация
  note: Собственные часы. Стоимость испытаний в лаборатории и работ органа по сертификации — внешние услуги,
    идут в оборудование и услуги без наценки, см. 04_bom/bom.yaml.
  tasks:
  - id: '9.1'
    name: Паспорт и руководство по эксплуатации на русском языке
    result: выпущены паспорт и РЭ по ГОСТ, переданы заказчику
    basis:
      type: norm
      ref: ГОСТ 2.601, ГОСТ 2.610 (эксплуатационные документы)
    hours:
      К: 32
