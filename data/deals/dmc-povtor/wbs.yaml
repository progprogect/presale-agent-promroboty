- name: 11. Гарантийное сопровождение, 24 месяца
  note: 'ТЗ разд. 10 требует гарантию не менее 24 месяцев с даты акта пусконаладки независимо от наработки
    при режиме 24/7, раздел 6 — время реакции и выезды. В прежней редакции сметы гарантийных часов не
    было вовсе. Объём посчитан как ожидаемый, а не как худший случай. Норма выезда — 20 ч с дорогой на
    выезд (инженер и слесарь, один день), источник П2 Э17-03; шесть выездов = 120 ч. ОТКРЫТЫЙ ВОПРОС на
    решение директора (О-6 аудита 09.10): с какого момента течёт гарантия 24 мес. Принято — с акта пусконаладки
    (8.8), что ставит 8.13, 8.14 и 8.15 перед ним. Если заказчик настоит на отсчёте с даты поставки или
    с акта SAT, 80 ч этапа 8 попадают внутрь гарантийного периода и считаются дважды. Это условие договора,
    не строка сметы'
